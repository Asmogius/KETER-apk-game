/* ===========================================================================
   Attack effects: a small pixel projectile for ranged attacks, coloured by
   side, and text that floats above a Unit for two seconds \u2014 damage and debuffs
   in red, healing and buffs in green, Miss and -0 HP in white. Several texts
   over one Unit queue, one after another. Drawn on a layer of their own over
   the board, so they never disturb it.
   =========================================================================== */
var SIM_FX={queues:{}, shots:[], running:false};
var SIM_BUFFS={"evasive":1,"half cover":1,"full cover":1,"hardened":1};
function simBuff(name){ return !!SIM_BUFFS[String(name).toLowerCase()]; }
function simFxCanvas(){
  var host=$("simboard"); if(!host) return null;
  var c=$("simfx");
  if(!c){ c=document.createElement("canvas"); c.id="simfx"; host.appendChild(c); }
  var cv=$("simcanvas"); if(!cv) return null;
  if(c.width!==cv.width||c.height!==cv.height){ c.width=cv.width; c.height=cv.height; c.style.width=cv.style.width; c.style.height=cv.style.height; }
  return c;
}
function simScreenOf(u){
  if(!u||!u.pos) return null;
  var c=simCentre(u.pos.q,u.pos.r,SIM_VIEW.size);
  return {x:c.x+SIM_VIEW.ox, y:c.y+SIM_VIEW.oy};
}
var SIM_FX_COLOUR={damage:"#ff4a52", debuff:"#ff4a52", heal:"#6dff3a", buff:"#6dff3a", plain:"#f4f6f8"};
function simFloat(u, text, kind){
  if(!u) return;
  var q=SIM_FX.queues[u.id]=SIM_FX.queues[u.id]||{items:[], unit:u, held:false};
  q.unit=u; q.items.push({text:text, colour:SIM_FX_COLOUR[kind]||SIM_FX_COLOUR.plain, start:null});
  simFxRun();
}
/* hold a Unit's queue until its attack lands, so the damage reads before the
   statuses that attack caused */
function simFxHold(u){ if(!u) return; var q=SIM_FX.queues[u.id]=SIM_FX.queues[u.id]||{items:[], unit:u}; q.held=true; }
function simFxRelease(u, first){
  var q=SIM_FX.queues[u.id]=SIM_FX.queues[u.id]||{items:[], unit:u};
  if(first) q.items.unshift({text:first.text, colour:SIM_FX_COLOUR[first.kind]||SIM_FX_COLOUR.plain, start:null});
  q.held=false; simFxRun();
}
/* the result of an attack, as it should float */
function simHitText(res){
  if(res.hit===false) return {text:"Miss", kind:"plain"};
  if(res.damage) return {text:"-"+res.damage+" HP", kind:"damage"};
  return {text:"-0 HP", kind:"plain"};
}
/* a ranged attack flies; a melee one lands at once */
function simShot(attacker, target, action, done){
  var ranged=simAimed(action&&action.role);
  var a=simScreenOf(attacker), b=simScreenOf(target);
  if(!ranged || !a || !b){ done(); return; }
  var dist=Math.hypot(b.x-a.x,b.y-a.y), ms=Math.max(160,Math.min(480,dist*2.4));
  SIM_FX.shots.push({from:attacker, to:target, colour:attacker.side==="ally"?"#22f0ff":"#ff2a3c", ms:ms, start:null, done:done});
  simFxRun();
}
function simFxRun(){
  if(SIM_FX.running) return;
  SIM_FX.running=true;
  requestAnimationFrame(simFxFrame);
}
function simFxFrame(now){
  var c=simFxCanvas(); if(!c){ SIM_FX.running=false; return; }
  var g=c.getContext("2d"), dpr=SIM_VIEW.dpr||1, busy=false;
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,c.width/dpr,c.height/dpr);
  /* projectiles: a tiny pixel bolt, white core in the side's colour */
  SIM_FX.shots=SIM_FX.shots.filter(function(s){
    if(s.start===null) s.start=now;
    var t=Math.min(1,(now-s.start)/s.ms), a=simScreenOf(s.from), b=simScreenOf(s.to);
    if(!a||!b||t>=1){ if(s.done){ var d=s.done; s.done=null; d(); } return false; }
    var x=a.x+(b.x-a.x)*t, y=a.y+(b.y-a.y)*t, p=Math.max(3,Math.round(SIM_VIEW.size*0.12));
    g.fillStyle=s.colour;
    g.fillRect(Math.round(x-p*1.5),Math.round(y-p/2),p*3,p); g.fillRect(Math.round(x-p/2),Math.round(y-p*1.5),p,p*3);
    g.fillStyle="#ffffff"; g.fillRect(Math.round(x-p/2),Math.round(y-p/2),p,p);
    busy=true; return true;
  });
  /* floating text: the front of each Unit's queue, two seconds each */
  Object.keys(SIM_FX.queues).forEach(function(id){
    var q=SIM_FX.queues[id], it=q.items[0];
    if(!it) return;
    busy=true;
    if(q.held) return;
    if(it.start===null) it.start=now;
    var age=(now-it.start)/1000;
    if(age>=2){ q.items.shift(); return; }
    var at=simScreenOf(q.unit); if(!at) return;
    var alpha=age<1.2?1:Math.max(0,1-(age-1.2)/0.8), rise=age*10;
    var fs=Math.max(11,Math.round(SIM_VIEW.size*0.5));
    g.font="700 "+fs+"px ui-monospace,monospace"; g.textAlign="center"; g.textBaseline="bottom";
    var y=at.y-SIM_VIEW.size*0.95-rise;
    /* kept inside the board, so text over a Unit at the edge isn't cut off */
    var tw=g.measureText(it.text).width/2+4, W=c.width/dpr, x=Math.max(tw, Math.min(W-tw, at.x));
    y=Math.max(fs+2, y);
    g.globalAlpha=alpha; g.lineWidth=3; g.strokeStyle="rgba(4,8,12,0.9)"; g.strokeText(it.text,x,y);
    g.fillStyle=it.colour; g.fillText(it.text,x,y); g.globalAlpha=1;
  });
  if(busy) requestAnimationFrame(simFxFrame);
  else { SIM_FX.running=false; g.clearRect(0,0,c.width/dpr,c.height/dpr); }
}

/* ===========================================================================
   Burst (Revision 15.4, a Modifier): the Action is made N times in all for one
   payment of Energy. Each attack rolls and applies its effects separately. The
   next target is chosen each time \u2014 automatically when only one is in reach \u2014
   and a Burst runs to the end while a target remains.
   =========================================================================== */
/* A Burst waiting on its next target is only live while its Unit stands and
   the choice is still showing. Anything else \u2014 an undone phase, a new fight
   \u2014 clears it, so a stale Burst can never lock the fight. */
function simBurstLive(){
  var b=SIM.burst; if(!b) return false;
  var u=SIM.units.filter(function(x){ return x.id===b.unit; })[0];
  if(u && !u.down && SIM.pendingAct && SIM.pendingAct.burst && SIM.phase==="turn") return true;
  SIM.burst=null; if(SIM.pendingAct && SIM.pendingAct.burst) SIM.pendingAct=null;
  return false;
}
function simBurstOf(action){
  var m=String((action&&action.text)||"").match(/\[\[\s*Burst\s+(\d+)\s*\]\]/i);
  return m?Math.max(1,parseInt(m[1],10)):1;
}
function simBurstPool(attacker, action){
  var role=String(action.role||"").toLowerCase();
  return SIM.units.filter(function(f){
    return !f.down && f.pos && (role==="support" ? (f.side===attacker.side && f!==attacker) : f.side!==attacker.side) &&
      simCanReach(attacker, action, f, true);
  });
}
function simBurstContinue(attacker, action, left){
  if(left<=0 || attacker.down){ SIM.burst=null; SIM.pendingAct=null; SIM.odds=null; simSelect(null); simSave(); renderSim(); return; }
  var pool=simBurstPool(attacker, action);
  if(!pool.length){
    SIM.burst=null; SIM.pendingAct=null; SIM.odds=null;
    SIM.log.push({t:Date.now(), text:"The Burst ends: nothing left in reach"});
    simSelect(null); simSave(); renderSim(); return;
  }
  SIM.burst={unit:attacker.id, action:action.name, left:left};
  if(pool.length===1 || SIM.autoRunning){
    var t=pool.length===1?pool[0]:(R.chooseTarget(attacker,pool,{distance:function(u){ return R.hexDistance(attacker.pos,u.pos); }})||pool[0]);
    setTimeout(function(){ simConfirmAttack(attacker, t, action, left-1); }, SIM.autoRunning?60:520);
    return;
  }
  /* several in reach: light them, with their odds, and wait for a tap */
  SIM.selected=attacker.id; SIM.reach=[];
  var tg={}, odds={};
  pool.forEach(function(f){ var k=R.hexKey(f.pos.q,f.pos.r); tg[k]=f.id; odds[k]=simOdds(attacker,action,f); });
  SIM.pendingAct={unit:attacker.id, name:action.name, burst:true};
  SIM.targets=tg; SIM.odds=odds;
  simSay("Burst: choose the next target \u2014 "+left+" attack"+(left===1?"":"s")+" left.");
  simDraw(); renderSim();
}

function simMarkTargets(u){
  var out={};
  SIM.units.forEach(function(f){
    if(f.side===u.side || f.down || !f.pos) return;
    var can=(u.actions||[]).some(function(a){
      if(a.tag==="Passive"||a.tag==="Aura") return false;
      if(!R.canAfford(u,a)) return false;
      return simCanReach(u,a,f);
    });
    if(can) out[R.hexKey(f.pos.q,f.pos.r)]=f.id;
  });
  SIM.targets = Object.keys(out).length ? out : null;
}

/* Pick the Action, then resolve it. In Manual the resolver stops and asks for
   each roll; in Auto it never stops. Either way the same rules run. */
/* Anything the Simulator refuses to do says so here: silence reads as a broken
   button, which is exactly how this felt. */
function simSay(text){
  /* The attack code logs its result and then says it, so the same line went
     into the log twice. Saying something already just logged adds nothing. */
  var last=SIM.log[SIM.log.length-1];
  if(!last || last.text!==text) SIM.log.push({t:Date.now(), text:text});
  SIM.notice=text;
  simSave(); renderSim();
}

function simAttack(attacker, target){
  if(R.effective(attacker).cannotAct){
    simSay(attacker.name+" is Stunned and cannot act this turn."); return;
  }
  var d=R.hexDistance(attacker.pos,target.pos);
  var usable=(attacker.actions||[]).filter(function(a){
    if(a.tag==="Passive"||a.tag==="Aura") return false;
    if(!R.canAfford(attacker,a)) return false;
    return simCanReach(attacker,a,target);
  });
  if(!usable.length){
    /* This used to return in silence, so tapping an Enemy looked broken. */
    var all=(attacker.actions||[]).filter(function(a){
      return a.tag!=="Passive" && a.tag!=="Aura"; });
    var why;
    if(!all.length) why=attacker.name+" has no Action to attack with.";
    else{
      var afford=all.filter(function(a){ return R.canAfford(attacker,a); });
      if(!afford.length)
        why=attacker.name+" has "+(attacker.nrg||0)+" Energy left, and every Action costs more.";
      else if(afford.some(function(a){
          return simAimed(a.role) &&
            d<=(parseInt(a.rng,10)||1) && !simSees(attacker.pos,target.pos); }))
        why=attacker.name+" cannot see "+target.name+": a wall blocks every line between them.";
      else
        why=target.name+" is "+d+" tile"+(d===1?"":"s")+" away, out of reach of "+
          afford.map(function(a){
            var role=String(a.role||"").toLowerCase();
            return a.name+" ("+(simAimed(role)?("range "+(parseInt(a.rng,10)||1)):"melee")+")";
          }).join(", ")+".";
    }
    simSay(why);
    return;
  }
  if(usable.length===1) return simConfirmAttack(attacker,target,usable[0]);
  say("Which Action?",
    "<p>"+esc(attacker.name)+" against "+esc(target.name)+"</p>"+
    usable.map(function(a,i){
      var e=R.actionEffect(a);
      return '<div class="cbcard" data-simact="'+i+'" style="padding:9px 10px;'+
        'border:1px solid var(--line);border-radius:4px;margin-bottom:6px;cursor:pointer;">'+
        '<b style="color:var(--text);">'+esc(a.name)+"</b>"+
        '<i style="font-style:normal;display:block;font-size:11px;color:var(--dim);">'+
        (a.cost?a.cost+" NRG \u00b7 ":"")+(e.damage?e.damage+" damage":"no damage")+
        "</i></div>";
    }).join(""));
  window._simAtk={a:attacker.id, t:target.id, list:usable};
}
document.addEventListener("click",function(e){
  var row=e.target.closest?e.target.closest("[data-simact]"):null;
  if(!row||!window._simAtk) return;
  var w=window._simAtk;
  var a=SIM.units.filter(function(u){return u.id===w.a;})[0];
  var t=SIM.units.filter(function(u){return u.id===w.t;})[0];
  var act=w.list[+row.getAttribute("data-simact")];
  window._simAtk=null;
  $("modal").classList.remove("on");
  if(a&&t&&act) simConfirmAttack(a,t,act);
});

function simConfirmAttack(attacker, target, action, burstLeft){
  var total=simBurstOf(action);
  if(burstLeft===undefined||burstLeft===null) burstLeft=total-1;
  var follow=burstLeft<total-1;
  /* Revision 16.1: a Lunge closes the gap first, once for the Action */
  if(!follow && !simDoLunge(attacker, action, target)){ SIM.pendingAct=null; SIM.odds=null; simSelect(null); simSave(); renderSim(); return; }
  var cover=simCoverFor(target,attacker);
  var ctx={distance:R.hexDistance(attacker.pos,target.pos), cover:cover,
           evasive:target.evasive||0, rolls:{}};
  /* ask for whatever the rules want, one roll at a time */
  function step(){
    var c=Object.assign({}, ctx);
    if(SIM.autoRunning) c.dice=simDice(); else c.manual=true;
    var res=R.resolveAttack(attacker,simCharged(attacker,action),target,c);
    if(res.damage && simCharged(attacker,action)._charge) res.charge=simChargeOf(action);
    if(res.pending){
      simGetRoll({die:res.die, needed:res.needed,
        label:attacker.name+(res.pending==="accuracy"?" rolls to hit":" rolls to Penetrate"),
        pass:res.pending==="accuracy"?"Hit":"Penetrates", fail:res.pending==="accuracy"?"Miss":"Glances off",
        prompt:(res.pending==="accuracy"
          ? "Rolling to hit "+target.name+
            (cover?" \u2014 it has cover, so you need "+res.needed:"")
          : "Rolling to Penetrate Armor Class "+res.needed)},
        function(v){ ctx.rolls[res.pending]=v; step(); });
      return;
    }
    simApplyAttack(attacker,action,target,res,cover,{follow:follow, more:burstLeft>0});
    if(total>1) simBurstContinue(attacker, action, burstLeft);
  }
  step();
}
/* ===========================================================================
   The effect engine. Handbook 15.3.

   An effect's text is plain English with its rules words coloured. This reads
   the coloured words and carries them out; white text is flavour and is
   ignored. One sentence is one effect, read Condition, Target, Effect,
   Duration.

   What it cannot do it says, in two tones: plain text with no keywords is
   written into the log for the player, and an effect that carries keywords but
   could not resolve stops the fight until the player has seen it. A keyword
   that resolves to nothing \u2014 a Chain with no second Enemy \u2014 is named in
   the log, never silently skipped.
   =========================================================================== */
/* Revision 15.6: Conditions are grammar — [when] waits for an event, [if]
   checks as the effect resolves, [while] keeps an effect on while a state
   holds. Things that happen are announced as events; a Passive listening with
   [when] fires each time its event happens, never from anything its own effect
   set off. A Passive with no [when] is always on while its card is active. */
var SIM_EV={queue:[], busy:false, origin:[], dealer:null};
var SIM_INSTANT={"damage":1,"heal":1,"Push":1,"Deploy":1,"remove":1,"Sacrifice":1,"Recover":1,"Draw":1,"gain Aether":1,"Barricade":1};
function simEmit(type, subject, other, extra){
  if(!SIM || !SIM.units) return;
  SIM_EV.queue.push({type:type, subject:subject||null, other:other||null,
    status:(extra&&extra.status)||null, origin:SIM_EV.origin.slice()});
}
function simUnitById(id){ return (SIM.units||[]).filter(function(u){ return u.id===id; })[0]||null; }
function simLeaderUnit(){
  var l=(typeof simLeader==="function")?simLeader():null;
  return l||(SIM.units||[]).filter(function(u){ return u.side==="ally" && /hero/i.test(u.cardType||""); })[0]||null;
}
/* the rules report damage and statuses as they happen */
(function(){
  var RR=window.KETER_RULES; if(!RR || !RR.hooks) return;
  RR.hooks.hit=function(u, amount){
    if(!SIM || !SIM.units || SIM.units.indexOf(u)<0) return;
    var d=SIM_EV.dealer;
    u._lastDealer=(d && d!==u) ? d.id : null;
    simEmit("takes damage", u, d&&d!==u?d:null);
    if(d && d!==u) simEmit("deals damage", d, u);
  };
  RR.hooks.status=function(u, name){
    if(!SIM || !SIM.units || SIM.units.indexOf(u)<0) return;
    simEmit("gains", u, SIM_EV.dealer, {status:name});
  };
  /* v13.5 (Handbook 15.9): which half of the round a Status arrives in */
  RR.hooks.half=function(){ return simHalf(); };
})();
/* v13.5 (Handbook 15.9): the round has two halves. The Player's runs from the
   Recharge to the end of the Player's turn; the Enemies' is everything else
   (their turn, its end, the next wave, the Aether and the draw). A Status
   ticks at the end of the half after the one it arrived in. */
function simHalf(){ return (SIM && (SIM.phase==="turn" || SIM.phase==="recharge")) ? "ally" : "enemy"; }
/* The Player's turn ends: whatever arrived in the Enemies' half ticks now,
   as the rest ticks at the Recharge. */
function simTurnEndTick(){
  /* Revision 16.1: a Dash is for the turn it was given in */
  (SIM.units||[]).forEach(function(u){ if(u.side==="ally" && u.dash) u.dash=0; });
  R.turnEndTick(SIM.units).forEach(function(e){
    var u=SIM.units.filter(function(x){ return x.id===e.unit; })[0], nm=u?u.name:"A Unit";
    if(e.type==="tick"){ SIM.log.push({t:Date.now(), text:nm+" takes "+e.damage+" from "+e.name}); if(u) simFloat(u,"-"+e.damage+" HP","damage"); }
    else if(e.type==="status" && e.expired) SIM.log.push({t:Date.now(), text:nm+" is no longer "+e.name});
    else if(e.type==="mod" && e.expired) SIM.log.push({t:Date.now(), text:nm+"'s "+e.stat+" change wears off"});
  });
  simCheckDowns();
}
/* Every Passive that could be active: a Unit's own (and its Hero's Action
   Cards), Equipment while it is attached, and the Strike Team's Prototypes,
   which act through the leader. */
function simPassiveSources(){
  var out=[];
  (SIM.units||[]).forEach(function(u){
    (u.actions||[]).forEach(function(a,ai){
      if(!a.text || !/^(passive|aura)$/i.test(a.tag||"")) return;
      out.push({pid:u.id+":a"+ai, owner:u, holder:null, text:a.text, name:a.name||u.name});
    });
    (u.equipFx||[]).forEach(function(eq,ei){
      (eq.fx||[]).forEach(function(f,fi){
        if(!f.text || !/^(passive|aura)$/i.test(f.kind||"")) return;
        out.push({pid:u.id+":e"+ei+"."+fi, owner:u, holder:u, text:f.text, name:eq.name});
      });
    });
  });
  var lead=simLeaderUnit();
  if(lead) (SIM.protos||[]).forEach(function(pr,pi){
    var fx=pr.fx||(pr.text?[{kind:"Passive", text:pr.text}]:[]);
    fx.forEach(function(f,fi){
      if(!f.text || !/^(passive|aura)$/i.test(f.kind||"Passive")) return;
      out.push({pid:"proto"+pi+"."+fi, owner:lead, holder:null, text:f.text, name:pr.name, proto:true});
    });
  });
  return out;
}
function simFlushEvents(){
  var K=window.KETER_KW;
  if(SIM_EV.busy || !K || !SIM.units) return;
  SIM_EV.busy=true;
  var guard=0;
  try{
    while(SIM_EV.queue.length && guard<200){
      guard++;
      var ev=SIM_EV.queue.shift();
      simPassiveSources().forEach(function(src){
        /* a Passive never fires from anything its own effect set off */
        if(ev.origin.indexOf(src.pid)>=0) return;
        var owner=src.owner;
        if(!owner.pos) return;
        if(owner.down && !(ev.type==="is Incapacitated" && ev.subject===owner)) return;
        K.sentences(src.text).forEach(function(sent){
          var an=K.analyse(sent);
          if(!an.when) return;
          var ctx={actor:owner, holder:src.holder, sourceCard:src.name, kind:"passive", event:ev,
                   subject:ev.subject, target:ev.other, pid:src.pid};
          if(!simWhenMatches(an.when, ev, ctx)) return;
          SIM_EV.origin=ev.origin.concat([src.pid]);
          try{ simRunSentence(sent, ctx, an); } finally { SIM_EV.origin=[]; }
        });
      });
      /* anything those Passives put down is an event too */
      simCheckDowns(true);
    }
  } finally { SIM_EV.busy=false; }
  if(SIM_EV.queue.length){
    SIM_EV.queue=[];
    simLogEffect("Passives stopped after 200 events in a row, so none could run forever");
  }
}

/* effect text as it reads on the card: no markers, distances in tiles */
function kwPlain(t){ return window.KETER_KW&&window.KETER_KW.render ? window.KETER_KW.render(t) : String(t||""); }
function simLogEffect(text){ SIM.log.push({t:Date.now(), text:text}); }
function simEffectHalt(text){
  SIM.log.push({t:Date.now(), text:text, halt:true});
  SIM.halted=text;
}
function simSentences(text){
  return window.KETER_KW ? window.KETER_KW.sentences(text) : String(text||"").split(/(?<=[.!?])\s+/)
    .map(function(t){ return t.trim(); }).filter(Boolean);
}
function simClassify(sent){
  var K=window.KETER_KW, out={cond:[], targ:[], eff:[], dur:[], bad:[]};
  K.parse(sent).forEach(function(p){
    if(p.type!=="kw") return;
    if(!p.kw){ out.bad.push(p); return; }
    /* Modifiers and Stats (Revision 15.4) are carried out with the Effects */
    ({condition:out.cond, target:out.targ, effect:out.eff, status:out.eff,
      duration:out.dur, modifier:out.eff, stats:out.eff})[p.kw.cat].push(p);
  });
  return out;
}
function simEnemiesOf(u){ return SIM.units.filter(function(x){ return !x.down && x.side!==u.side; }); }
function simAlliesOf(u){ return SIM.units.filter(function(x){ return !x.down && x.side===u.side; }); }
function simDist(a,b){ return (a&&b)?R.hexDistance(a,b):99; }

/* Who a sentence happens to. Revision 15.6: each Target carries its own
   narrowing words — two of a kind mean either, different kinds mean both. */
function simNarrowOK(u, narrow, ctx){
  if(!narrow || !narrow.length) return true;
  var by={};
  narrow.forEach(function(q){ var k=q.kw.narrow||"archetype"; (by[k]=by[k]||[]).push(q); });
  return Object.keys(by).every(function(kind){
    return by[kind].some(function(q){
      if(kind==="subtype") return (u.roles||[]).map(function(x){ return String(x).toLowerCase(); }).indexOf(q.kw.name.toLowerCase())>=0;
      if(kind==="archetype") return (u.archetypes||[]).some(function(a){ return String(a).toLowerCase()===q.kw.name.toLowerCase(); });
      if(kind==="district") return (u.affinities||[]).some(function(a){ return String(a&&a.district)===String(q.n); });
      if(kind==="distance") return !!(ctx.actor && ctx.actor.pos && u.pos) && simDist(u.pos, ctx.actor.pos)<=(parseInt(q.n,10)||0);
      /* Revision 16.3: Troop or Hero */
      if(kind==="cardtype") return String(u.cardType||"").toLowerCase()===q.kw.name.toLowerCase();
      return false;
    });
  });
}
function simResolveTargets(targ, ctx){
  var actor=ctx.actor, centre=ctx.tile||(ctx.target&&ctx.target.pos)||(actor&&actor.pos);
  /* Targets arrive as groups (a Target and its narrowing words); a plain list
     of keyword parts, as older callers pass, is grouped here */
  var groups=(targ||[]).map(function(t){ return t.part ? t : {part:t, narrow:[]}; });
  var plain=[];
  groups=groups.filter(function(g){
    if(g.part.kw.narrow){ if(plain.length) plain[plain.length-1].narrow.push(g.part); return false; }
    plain.push(g); return true;
  });
  var who=null, narrow=[];
  /* In a Passive or an Aura an area is centred on the Unit itself */
  if(ctx.kind==="passive" && !ctx.tile) centre=actor&&actor.pos;
  /* "all units within 1 of target tile": the area decides who, and target tile
     or target enemy only says where it is centred. Read in turn, the second
     Target word simply overwrote the first, so only the tile's own Unit was hit. */
  var hasArea=groups.some(function(g){ return /^all (enemies|allies|units) within$/.test(g.part.kw.name); });
  groups.forEach(function(g){
    var p=g.part, k=p.kw.name, n=parseInt(p.n,10)||0;
    narrow=narrow.concat(g.narrow||[]);
    if(hasArea && /^target /.test(k)) return;
    if(k==="target enemy") who=(ctx.target&&ctx.target.side!==actor.side)?[ctx.target]:[];
    /* a card from the hand has no user of its own — the leader stands in — so
       it may target the leader like any other friendly Unit */
    else if(k==="target ally") who=(ctx.target&&ctx.target.side===actor.side&&(ctx.fromHand||ctx.target!==actor))?[ctx.target]:[];
    else if(k==="target tile") who=ctx.tile?SIM.units.filter(function(u){
        return !u.down && u.pos && u.pos.q===ctx.tile.q && u.pos.r===ctx.tile.r; }):[];
    else if(k==="this Unit") who=[actor];
    else if(k==="attached Unit") who=[ctx.holder||actor];
    else if(k==="that Unit") who=ctx.subject?[ctx.subject]:[];
    else if(k==="the target") who=ctx.target?[ctx.target]:[];
    else if(k==="all enemies within") who=simEnemiesOf(actor).filter(function(u){ return simDist(u.pos,centre)<=n; });
    else if(k==="all allies within") who=simAlliesOf(actor).filter(function(u){ return (ctx.fromHand||u!==actor) && simDist(u.pos,centre)<=n; });
    else if(k==="all units within") who=SIM.units.filter(function(u){ return !u.down && u.pos && simDist(u.pos,centre)<=n; });
    /* Revision 16.3: a whole side, wherever it stands */
    else if(k==="all allies") who=simAlliesOf(actor).filter(function(u){ return u.pos; });
    else if(k==="all enemies") who=simEnemiesOf(actor).filter(function(u){ return u.pos; });
    else if(k==="adjacent") who=(who||SIM.units).filter(function(u){ return !u.down && u.pos && simDist(u.pos,centre)===1; });
  });
  if(!who) who=ctx.target?[ctx.target]:(actor?[actor]:[]);
  if(narrow.length) who=who.filter(function(u){ return simNarrowOK(u, narrow, ctx); });
  return who;
}

/* Who a Condition is about, before its event or state is looked at */
function simSubjectPool(c, ctx){
  var sn=c.subject?c.subject.kw.name:"", a=ctx.actor, pool;
  if(sn==="this Unit") pool=[a];
  else if(sn==="attached Unit") pool=[ctx.holder||a];
  else if(sn==="the target") pool=ctx.target?[ctx.target]:[];
  else if(sn==="that Unit") pool=ctx.subject?[ctx.subject]:[];
  else if(sn==="an ally") pool=simAlliesOf(a).filter(function(u){ return u!==a; });
  else if(sn==="an enemy") pool=simEnemiesOf(a);
  else if(sn==="any Unit") pool=(SIM.units||[]).filter(function(u){ return !u.down && u.pos; });
  else pool=[];
  return pool.filter(function(u){ return u && simNarrowOK(u, c.narrow, ctx); });
}
/* A [when] clause against something that happened */
function simWhenMatches(c, ev, ctx){
  var e=c.event.kw, a=ctx.actor;
  /* "ends its move within" listens for a move, then measures where it ended */
  if((e.name==="ends its move within" ? "moves" : e.name)!==ev.type) return false;
  if(e.name==="gains" && String(c.event.n||"").trim().toLowerCase()!==String(ev.status||"").toLowerCase()) return false;
  if(e.noSubject) return true;
  var s=ev.subject, sn=c.subject?c.subject.kw.name:"";
  if(!s) return false;
  var ok = sn==="this Unit" ? s===a
         : sn==="attached Unit" ? s===(ctx.holder||a)
         : sn==="an ally" ? (s.side===a.side && s!==a)
         : sn==="an enemy" ? s.side!==a.side
         : sn==="any Unit";
  if(!ok || !simNarrowOK(s, c.narrow, ctx)) return false;
  if(e.name==="ends its move within")
    return !!(s.pos && a.pos) && simDist(s.pos, a.pos)<=(parseInt(c.event.n,10)||0);
  return true;
}
function simStateOf(u, c, ctx){
  var e=c.event.kw, n=parseInt(c.event.n,10)||0, a=ctx.actor;
  if(e.name==="is below half HP") return u.hp < u.hpMax/2;
  if(e.name==="is at full HP") return u.hp >= u.hpMax;
  if(e.name==="has") return R.hasStatus(u, String(c.event.n||"").trim());
  if(e.name==="is within") return !!(u.pos && a && a.pos) && simDist(u.pos, a.pos)<=n;
  if(e.name==="is further than") return !!(u.pos && a && a.pos) && simDist(u.pos, a.pos)>n;
  return false;
}
/* An [if] or [while] check. In an Action, [if] may also ask about what the
   Action itself just did: whether it damaged, whether it killed. */
function simCheck(c, ctx){
  var e=c.event.kw, sn=c.subject?c.subject.kw.name:"";
  if(e.role==="event"){
    if(e.name==="takes damage") return {ok: sn==="this Unit" ? !!ctx.selfDamaged : !!ctx.damaged};
    if(e.name==="deals damage") return {ok: sn==="this Unit" && !!ctx.damaged};
    if(e.name==="kills an enemy") return {ok: sn==="this Unit" && !!ctx.killed};
    if(e.name==="is Incapacitated") return {ok: sn==="this Unit" ? !!(ctx.actor&&ctx.actor.down) : !!ctx.killed};
    return {ok:false};
  }
  var hit=simSubjectPool(c, ctx).filter(function(u){ return simStateOf(u, c, ctx); })[0];
  return {ok:!!hit, who:hit||null};

/* kept for anything still asking about a single old-style Condition */
function simCondition(p, ctx){
  var K=window.KETER_KW, an=K.analyse(K.migrateText("[["+p.kw.name+(p.n?" "+p.n:"")+"]]"));
  var c=an.check||an.when; return c ? simCheck(c, ctx).ok : true;
}

/* The tile that continues the line from one Unit through another: straight
   away from an attacker, or directly behind a target. Choosing any tile further
   from the attacker instead let several tie, so Push slid sideways and Pierce
   could hit the wrong Unit. */
/* Revision 16.3: the tiles a Line or a Cone covers, from the attacker toward its aim.
   A Line is the run of tiles straight on, that many long; a Cone every tile that
   many deep or less whose bearing is within 30 degrees of the aim's. */
function simShapeTiles(kind, from, aim, n){
  var out=[];
  if(kind==="Line"){
    var a=simCentre(from.q,from.r,1), b=simCentre(aim.q,aim.r,1), dx=b.x-a.x, dy=b.y-a.y, best=null, bd=-1e9;
    [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]].forEach(function(d){
      var c=simCentre(from.q+d[0],from.r+d[1],1), dot=(c.x-a.x)*dx+(c.y-a.y)*dy;
      if(dot>bd){ bd=dot; best={q:from.q+d[0], r:from.r+d[1]}; }
    });
    var cur=best;
    for(var i=0;i<n && cur;i++){ out.push(cur); cur=simLineStep(from, cur); }
    return out;
  }
  var A=simCentre(from.q,from.r,1), B=simCentre(aim.q,aim.r,1), ang=Math.atan2(B.y-A.y,B.x-A.x);
  Object.keys(SIM.map.hexes).forEach(function(key){
    var q=+key.split(",")[0], r=+key.split(",")[1], d=R.hexDistance(from,{q:q,r:r});
    if(d<1||d>n) return;
    var C=simCentre(q,r,1), da=Math.abs(Math.atan2(C.y-A.y,C.x-A.x)-ang);
    if(da>Math.PI) da=2*Math.PI-da;
    if(da<=Math.PI/6+1e-6) out.push({q:q,r:r});
  });
  return out;
}
/* the District whose Aether a "gain Aether" gives: the card's own, or for a
   Unit's ability the Unit's; none means Neutral */
function simAetherDistrict(ctx){
  var c=ctx.sourceCard?simAllCards().filter(function(x){ return x.name===ctx.sourceCard; })[0]:null;
  var aff=(c&&c.affinities&&c.affinities[0]) || (ctx.actor&&ctx.actor.affinities&&ctx.actor.affinities[0]) || null;
  var d=aff&&aff.district; return (d && d!=="any" && d!=="neu") ? String(d) : null;
}
/* the floor's colour for a Barricade, added to its key if it has none */
function simCoverColour(which){
  var labels=SIM.map.colorLabels=SIM.map.colorLabels||{}, want=which==="Full"?"cover-full":"cover-half";
  var hit=Object.keys(labels).filter(function(k){ return simTileKind(labels[k])===want; })[0];
  if(hit!==undefined) return isNaN(+hit)?hit:+hit;
  var k=which==="Full"?5:1; while(labels[k]!==undefined) k++;
  labels[k]=which+" Cover Barricade"; return k;
}
function simLineStep(from, at){
  var a=simCentre(from.q,from.r,1), b=simCentre(at.q,at.r,1), dx=b.x-a.x, dy=b.y-a.y;
  var best=null, bd=-1e9;
  [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]].forEach(function(d){
    var n={q:at.q+d[0], r:at.r+d[1]}, c=simCentre(n.q,n.r,1);
    var dot=(c.x-b.x)*dx+(c.y-b.y)*dy;
    if(dot>bd){ bd=dot; best=n; }
  });
  return best;
}
/* Push: straight away from whoever pushed. Blocked, it stops and takes 1 damage
   per tile it could not move \u2014 and a Unit that blocked it takes the same. */
function simPush(u, from, tiles){
  if(!u.pos||!from) return "nowhere to push from";
  var moved=0;
  for(var i=0;i<tiles;i++){
    var best=simLineStep(from, u.pos);
    var key=R.hexKey(best.q,best.r);
    var wallKey=[R.hexKey(u.pos.q,u.pos.r),key].sort().join("|");
    var blocker=simUnitAt(best.q,best.r);
    var off=!SIM.map.hexes[key], walled=!!(SIM.map.walls||{})[wallKey];
    if(off||walled||blocker){
      var left=tiles-i;
      R.hit(u,left);
      var why=blocker?blocker.name:(walled?"a wall":"the edge of the floor");
      if(blocker){ R.hit(blocker,left); }
      return (moved?"pushed "+moved+", then ":"")+"hit "+why+": "+left+" damage to "+u.name+
        (blocker?" and "+blocker.name:"");
    }
    u.pos=best; moved++;
    simHazardHit(u,"is pushed onto");
  }
  return "pushed "+moved+" tile"+(moved===1?"":"s");
}

function simApplyKeyword(p, who, ctx, dur){
  var k=p.kw.name, n=parseInt(String(p.n||"").replace(/[^0-9-]/g,""),10);
  var name=ctx.actor?ctx.actor.name:"The effect";
  if(p.kw.cat==="status"){
    /* 15.4: the number is strength, the Duration gives the turns (1 if none) */
    var turns=null;
    if(dur){ turns = dur.kw.name==="turns" ? (parseInt(dur.n,10)||1) : 999; }
    var strength=R.strengthless(k)?null:(isNaN(n)?1:n);
    /* Handbook 16.0: a lock doesn't stack, and doesn't land again just after it ends */
    var guarded=who.filter(function(u){ return R.lockBlock(u,k)==="guard"; });
    var already=who.filter(function(u){ return R.lockBlock(u,k)==="already"; });
    if(guarded.length) simLogEffect(guarded.map(function(u){ return u.name; }).join(", ")+" "+(String(k).toLowerCase()==="stunned"?"just came out of a Stun":"was only just "+k)+" and shrug"+(guarded.length===1?"s":"")+" it off");
    if(already.length) simLogEffect(already.map(function(u){ return u.name; }).join(", ")+(already.length===1?" is":" are")+" already "+k);
    if(guarded.length||already.length){
      who=who.filter(function(u){ return !R.lockBlock(u,k); });
      if(!who.length) return;
    }
    if(R.isLock(k) && turns!==null) turns=Math.min(turns,R.LOCK_MAX_TURNS);
    who.forEach(function(u){ R.addStatus(u,k,R.strengthless(k)&&!isNaN(n)&&turns===null?n:strength,name,turns); simFloat(u, k+(strength!==null?" "+strength:""), simBuff(k)?"buff":"debuff"); });
    var tt=turns!==null?turns:(R.strengthless(k)&&!isNaN(n)?n:1);
    if(R.isLock(k)) tt=Math.min(tt,R.LOCK_MAX_TURNS);
    simLogEffect(who.map(function(u){ return u.name; }).join(", ")+" gain"+(who.length===1?"s ":" ")+
      k+(strength!==null?" "+strength:"")+(tt>=999?"":" for "+tt+" turn"+(tt===1?"":"s")));
    return;
  }
  if(k==="Burst"||k==="Lunge"||k==="Charge") return;   /* carried out by the attack itself */
  /* Revision 16.1: Dash. One of yours may move that much more this turn; an
     Enemy Dashes at once, away from the Unit it attacked. */
  if(k==="Dash"){
    var dn=isNaN(n)?1:Math.max(1,n);
    who.forEach(function(u){
      if(u.down || !u.pos) return;
      if(u.side==="enemy"){ simLogEffect(simDashAway(u, (ctx.target && ctx.target.side!==u.side)?ctx.target:null, dn)); return; }
      u.dash=(+u.dash||0)+dn;
      simLogEffect(u.name+" may Dash "+dn+" tile"+(dn===1?"":"s")+" more this turn");
    }); return;
  }
  /* Leap: for as long as its Duration, or with none for the rest of the fight */
  if(k==="Leap"){
    var ln=isNaN(n)?1:Math.max(1,n);
    who.forEach(function(u){
      if(dur){
        var lm={stat:"LEAP", amt:ln, dur:dur.kw.name, n:parseInt(dur.n,10)||null, source:ctx.sourceCard||name};
        if(lm.dur==="turns" && simHalf()==="enemy") lm.late=true;
        u.mods=u.mods||[]; u.mods.push(lm);
      } else u.leap=Math.max(+u.leap||0, ln);
    });
    simLogEffect(who.map(function(u){ return u.name; }).join(", ")+" can Leap "+ln+" tile"+(ln===1?"":"s")+
      (dur?" ("+dur.kw.name+(dur.n?" "+dur.n:"")+")":"")); return;
  }
  if(k==="damage"){
    who.forEach(function(u){ R.hit(u,n||0); simFloat(u,"-"+(n||0)+" HP","damage"); });
    /* Revision 16.3: on a card with no attack of its own (Aether Lance), this is the damage its AoE, Line or Cone carries on */
    if(!(ctx.damage>0)) ctx.damage=n||0;
    simLogEffect(who.map(function(u){ return u.name; }).join(", ")+" take"+(who.length===1?"s ":" ")+
      (n||0)+" damage"); return;
  }
  if(k==="heal"){
    who.forEach(function(u){
      var before=u.hp; u.hp=Math.min(u.hpMax, u.hp+(n||0));
      if(u.hp>before) simFloat(u,"+"+(u.hp-before)+" HP","heal");
      simLogEffect(u.name+(u.hp===before?" is already at full Health":" heals "+(u.hp-before)));
    }); return;
  }
  /* Stats (Revision 15.4), one keyword per stat, replacing Modify */
  if(p.kw.cat==="stats"){
    var amt=parseInt(String(p.n||"").replace(/[^0-9+-]/g,""),10);
    if(isNaN(amt)){ simEffectHalt(k+" on "+name+" gives no amount."); return; }
    if(!dur){ simEffectHalt(window.KETER_KW.label(p)+" on "+name+" has no Duration, so it would last no time."); return; }
    var stat=(k==="Range")?"RANGE":k;
    who.forEach(function(u){
      u.mods=u.mods||[];
      var mod={stat:stat, amt:amt, dur:dur.kw.name, n:parseInt(dur.n,10)||null, source:ctx.sourceCard||name};
      /* v13.5 (Handbook 15.9): a timed change that arrives in the Enemies' half ticks when your next turn ends */
      if(mod.dur==="turns" && simHalf()==="enemy") mod.late=true;
      u.mods.push(mod);
      if(stat==="HP"){ u.hpMax=Math.max(1,u.hpMax+amt); u.hp=amt>0?u.hp+amt:Math.min(u.hp,u.hpMax); }
      if(stat==="NRG"){ u.nrgMax=Math.max(0,(u.nrgMax||0)+amt); u.nrg=Math.max(0,(u.nrg||0)+amt); }
    });
    simLogEffect(who.map(function(u){ return u.name; }).join(", ")+": "+window.KETER_KW.label(p)+
      " ("+dur.kw.name+(dur.n?" "+dur.n:"")+")"); return;
  }
  if(k==="Push"){
    who.forEach(function(u){ simLogEffect(u.name+" "+simPush(u, ctx.actor.pos, n||1)); }); return;
  }
  /* AoE, Chain and Pierce carry the attack's damage on. When the attack did no
     damage there is nothing to carry, which read as "Chain jumps for 0". */
  if((k==="AoE"||k==="Chain"||k==="Pierce"||k==="Line"||k==="Cone") && !(ctx.damage>0)){
    simLogEffect((ctx.sourceCard||k)+" did no damage, so its "+k+" carried nothing on"); return;
  }
  if(k==="AoE"){
    var centre=ctx.tile||(ctx.target&&ctx.target.pos);
    var hitAll=SIM.units.filter(function(u){ return !u.down && u.pos && u!==ctx.target && simDist(u.pos,centre)<=(n||1); });
    if(!hitAll.length){ simLogEffect("AoE caught nobody else"); return; }
    hitAll.forEach(function(u){ R.hit(u, ctx.damage||0); simFloat(u,"-"+(ctx.damage||0)+" HP","damage"); });
    simLogEffect("AoE "+(n||1)+" also hits "+hitAll.map(function(u){ return u.name; }).join(", ")+
      " for "+(ctx.damage||0)); return;
  }
  if(k==="Chain"){
    var from=ctx.target&&ctx.target.pos;
    var next=simEnemiesOf(ctx.actor).filter(function(u){ return u!==ctx.target && simDist(u.pos,from)<=(n||1); })
      .sort(function(a,b){ return simDist(a.pos,from)-simDist(b.pos,from); })[0];
    if(!next){ simLogEffect("Chain found no second Enemy"); return; }
    R.hit(next, ctx.damage||0); simFloat(next,"-"+(ctx.damage||0)+" HP","damage");
    simLogEffect("Chain jumps to "+next.name+" for "+(ctx.damage||0)); return;
  }
  if(k==="Pierce"){
    var a=ctx.actor.pos, t=ctx.target&&ctx.target.pos;
    if(!a||!t){ simLogEffect("Pierce had no line to follow"); return; }
    var best=simLineStep(a, t);
    var behind=best?simUnitAt(best.q,best.r):null;
    if(!behind){ simLogEffect("Pierce found nobody behind "+ctx.target.name); return; }
    R.hit(behind, ctx.damage||0); simFloat(behind,"-"+(ctx.damage||0)+" HP","damage");
    simLogEffect("Pierce carries through to "+behind.name+" for "+(ctx.damage||0)); return;
  }
  /* Revision 16.3: Line and Cone carry the attack's damage to everyone in their shape */
  if(k==="Line"||k==="Cone"){
    var from=ctx.actor&&ctx.actor.pos, aim=ctx.tile||(ctx.target&&ctx.target.pos);
    if(!from||!aim){ simLogEffect(k+" had no direction to go in"); return; }
    var shaped=simShapeTiles(k, from, aim, n||1).map(function(t){ return simUnitAt(t.q,t.r); })
      .filter(function(u){ return u && u!==ctx.target && u!==ctx.actor; });
    if(!shaped.length){ simLogEffect(k+" "+(n||1)+" caught nobody else"); return; }
    shaped.forEach(function(u){ R.hit(u, ctx.damage||0); simFloat(u,"-"+(ctx.damage||0)+" HP","damage"); });
    simLogEffect(k+" "+(n||1)+" also hits "+shaped.map(function(u){ return u.name; }).join(", ")+" for "+(ctx.damage||0)); return;
  }
  /* Revision 16.3: drawing cards and gaining Aether are yours to do; on an Enemy's card they do nothing */
  if(k==="Draw"||k==="gain Aether"){
    if(!ctx.actor || ctx.actor.side!=="ally"){ simLogEffect(k==="Draw"?"An Enemy has no cards to draw":"An Enemy has no Aether to gain"); return; }
    var amt=isNaN(n)?1:Math.max(0,n);
    /* a nameless Passive is told by its Unit's name, not "(unnamed)" */
    var by=(ctx.sourceCard && ctx.sourceCard!=="(unnamed)") ? ctx.sourceCard : ((ctx.actor&&ctx.actor.name)||name);
    if(k==="Draw"){
      var drawn=0;
      for(var di=0; di<amt && ((SIM.deck||[]).length || simRefillDeck()); di++){ SIM.hand.push(SIM.deck.shift()); drawn++; }
      simLogEffect(drawn ? by+": drew "+drawn+" card"+(drawn===1?"":"s") : "The Deck is empty: nothing to draw");
      return;
    }
    var dist=simAetherDistrict(ctx), key=dist?"d"+dist:"generic", gain={}; gain[key]=amt;
    SIM.aether=SIM.aether||{}; R.aetherAdd(SIM.aether, gain);
    simLogEffect(by+": gained "+simAetherLabel(gain)+" Aether"); return;
  }
  /* Revision 16.3: a Half or Full Cover Barricade on an empty tile, for the rest of the fight */
  if(k==="Barricade"){
    var which=/^full$/i.test(String(p.n||"").trim())?"Full":/^half$/i.test(String(p.n||"").trim())?"Half":null;
    var spot=ctx.tile;
    if(!which){ simEffectHalt("Barricade on "+(ctx.sourceCard||name)+" does not say Half or Full."); return; }
    if(!spot){ simLogEffect("Barricade had no tile to go on"); return; }
    var hk=R.hexKey(spot.q,spot.r), tile=SIM.map.hexes[hk];
    if(!tile || simUnitAt(spot.q,spot.r) || simKindAt(spot.q,spot.r)){ simLogEffect("A Barricade needs an empty tile, and that one is not"); return; }
    tile.c=simCoverColour(which);
    simLogEffect((ctx.sourceCard||name)+" puts a "+which+" Cover Barricade on "+hk); return;
  }
  if(k==="Deploy"){
    var dm=String(p.n||"").match(/^(\d+)\s+(.+)$/);
    if(!dm){ simEffectHalt("Deploy on "+((ctx.fromHand&&ctx.sourceCard)||name)+" does not name what to deploy."); return; }
    var card=simAllCards().filter(function(c){ return c.name===dm[2].trim(); })[0];
    if(!card){ simEffectHalt("Deploy names "+dm[2]+", which is not a card you have."); return; }
    var adj=ctx.adjacent, placed=0, count=parseInt(dm[1],10)||1;
    for(var i=0;i<count;i++){
      var spot=null;
      if(adj && ctx.actor.pos){
        [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]].some(function(d){
          var c={q:ctx.actor.pos.q+d[0], r:ctx.actor.pos.r+d[1]};
          if(SIM.map.hexes[R.hexKey(c.q,c.r)] && !simUnitAt(c.q,c.r)){ spot=c; return true; }
          return false; });
      } else {
        spot=simSpawnTiles(ctx.actor.side==="ally"?"ally":"enemy").filter(function(t){
          return !simUnitAt(t.q,t.r); })[0]||null;
      }
      if(!spot){ simLogEffect("Deploy had nowhere to put "+card.name+(count>1?" "+(i+1):"")); continue; }
      var nu=simXFill(R.unitFromCard(simUnitSpec(card,ctx.actor.side),ctx.actor.side));
      nu.pos=spot; SIM.units.push(nu); placed++;
      simRunTrigger(nu,"deployed");
    }
    if(placed) simLogEffect(name+" deploys "+placed+" "+card.name); return;
  }
  if(k==="Sacrifice"){
    var side=ctx.actor?ctx.actor.side:null;
    who.filter(function(x){ return side!==null && x.side!==side; }).forEach(function(u){
      simLogEffect(u.name+" is not a friendly Unit, so it cannot be Sacrificed");
    });
    who.filter(function(x){ return side===null || x.side===side; }).forEach(function(u){
      u.hp=0; u.down=true; u._lastDealer=null;
      simLogEffect(u.name+" is Sacrificed");
    }); return;
  }
  /* Handbook 16.0: Execute removes an Enemy below half its Health, never an
     Elite, a Mini-Boss or a Boss; the kill is the actor's */
  if(k==="Execute"){
    var es=ctx.actor?ctx.actor.side:null;
    who.forEach(function(u){
      if(u.down) return;
      if(es!==null && u.side===es){ simLogEffect(u.name+" is not an Enemy, so it cannot be Executed"); return; }
      if(/elite|miniboss|boss/i.test(String(u.cardType||""))){ simLogEffect(u.name+" is too strong to be Executed"); return; }
      if((+u.hp||0)*2>=(+u.hpMax||1)){ simLogEffect(u.name+" is not weak enough to be Executed"); return; }
      u.hp=0; u.down=true; u._lastDealer=(ctx.actor && ctx.actor!==u)?ctx.actor.id:null;
      simLogEffect(u.name+" is Executed");
    }); return;
  }
  if(k==="remove"){
    var what=String(p.n||"").trim();
    who.forEach(function(u){
      if(/^equipment$/i.test(what)){
        var eq=(u.equipment||[]).pop();
        if(!eq){ simLogEffect(u.name+" has no Equipment to remove"); return; }
        (u.equipFx||[]).pop();
        /* v13.3: the card itself goes to the Discard Pile here, not when it was
           played (and no longer its bare name, which is what this pushed) */
        var eqCard=(u.equipCards||[]).pop();
        if(eqCard) SIM.discard.push(eqCard);
        u.mods=(u.mods||[]).filter(function(m){ return !(m.dur==="while attached" && m.source===(eq.name||eq)); });
        simLogEffect(u.name+" loses "+(eq.name||eq||"a piece of Equipment"));   /* v13.3: by its name */
      } else {
        var had=R.hasStatus(u,what);
        u.statuses=(u.statuses||[]).filter(function(s){ return String(s.name).toLowerCase()!==what.toLowerCase(); });
        simLogEffect(had?(u.name+" is cleared of "+what):(u.name+" was not "+what));
      }
    }); return;
  }
  /* v13.3 (Revision 15.7): a Troop's card comes back from the Discard Pile to
     the hand. Whoever plays it chooses which; where nothing was chosen it is
     the one discarded last. */
  if(k==="Recover"){
    var pile=(ctx.actor && ctx.actor.side==="ally") ? (SIM.discard||[]) : [];
    var at=ctx.recover ? pile.indexOf(ctx.recover) : -1;
    if(at<0) for(var ri=pile.length-1; ri>=0; ri--){ if(pile[ri] && pile[ri].type==="troop"){ at=ri; break; } }
    if(at<0){ simLogEffect("There is no Troop card in the Discard Pile to Recover"); return; }
    var back=pile.splice(at,1)[0];
    SIM.hand.push(back);
    simLogEffect(back.name+" returns to your hand from the Discard Pile"); return;
  }
  if(k==="Flying"){ who.forEach(function(u){ u.flying=true; }); simLogEffect(who.map(function(u){return u.name;}).join(", ")+" is Flying"); return; }
  /* Suppressive Fire and Aura are handled where they act \u2014 holding fire, and
     reach \u2014 not here; Overclock is a card mechanic with no board effect. */
  if(k==="Suppressive Fire"||k==="Aura"||k==="Overclock") return;
  simEffectHalt(k+" on "+name+" is a keyword the Simulator cannot carry out yet.");
}

/* Run an effect's text. `ctx` carries who is acting, on what, and what just
   happened: damage dealt, a kill, the event a Passive heard. */
function simRunText(text, ctx){
  if(!window.KETER_KW || !String(text||"").trim()) return;
  simSentences(text).forEach(function(sent){ simRunSentence(sent, ctx); });
  simCheckDowns();
  /* what is always on follows at once: Equipment removed, Health crossing half */
  simApplyContinuous();
}
function simHaltOnce(ctx, text){
  /* a Passive that cannot run says so once a fight, not every round */
  if(ctx && ctx.pid){
    SIM.haltedPassives=SIM.haltedPassives||{};
    if(SIM.haltedPassives[ctx.pid]) return;
    SIM.haltedPassives[ctx.pid]=1;
  }
  simEffectHalt(text);
}
function simRunSentence(sent, ctx, an){
  var K=window.KETER_KW;
  var src=ctx.sourceCard||"An effect";
  /* v13.4 (Handbook 15.8): X reads as the number chosen when the card was
     played, or as the X of the Unit acting. With neither, it has no value. */
  if(K.usesX && K.usesX(sent)){
    var xv=(ctx.x!==undefined && ctx.x!==null) ? ctx.x : ((ctx.actor && ctx.actor.x!==undefined && ctx.actor.x!==null) ? ctx.actor.x : null);
    if(xv===null){ simHaltOnce(ctx, src+": X has no value here, because the card has no variable cost. It was not carried out."); return; }
    sent=K.fillX(sent, xv); an=K.analyse(sent);
  }
  an=an||K.analyse(sent);
  if(!an.all.length){
    /* Plain text is logged, as agreed, but marked as not carried out: logged
       like an event it hid the attack's own result from the ticker and read
       as a second helping of damage. */
    if(!ctx.event && !ctx.round) SIM.log.push({t:Date.now(), plain:true,
      text:"Not carried out — "+(ctx.sourceCard?ctx.sourceCard+" has plain text: ":"plain text: ")+sent});
    return;
  }
  if(an.bad.length){
    simHaltOnce(ctx, src+": "+an.bad.map(function(p){
      return p.retired?(p.name+" has been withdrawn"):(p.name+" is not in the keyword library");
    }).join("; ")+". It was not carried out.");
    return;
  }
  var probs=K.problems(an,{kind:ctx.kind||"action"});
  if(probs.length){ simHaltOnce(ctx, src+": "+probs[0]+". It was not carried out."); return; }
  /* a [when] sentence waits for its event, and only the event runs it */
  if(an.when && !ctx.event) return;
  if(an.check){
    var ck=simCheck(an.check, ctx);
    if(!ck.ok){
      if(!ctx.round) simLogEffect(src+": "+K.render("[["+an.check.connector+"]] "+
        (an.check.subject?"[["+an.check.subject.kw.name+"]] ":"")+"[["+an.check.event.kw.name+
        (an.check.event.n?" "+an.check.event.n:"")+"]]")+" — not met");
      return;
    }
    if(ck.who && !ctx.subject) ctx.subject=ck.who;
  }
  var prevDealer=SIM_EV.dealer; SIM_EV.dealer=ctx.actor||null;
  try{ simApplySentence(an, ctx); } finally { SIM_EV.dealer=prevDealer; }
}
function simApplySentence(an, ctx){
  var who=simResolveTargets(an.targets,ctx);
  var aura=an.mods.filter(function(p){ return p.kw.name==="Aura"; })[0];
  if(aura && ctx.actor && ctx.actor.pos){
    var rad=parseInt(aura.n,10)||1;
    who=who.filter(function(u){ return u!==ctx.actor && u.pos && !u.down && simDist(u.pos,ctx.actor.pos)<=rad; });
  }
  ctx.adjacent=an.targets.some(function(t){ return t.part.kw.name==="adjacent"; });
  var eff=an.effects.concat(an.mods);
  if(ctx.onlyInstant) eff=an.effects.filter(function(p){ return SIM_INSTANT[p.kw.name]; });
  /* Revision 16.3: Draw, gain Aether and a Barricade need no Unit to land on */
  if(!who.length && eff.some(function(p){ return ["Deploy","Draw","gain Aether","Barricade"].indexOf(p.kw.name)<0 && p.kw.cat!=="modifier"; })){
    if(!ctx.round) simLogEffect((ctx.sourceCard||"An effect")+" found no target"); return;
  }
  var dur=an.durations[0]||null;
  /* "counts as behind Half Cover for 2 turns": no Effect word, but the cover
     word itself is the effect. It did nothing at all before. */
  if(!an.effects.length && an.covers.length && !ctx.onlyInstant){
    var cov=an.covers[0];
    var turns=dur ? (parseInt(dur.n,10)||(dur.kw.name==="persistent"?999:1)) : 1;
    var gets=who.length?who:(ctx.actor?[ctx.actor]:[]);
    gets.forEach(function(u){ R.addStatus(u,cov.kw.name,turns,ctx.sourceCard||"card"); });
    simLogEffect(gets.map(function(u){ return u.name; }).join(", ")+" counts as behind "+cov.kw.name+
      (turns<999?" for "+turns+" turn"+(turns===1?"":"s"):""));
    return;
  }
  eff.forEach(function(p){ simApplyKeyword(p, who, ctx, dur); });
}
/* A Unit going down fires its own "when Incapacitated" effects, whatever put
   it there. */
/* Revision 15.6: a Passive with no [when] is always on while its card is
   active — its Unit standing, its Equipment attached, its Prototype in the
   fight. Its Statuses and Stats are worked out afresh from where everyone
   stands, so stepping out of an Aura, or a [while] ceasing to hold, ends them.
   Health and Energy move by the difference, so nothing is healed twice. */
function simApplyContinuous(){
  var K=window.KETER_KW;
  if(!K || !SIM.units) return;
  SIM.units.forEach(function(u){
    u.statuses=(u.statuses||[]).filter(function(st){ return !/^(aura|passive):/.test(String(st.source||"")); });
    u.mods=(u.mods||[]).filter(function(m){ return m.dur!=="passive"; });
    u._pWant={HP:0, NRG:0}; u.pFlying=false; u.pLeap=0; u.pDash=0;
  });
  simPassiveSources().forEach(function(src){
    var owner=src.owner;
    if(owner.down || !owner.pos) return;
    K.sentences(src.text).forEach(function(sent){
      var an=K.analyse(sent);
      if(an.when || an.bad.length || K.problems(an,{kind:"passive"}).length) return;
      var ctx={actor:owner, holder:src.holder, sourceCard:src.name, kind:"passive"};
      if(an.check){ var ck=simCheck(an.check, ctx); if(!ck.ok) return; ctx.subject=ck.who; }
      var aura=an.mods.filter(function(p){ return p.kw.name==="Aura"; })[0];
      var who=simResolveTargets(an.targets, ctx);
      if(aura){ var rad=parseInt(aura.n,10)||1;
        who=who.filter(function(u){ return u!==owner && u.pos && !u.down && simDist(u.pos,owner.pos)<=rad; }); }
      var tag=(aura?"aura:":"passive:")+(aura?owner.id:src.pid);
      an.effects.forEach(function(p){
        var k=p.kw;
        if(k.cat==="status"){
          var n=parseInt(p.n,10);
          who.forEach(function(u){ u.statuses.push({name:k.name, n:R.strengthless(k.name)?null:(isNaN(n)?1:n), turns:99, source:tag}); });
        }else if(k.cat==="stats"){
          var amt=parseInt(String(p.n||"").replace(/[^0-9+-]/g,""),10); if(isNaN(amt)) return;
          var stat=(k.name==="Range")?"RANGE":k.name;
          who.forEach(function(u){
            if(stat==="HP"||stat==="NRG") u._pWant[stat]+=amt;
            else u.mods.push({stat:stat, amt:amt, dur:"passive", source:src.name});
          });
        }else if(k.name==="Flying"){ who.forEach(function(u){ u.pFlying=true; }); }
        /* Revision 16.1: always able to Leap, or to Dash each turn */
        else if(k.name==="Leap"||k.name==="Dash"){
          var pn=parseInt(p.n,10); pn=isNaN(pn)?1:Math.max(1,pn);
          who.forEach(function(u){ if(k.name==="Leap") u.pLeap=Math.max(u.pLeap||0,pn); else u.pDash=(u.pDash||0)+pn; });
        }
      });
      if(!an.effects.length) an.covers.forEach(function(cv){
        who.forEach(function(u){ u.statuses.push({name:cv.kw.name, n:null, turns:99, source:tag}); });
      });
    });
  });
  SIM.units.forEach(function(u){
    u.pMods=u.pMods||{};
    ["HP","NRG"].forEach(function(st){
      var want=u._pWant[st], d=want-(u.pMods[st]||0);
      if(!d) return;
      if(st==="HP"){ u.hpMax=Math.max(1,u.hpMax+d); u.hp = (d>0 && !u.down) ? u.hp+d : Math.min(u.hp,u.hpMax); }
      else { u.nrgMax=Math.max(0,(u.nrgMax||0)+d); u.nrg = d>0 ? (u.nrg||0)+d : Math.min(u.nrg||0,u.nrgMax); }
      u.pMods[st]=want;
    });

function simRoundPassives(){

function simCheckDowns(noFlush){

function simApplyAttack(attacker, action, target, res, cover, opts){
  opts=opts||{};
  if(!res.inRange){ simSay(target.name+" is out of range."); return; }
  /* a Burst pays its Energy once, on the first attack */
  if(!opts.follow){
    simSnapshot("the attack");
    attacker.nrg=Math.max(0, attacker.nrg-(parseInt(action.cost,10)||0));
    simPayAether(attacker, action);
  }
  simFxHold(target);
  attacker.acted=true;
  target.lastAttackedBy=attacker.id;
  target.attackedThisRound=true;
  /* Revision 15.6: "attacks" and "is attacked" happen whether or not it hits */
  simEmit("attacks", attacker, target); simEmit("is attacked", target, attacker);
  var prevDealer=SIM_EV.dealer; SIM_EV.dealer=attacker;
  var line=attacker.name+" used "+action.name+" on "+target.name+": ";
  if(res.damage){
    R.hit(target,res.damage,true);   /* Revision 16.3: Hardened is in res.damage already */
    line+=res.damage+" damage"+(res.charge?" (Charge +"+res.charge+")":"")+(res.halved?" (halved)":"")+
          (target.down?" \u2014 "+target.name+" is down":"");
  } else if(res.hit===false){
    line+="missed"+(cover?" (cover +"+cover+")":"");
  } else if(res.penetrated===false){
    line+="hit but did not Penetrate Armor Class";
  } else {
    line+="no effect";
  }
  SIM.log.push({t:Date.now(), text:line, rolls:res.rolls});
  /* Handbook 15.3: the Action's coloured words carry out the rest \u2014 statuses,
     pushes, area damage \u2014 knowing whether it damaged and whether it killed */
  if(action.text && res.hit!==false && res.penetrated!==false)
    simRunText(action.text,{actor:attacker, target:target, damaged:(res.damage||0)>0,
      killed:!!target.down, damage:res.damage||0, sourceCard:action.name});
  SIM_EV.dealer=prevDealer;
  simCheckDowns();
  var ht=simHitText(res);
  simShot(attacker, target, action, function(){ simFxRelease(target, ht); });
  /* already in the log above, with its rolls: show it, don't log it again */
  SIM.notice=line;
  if(!opts.more) simSelect(null);
  simSave(); renderSim();
}

/* Walls stand between two tiles and stop movement across them \u2014 except for a
   Flying Unit, which ignores terrain and walls. None of the movement queries
   passed this, so every Unit had been walking straight through walls. */
function simWallFor(u){
  /* a wall stops a melee blow whoever swings it, so reach passes no Unit */
  var flying=!!(u && u.statuses && R.effective(u).flying);
  return function(a,b){
    if(flying) return false;
    var k=[R.hexKey(a.q,a.r),R.hexKey(b.q,b.r)].sort().join("|");
    return !!((SIM.map||{}).walls||{})[k];
  };
}
function simMoveTo(u,q,r){
  var step=(SIM.reach||[]).filter(function(t){ return t.q===q&&t.r===r; })[0];
  if(!step) return false;
  var eff0=R.effective(u);
  if((u.moved||0)+step.cost > simMoveSteps(u)){
    simSay(u.name+" has "+simMoveLeft(u)+" of "+simMoveSteps(u)+
      " Movement left this turn.");
    return false;
  }
  simSnapshot("the move");
  u.pos={q:q,r:r};
  u.moved=(u.moved||0)+step.cost;
  u.travel=(u.travel||0)+step.cost;
  SIM.log.push({t:Date.now(), text:u.name+(step.leap?" leaped ":" moved ")+step.cost+" tile"+(step.cost===1?"":"s")});
  simHazardHit(u, "moves onto");
  simEmit("moves", u); simCheckDowns();
  if(u.side==="ally" && !u.down) simFindLoot(u);
  simSelect(null);
  simSave();
  /* v12.8: a Hero reaching an Emergency Exit takes the team out of the POI */
  if(SIM.deploy && SIM.deploy.kind==="poi" && !u.down && /hero/i.test(u.cardType||"") && SIM.map && SIM.map.exits && SIM.map.exits[R.hexKey(q,r)] && !SIM.over){
    SIM.log.push({t:Date.now(), text:u.name+" reaches the Emergency Exit. The Strike Team gets out."});
    simFinish({over:true, winner:"escape"});

}
/* ---- loot (v12.6) --------------------------------------------------------
   Every Enemy defeated drops shards and components by its kind, its own Skull
   Level and its Salvage. A friendly Unit that moves onto a Loot Tile or a
   Locked Chest takes what is there, once. It all goes into the fight's haul,
   which is kept only if the fight is won — a loss loses it, as a wipe
   would — and a won floor adds its own reward. */
function simLootOn(){ return !!window.KETER_LOOT; }

function simAddLoot(b, who, from){
  if(!simLootOn() || KETER_LOOT.isEmpty(b)) return;
  SIM.loot=KETER_LOOT.add(SIM.loot, b);
  SIM.log.push({t:Date.now(), loot:true, text:who+" "+from+": "+KETER_LOOT.text(b)});

function simSalvage(u){

/* v12.7: a blueprint or chassis, by the source's chance, from the District's
   pool and the Enemy's own; an Enemy's set drops by their own chance */
function simFindItems(src, card, who, skull){

  var so=KETER_LOOT.tables().sources[src]||{}, chance=so.bp||0;

    SIM.found.concat((SIM.deploy&&SIM.deploy.pending)||[]));

    SIM.log.push({t:Date.now(), loot:true, text:who+" leaves "+(/^ch:/.test(it)?"a chassis":/^cd:/.test(it)?"a card":"a blueprint")+(unknown?" not found before \u2014 win to keep it and learn what it is":": "+nm)}); });

function simFindLoot(u){

/* The hand, the action bar and the zoom buttons sit on top of the board, so a
   tap on them bubbles here too. Read as a board tap it hit whatever tile lay
   underneath: over a friendly Unit it selected that Unit and swapped the hand
   away mid-play, and with a Unit selected it could move it. */
function simOnOverlay(e){

$("simboard")&&$("simboard").addEventListener("click",function(e){
  if(simOnOverlay(e)) return;
  if(!SIM.map || SIM.busy || SIM.over) return;
  var cv=$("simcanvas"), rect=cv.getBoundingClientRect();
  var cell=simHexAt(e.clientX-rect.left, e.clientY-rect.top);
  if(!cell || !SIM.map.hexes[R.hexKey(cell.q,cell.r)]) return;
  var here=simUnitAt(cell.q,cell.r);
  var sel=SIM.selected?SIM.units.filter(function(u){return u.id===SIM.selected;})[0]:null;
  var key=R.hexKey(cell.q,cell.r);

  if(SIM.pick){
    var pk=SIM.pick, uid=pk.valid[key];
    if(uid){

      SIM.pick=null; pk.done(tu); return;
    }

    return;
  }
  if(SIM.pendingAct && sel){
    var tid=SIM.targets && SIM.targets[key];
    var act=(sel.actions||[]).filter(function(a){ return a.name===SIM.pendingAct.name; })[0];
    if(tid && act && SIM.pendingAct.tile){ simUseOnTile(sel, act, cell); return; }
    if(tid && act){
      var tgt=SIM.units.filter(function(u){ return u.id===tid; })[0];
      var bl=(simBurstLive()&&SIM.burst.unit===sel.id)?SIM.burst.left-1:undefined;
      SIM.pendingAct=null; SIM.odds=null;
      simConfirmAttack(sel,tgt,act,bl); return;
    }
    if(simBurstLive()){ simSay("Choose a lit target \u2014 a Burst runs to the end."); return; }
    /* anywhere else drops the Action and carries on as an ordinary tap */
    SIM.pendingAct=null; SIM.odds=null; simMarkTargets(sel);
  }
  if(SIM.aim){
    if(SIM.map.hexes[R.hexKey(cell.q,cell.r)]){ SIM.aim.at={q:cell.q,r:cell.r}; simDraw(); renderSim(); }
    return;
  }
  /* Handbook 14.0: moving and acting belong to Your turn. Tapping in another
     phase selects a Unit to look at, and says why nothing else happens. */

    return;

     SIM.targets && SIM.targets[R.hexKey(cell.q,cell.r)]){

/* Drag the board to look around a floor bigger than the screen. A drag that
   barely moves is treated as a tap, so selecting still works. */
(function(){
  var host=$("simboard");
  if(!host) return;
  var from=null, base=null, moved=false;
  var pt=function(e){ var t=e.touches?e.touches[0]:e; return {x:t.clientX, y:t.clientY}; };
  var down=function(e){
    if(!SIM.map || simOnOverlay(e)) return;
    from=pt(e); moved=false;
    base=SIM.pan?{x:SIM.pan.x, y:SIM.pan.y}:{x:0,y:0};
  };
  var move=function(e){
    if(!from) return;
    if(SIM.pinching || (e.touches && e.touches.length>1)){ from=null; return; }
    var p2=pt(e), dx=p2.x-from.x, dy=p2.y-from.y;
    if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
    if(!moved) return;
    SIM.pan={x:base.x+dx, y:base.y+dy};
    simFit(); simDraw();
    e.preventDefault();
  };
  var up=function(){ from=null; };
  host.addEventListener("mousedown",down);
  host.addEventListener("touchstart",down,{passive:true});
  window.addEventListener("mousemove",move);
  host.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up);
  window.addEventListener("touchend",up);
  /* a drag must not also count as a tap */
  host.addEventListener("click",function(e){ if(moved){ e.stopPropagation(); moved=false; } },true);
})();
window.addEventListener("resize",function(){ if(SIM.map){ simFit(); simDraw(); } });

/* ---- zoom ----------------------------------------------------------------
   Pinch on a touch screen, the wheel on a desktop, or the buttons on the board.
   Zooming keeps whatever is under the fingers or the pointer where it is. */
var SIM_ZOOM_MIN=0.5, SIM_ZOOM_MAX=3;
function simZoomAt(z1, px, py){
  if(!SIM.map) return;
  z1=Math.max(SIM_ZOOM_MIN, Math.min(SIM_ZOOM_MAX, z1));
  var host=$("simboard"); if(!host) return;
  if(px===undefined){ px=host.clientWidth/2; py=host.clientHeight/2; }
  var s0=SIM_VIEW.size, ox0=SIM_VIEW.ox, oy0=SIM_VIEW.oy;
  var ux=(px-ox0)/s0, uy=(py-oy0)/s0;          /* the board point under the pointer */
  SIM.zoom=z1; simFit();
  var wantX=px-SIM_VIEW.size*ux, wantY=py-SIM_VIEW.size*uy;
  SIM.pan=SIM.pan||{x:0,y:0};
  SIM.pan.x+=wantX-SIM_VIEW.ox; SIM.pan.y+=wantY-SIM_VIEW.oy;
  simFit(); simDraw(); simZoomLabel();
}
function simZoomFit(){ SIM.zoom=1; SIM.pan=null; simFit(); simDraw(); simZoomLabel(); }
function simZoomLabel(){
  var l=$("simZoomPct"); if(l) l.textContent=Math.round((SIM.zoom||1)*100)+"%";
}
(function(){
  var host=$("simboard");
  if(!host) return;
  host.addEventListener("wheel",function(e){
    if(!SIM.map || simOnOverlay(e)) return;
    e.preventDefault();
    var r=host.getBoundingClientRect();
    simZoomAt((SIM.zoom||1)*(e.deltaY<0?1.12:1/1.12), e.clientX-r.left, e.clientY-r.top);
  },{passive:false});
  var pinch=null;
  host.addEventListener("touchstart",function(e){
    if(simOnOverlay(e)) return;
    if(e.touches.length===2){
      var a=e.touches[0], b=e.touches[1], r=host.getBoundingClientRect();
      pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), z:SIM.zoom||1,
             x:(a.clientX+b.clientX)/2-r.left, y:(a.clientY+b.clientY)/2-r.top};
      SIM.pinching=true;
    }
  },{passive:true});
  host.addEventListener("touchmove",function(e){
    if(!pinch || e.touches.length!==2) return;
    var a=e.touches[0], b=e.touches[1];
    var d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    simZoomAt(pinch.z*d/pinch.d, pinch.x, pinch.y);
    e.preventDefault();
  },{passive:false});
  host.addEventListener("touchend",function(e){
    if(e.touches.length<2){ pinch=null; setTimeout(function(){ SIM.pinching=false; },60); }
  });
  /* the buttons: not everyone knows a board can be pinched */
  var bar=document.createElement("div");
  bar.id="simZoomBar";
  bar.innerHTML='<button id="simZoomOut" aria-label="Zoom out">\u2212</button>'+
    '<span id="simZoomPct">100%</span>'+
    '<button id="simZoomIn" aria-label="Zoom in">+</button>'+
    '<button id="simZoomFit" aria-label="Fit the floor">Fit</button>';
  host.appendChild(bar);
  bar.addEventListener("click",function(e){
    e.stopPropagation();
    var id=e.target&&e.target.id;
    if(id==="simZoomIn") simZoomAt((SIM.zoom||1)*1.25);
    if(id==="simZoomOut") simZoomAt((SIM.zoom||1)/1.25);
    if(id==="simZoomFit") simZoomFit();
  });
})();

/* ---- the dice ------------------------------------------------------------
   One place decides where a number comes from. In Auto the resolver is handed
   a die and never pauses; in Manual it pauses and asks, and the same rules run
   either way \u2014 which is why resolution was made resumable rather than the
   rules being taught about interfaces. */
var SIM_DIE=null;
function simDice(){
  if(!SIM_DIE) SIM_DIE=R.makeDice();
  /* debug mode can queue results; anything queued is used first, in order */
  return {roll:function(kind){ return SIM_FORCE.length ? simForcedRoll(kind) : SIM_DIE.roll(kind); }};
}
function simRollCtx(extra){
  var c=Object.assign({}, extra||{});
  if(SIM.diceMode==="manual") c.manual=true;
  else c.dice=simDice();
  return c;
}
/* Asks the player what they rolled. Resolution resumes with the answer. */
/* ===========================================================================
   Dice. One component, used by the Dice page and by the Battle Simulator.

   Flat die shapes \u2014 a d20's triangular face inside its outline, a d6's square
   with pips \u2014 that spin while their faces flicker, slowing as they go, then
   settle on the result. The tumble lasts about two seconds by default, because
   real dice take that long to come to rest; the length is a setting, down to
   instant. KETER has no critical hits, but a 20 or a 1 (a 6 or a 1 on a d6)
   gets a quiet highlight, just for the fun of it.
   =========================================================================== */
var DICE_KEY="keter-app-dice";
function diceSettings(){
  try{ var o=JSON.parse(localStorage.getItem(DICE_KEY)||"{}")||{}; }catch(e){ o={}; }
  if(o.dur===undefined) o.dur=2000;
  return o;
}
function diceSaveSettings(o){ try{ localStorage.setItem(DICE_KEY,JSON.stringify(o)); }catch(e){} }
function diceDuration(){ return Math.max(0, Math.min(3000, +diceSettings().dur||0)); }
function diceRollOne(die){ return 1+Math.floor(Math.random()*(die==="d6"?6:20)); }

function dieFaceSVG(die, v){
  if(die==="d6"){
    var P={1:[[50,50]],2:[[30,30],[70,70]],3:[[28,28],[50,50],[72,72]],
           4:[[30,30],[70,30],[30,70],[70,70]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],
           6:[[30,26],[70,26],[30,50],[70,50],[30,74],[70,74]]}[v]||[];
    return '<svg viewBox="0 0 100 100" class="dieface"><rect x="8" y="8" width="84" height="84" rx="14" class="diebody"/>'+
      P.map(function(p){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8" class="diepip"/>'; }).join("")+"</svg>";
  }
  /* a d20 seen face-on: the hexagonal outline, the upward face as a triangle */
  return '<svg viewBox="0 0 100 100" class="dieface">'+
    '<polygon points="50,4 91,27 91,73 50,96 9,73 9,27" class="diebody"/>'+
    '<polygon points="50,20 79,70 21,70" class="dietri"/>'+
    '<text x="50" y="'+(v>9?60:61)+'" text-anchor="middle" class="dienum">'+v+"</text></svg>";
}
/* Roll `values` onto `host`, tumbling for the set length, then call done. */
function diceTumble(host, opts, done){
  var die=opts.die||"d20", values=opts.values||[diceRollOne(die)];
  var max=die==="d6"?6:20, dur=(opts.dur!==undefined?opts.dur:diceDuration());
  host.innerHTML='<div class="dicerow">'+values.map(function(v,i){
    return '<div class="die '+die+'" data-i="'+i+'">'+dieFaceSVG(die,1+Math.floor(Math.random()*max))+"</div>";
  }).join("")+"</div>";
  var els=[].slice.call(host.querySelectorAll(".die"));
  function settle(){
    els.forEach(function(el,i){
      var v=values[i];
      el.innerHTML=dieFaceSVG(die,v);
      el.classList.remove("tumbling"); el.classList.add("settled");
      if(v===max) el.classList.add("top");
      if(v===1) el.classList.add("low");
    });
    if(done) done(values);
  }
  if(!dur){ settle(); return; }
  els.forEach(function(el,i){
    el.classList.add("tumbling");
    el.style.animationDuration=dur+"ms";
    el.style.animationDelay=(i*60)+"ms";
  });
  /* faces flicker fast, then slower, as a real die loses speed */
  var t0=Date.now();
  (function flick(){
    var t=Date.now()-t0;
    if(t>=dur){ settle(); return; }
    els.forEach(function(el){ el.innerHTML=dieFaceSVG(die,1+Math.floor(Math.random()*max)); });
    setTimeout(flick, 40+Math.pow(t/dur,2)*260);
  })();
}

/* ---- the Dice page ---- */

  v.innerHTML=

      '<button class="'+(DICE_UI.die==="d6"?"on":"")+'" data-dicedie="d6">d6</button></div>'+

function diceShowTotal(r){

function diceRollPage(){

/* Every attack roll in a fight asks here. Manual dice ask you; otherwise the
   roll is made and tumbled in the top-right corner of the board so both sides'
   luck is visible \u2014 except during auto-battle, which rolls instantly. */
function simGetRoll(req, done){
  if(SIM.diceMode==="manual") return simAskRoll(req, done);
  /* the Simulator's own dice, so a seeded fight still replays exactly */
  var v=simDice().roll(req.die||"d20");
  if(SIM.autoRunning || !diceDuration()) return done(v);
  simTumbleOnBoard(req, v, function(){ done(v); });
}
function simTumbleOnBoard(req, v, done){
  var host=$("simboard");
  if(!host || !diceDuration()){ done(); return; }
  var layer=document.createElement("div");
  layer.id="simDiceLayer";
  layer.innerHTML='<div class="simdicebox"><p class="simdicelabel">'+esc(req.label||"Rolling")+
    (req.needed!==undefined?' <span>needs '+req.needed+'</span>':"")+"</p>"+
    '<div class="simdicetray"></div><p class="simdiceout"></p></div>';
  host.appendChild(layer);
  var zb=$("simZoomBar"); if(zb) zb.style.visibility="hidden";
  diceTumble(layer.querySelector(".simdicetray"),{die:req.die||"d20", values:[v]}, function(){
    var out=layer.querySelector(".simdiceout");
    if(req.needed!==undefined && out){
      var ok=v>=req.needed;
      out.textContent=ok?(req.pass||"Success"):(req.fail||"Failed");
      out.className="simdiceout "+(ok?"ok":"no");
    }
    setTimeout(function(){
      if(layer.parentNode) layer.parentNode.removeChild(layer);
      if(zb) zb.style.visibility="";
      done();
    }, Math.min(900, 300+diceDuration()/4));
  });
}

function simAskRoll(req, done){
  var label={d20:"a d20", d6:"a d6", coin:"a coin"}[req.die]||"a d20";
  var isCoin=req.die==="coin";
  say("Roll "+label,
    "<p>"+esc(req.prompt||("Roll "+label+
      (req.needed!==undefined?" \u2014 you need "+req.needed+" or better":"")))+"</p>"+
    (isCoin
      ? '<div class="row" style="display:flex;gap:7px;margin-top:10px;">'+
        '<button class="ghost" id="simCoinH" style="flex:1;">Heads</button>'+
        '<button class="ghost" id="simCoinT" style="flex:1;">Tails</button></div>'
      : '<input id="simRollIn" type="number" inputmode="numeric" min="1" max="'+
        (req.die==="d6"?6:20)+'" placeholder="what you rolled" '+
        'style="width:100%;padding:10px;font-size:18px;background:#141f28;'+
        'border:1px solid #33505e;color:var(--text);border-radius:3px;'+
        'font-family:var(--mono);text-align:center;">'+
        '<div class="row" style="display:flex;gap:7px;margin-top:10px;">'+
        '<button class="ghost" id="simRollOk" style="flex:1;">Enter</button>'+
        '<button class="ghost" id="simRollAuto" style="flex:1;">Roll it here</button></div>')+
    '<p style="font-size:11px;color:var(--dim);margin-top:9px;">'+
    'Switch to Auto in Settings if you would rather not be asked.</p>');
  window._simRoll={req:req, done:done};
}
document.addEventListener("click",function(e){
  var id=e.target&&e.target.id, w=window._simRoll;
  if(!w) return;
  var finish=function(v){
    window._simRoll=null;
    $("modal").classList.remove("on");
    w.done(v);
  };
  if(id==="simCoinH") return finish(1);
  if(id==="simCoinT") return finish(2);
  if(id==="simRollAuto"){
    var rv=simDice().roll(w.req.die||"d20");
    window._simRoll=null; $("modal").classList.remove("on");
    return simTumbleOnBoard(w.req, rv, function(){ w.done(rv); });
  }
  if(id==="simRollOk"){
    var max=w.req.die==="d6"?6:20;
    var v=parseInt(($("simRollIn")||{}).value,10);
    if(!v||v<1||v>max) return;
    return finish(v);
  }
});

/* ---- the panel, sized by dragging its top edge ------------------------- */
function simPadInit(){
  var pad=$("simpad"), grip=$("simGrip");
  if(!pad||!grip||grip._wired) return;
  grip._wired=true;
  var startY=0, startH=0, dragging=false, moved=false;
  var apply=function(h){
    if(h===null){ pad.classList.add("collapsed"); SIM.padCollapsed=true; }
    else {
      pad.classList.remove("collapsed");
      SIM.padCollapsed=false;
      SIM.padHeight=Math.max(48,Math.min(window.innerHeight-220,h));
      pad.style.height=SIM.padHeight+"px";
    }
  };
  apply(SIM.padCollapsed?null:SIM.padHeight);
  var down=function(ev){
    dragging=true; moved=false;
    startY=(ev.touches?ev.touches[0]:ev).clientY;
    startH=pad.getBoundingClientRect().height;
    ev.preventDefault();
  };
  var move=function(ev){
    if(!dragging) return;
    var y=(ev.touches?ev.touches[0]:ev).clientY;
    var dy=startY-y;
    if(Math.abs(dy)>3) moved=true;
    apply(startH+dy);
    ev.preventDefault();
  };
  var up=function(){
    if(!dragging) return;
    dragging=false;
    /* a tap folds it away, so it can be dismissed without a careful drag */
    if(!moved) apply(pad.classList.contains("collapsed")?215:null);
    simSave();
  };
  grip.addEventListener("mousedown",down);
  grip.addEventListener("touchstart",down,{passive:false});
  window.addEventListener("mousemove",move);
  window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up);
  window.addEventListener("touchend",up);
}

/* Everything about a Unit, shown where you tapped it rather than in a dialog
   that covers the board you are trying to read. */
function simUnitDetail(u){
  var eff=R.effective(u);
  var stat=function(l,v){ return '<span class="sd"><i>'+l+"</i><b>"+v+"</b></span>"; };
  var out='<div class="cbdetail"><div class="sdrow">'+
    stat("AC",u.ac)+stat("MS",eff.ms!==eff.msBase?eff.ms+" ("+eff.msBase+")":u.ms)+
    stat("NRG",u.nrg+"/"+u.nrgMax)+
    stat("INT",eff.integrity)+
    (u.hits?stat("HITS",u.hits):"")+
    "</div>";
  if((u.statuses||[]).length)
    out+='<div class="chips">'+u.statuses.map(function(st){
      var dot=SIM_STATUS_DOT[String(st.name).toLowerCase()]||"#d94f5c";
      /* 15.4: strength, then the turns left */
      var n=(st.n!==undefined&&st.n!==null)?st.n:null, tl=st.turns;
      return '<span class="chip" style="border-color:'+dot+';">'+
        '<i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+dot+
        ';margin-right:5px;"></i>'+esc(st.name)+(n!==null?" "+n:"")+
        (String(st.source||"").indexOf("aura:")===0?" \u00b7 aura":(tl?" \u00b7 "+tl+" turn"+(tl===1?"":"s"):""))+"</span>";
    }).join("")+"</div>";
  /* 14.0: just out of a lock, it can't have that one again for a round */
  if(Object.keys(u.guards||{}).length)
    out+='<p class="sdnote">Guarded: '+Object.keys(u.guards).map(function(g){ return esc(g.charAt(0).toUpperCase()+g.slice(1)); }).join(", ")+
      " \u2014 just came out of it, so it can't have it again until the same point of the next round.</p>";
  if(u.holding)
    out+='<p class="sdnote" style="color:var(--warn,#e0b34d);">Holding fire with '+esc(u.holding.name)+
      ' \u2014 shoots the first Enemy to move into range.</p>';
  else {
    var holdable=simHoldable(u);
    if(holdable.length && u.side==="ally" && simCanAct())
      out+='<div class="row" style="display:flex;gap:6px;margin:6px 0;">'+holdable.map(function(a){
        return '<button class="ghost" data-simhold="'+u.id+'|'+esc(a.name)+'" style="flex:1;">'+
          'Hold fire ('+esc(a.name)+", "+(parseInt(a.cost,10)||0)+" NRG)</button>";
      }).join("")+"</div>";
  }
  if((u.equipment||[]).length)
    out+='<p class="sdnote">Carrying '+u.equipment.map(esc).join(", ")+"</p>";
  if((u.behaviors||[]).length)
    out+='<p class="sdnote">'+u.behaviors.map(function(b){
      var d=(R.behaviors()||[]).filter(function(x){ return x.k===b.k; })[0];
      return d?esc(d.name+(d.param?" "+(b.x===undefined?d.pdef:b.x):"")):esc(b.k);
    }).join(" \u00b7 ")+"</p>";
  (u.actions||[]).forEach(function(a){
    var e=R.actionEffect(a);
    out+='<div class="sdact"><b>'+esc(a.name)+"</b>"+
      '<i>'+(a.tag||"Active")+(a.cost?" \u00b7 "+a.cost+" NRG":"")+
      (e.damage?" \u00b7 "+e.damage+" dmg":"")+
      (a.rng?" \u00b7 range "+esc(a.rng):"")+"</i>"+
      (a.text?"<p>"+esc(kwPlain(a.text))+"</p>":"")+"</div>";
  });
  return out+"</div>";
}
