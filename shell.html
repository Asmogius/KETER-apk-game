function renderSim(){
  var body=$("simpadbody");
  if(!body) return;
  if(SIM.map){ simFlushEvents(); simApplyContinuous(); }
  if(SIM.halted && !SIM.haltShown){
    SIM.haltShown=true;
    say("An effect could not be carried out",
      "<p style=\"line-height:1.6;\">"+esc(SIM.halted)+"</p>"+
      "<p style=\"font-size:11.5px;color:var(--dim);line-height:1.6;\">It carries rules keywords, so "+
      "it was meant to run. Apply it yourself if it should, then carry on. The card can be "+
      "fixed in the Card Forge, which flags the same problem.</p>"+
      '<button class="ghost primary" id="simHaltOk" style="width:100%;">Carry on</button>');
  }
  $("simRound").textContent = SIM.round
    ? ("Round "+SIM.round+(SIM.map?" \u00b7 "+(SIM.over&&SIM.result?SIM.result:simPhaseDef().name):""))
    : "Set up a combat";
  if(SIM.map && simDebugOn()){
    var fl=document.createElement("span"); fl.className="dbgflag"; fl.textContent="DEBUG";
    $("simRound").appendChild(fl);
  }
  /* v12.6: the fight's haul so far, kept only if it is won */
  if(SIM.map && window.KETER_LOOT && SIM.loot && !KETER_LOOT.isEmpty(SIM.loot)){
    var hl=document.createElement("span"); hl.className="simhaul"; hl.id="simHaul";
    hl.title="This fight's haul \u2014 kept if you win, lost if you do not";
    var nb=KETER_LOOT.norm(SIM.loot), np=KETER_LOOT.count(nb);
    hl.textContent="\u25C8 "+nb.shards+" \u00b7 "+np+" part"+(np===1?"":"s");
    $("simRound").appendChild(hl);
  }
  var ph=$("simphases");
  if(ph) ph.innerHTML=simPhasesHTML()+simAimHTML()+
    (SIM.pick?'<div id="simaim" style="display:flex;gap:6px;align-items:center;padding:6px 10px;'+
      'background:rgba(87,216,227,.10);border-top:1px solid var(--line);font-size:11.5px;'+
      'text-transform:none;letter-spacing:0;font-family:var(--mono);width:100%;">'+
      '<span style="flex:1;">Tap a lit Unit for '+esc(SIM.pick.label)+'</span>'+
      '<button class="ghost" id="simPickCancel">Cancel</button></div>':"");
  simRenderDock();
  /* the buttons say what they will do right now */

  /* the ticker carries the last thing that happened, and stays there */
  var tick=$("simticker");
  if(tick){
    /* the latest thing that actually happened, not unmarked card text */
    var last=null;
    for(var li=(SIM.log||[]).length-1; li>=0; li--){ if(!SIM.log[li].plain){ last=SIM.log[li]; break; } }
    if(SIM.map && last && last.text){
      tick.textContent=last.text;
      tick.classList.add("on");
    } else {
      tick.classList.remove("on");
    }
  }
  /* Five buttons across a phone is four too many. Setting a combat up is only
     offered when there is no combat; once one is running it moves into
     Settings, where it also asks before throwing the fight away. */
  var running = !!SIM.map;
  var setupBtn=$("simSetup");
  if(setupBtn) setupBtn.style.display = running ? "none" : "";
  var dq=$("simDebugQuick");
  if(dq) dq.style.display = (!running && simDebugOn()) ? "" : "none";
  var undoBtn=$("simUndo");
  if(undoBtn){
    /* one way back, as agreed: the whole phase. This used to relabel the button
       from the per-action undo stack, overwriting what the phase code had
       already put there. */
    undoBtn.style.display = SIM.map ? "" : "none";
    undoBtn.disabled = !!SIM.busy || !SIM.phaseBack;
    undoBtn.textContent="Undo phase";
  }
  var autoBtn=$("simAuto");
  if(autoBtn){
    autoBtn.style.display = SIM.map && !SIM.over ? "" : "none";
    /* while Auto runs, the button takes the fight back */
    autoBtn.textContent = SIM.autoRunning ? (SIM.autoStop?"Taking over\u2026":"Take over") : "Auto";
    autoBtn.disabled = SIM.autoRunning ? !!SIM.autoStop : !!SIM.busy;
  }
  var endBtn=$("simEnd");
  if(endBtn){
    endBtn.style.display = SIM.map && !SIM.over ? "" : "none";
    endBtn.disabled = !!SIM.busy;
    /* the button says what the next tap actually does */
    /* Four buttons share one row on a phone, so these stay short \u2014 the tracker
       above already names the phase that comes next. */
    endBtn.textContent = SIM.busy ? "Enemies\u2026"
      : (SIM.phase==="enemy" && SIM.enemyQueue && SIM.enemyQueue.length)
        ? ("Enemy "+SIM.enemyQueue.length)
        : (SIM.phase==="turn" ? "End turn" : "Next \u203a");
  }
  if(SIM.map && SIM.tab==="log"){
    body.innerHTML=simTabs()+simLogBody();
    return;
  }
  if(SIM.map && SIM.tab==="debug" && simDebugOn()){
    body.innerHTML=simTabs()+simDebugBody();
    return;
  }
  body.innerHTML=(SIM.map?simTabs():"")+
    /* Six boxes across two rows pushed the hand off the bottom of the panel.
       The Bank is what you make decisions against, so it keeps its size; the
       rest is a line of text, and the dice mode lives in Settings where it is
       set. */
    /* With no combat there is no Bank and no piles, so none are shown \u2014 an empty
       Aether box and a pile line saying "no combat" twice over was noise. */
    (SIM.map
      ? '<div class="simbank"><span class="lbl">Aether</span>'+
          '<span class="val">'+simAetherLabel(SIM.aether)+"</span></div>"+
        (function(bk){ return '<p class="simpiles">'+(bk.head?bk.head+" \u00b7 ":"")+
          "Deck <b>"+SIM.deck.length+"</b> \u00b7 Hand <b>"+
          SIM.hand.length+"</b> \u00b7 Discard <b>"+SIM.discard.length+
          "</b> \u00b7 Pouch <b>"+(SIM.pouch||[]).length+"</b>"+
          (bk.chips?" \u00b7 "+bk.chips:"")+"</p>"; })(simBankHTML())+
        simUnitLines()
      : '<p class="empty" style="margin:0;">No combat yet. Tap '+
        '<b>Set up a combat</b> to choose a map, a Strike Team, who fights and '+
        'what you are up against.</p>');
}

/* ================= combat datapad =================
   Passive by design for now: it counts, it does not adjudicate. Units are
   stored as snapshots rather than references to cards, so reading stats off a
   card later is just another way to make a snapshot \u2014 nothing here changes. */
/* The rules themselves are in KETER_RULES, injected by build.py from rules.js.
   Everything below is the Datapad: what it shows, what it stores, what it
   logs. When a rule looks wrong, it is not in this file. */
var R = window.KETER_RULES;
var CB_KEY="keter-app-combat";
var CB={round:1, aether:0, units:[], log:[], open:null};
function cbLoad(){
  try{
    var raw=localStorage.getItem(CB_KEY);
    if(raw){ var o=JSON.parse(raw); if(o&&o.units) CB=o; }
  }catch(e){}
  CB.open=null;
}
function cbSave(){
  try{ localStorage.setItem(CB_KEY,JSON.stringify(
    {round:CB.round,aether:CB.aether,units:CB.units,log:CB.log})); }catch(e){}
}
/* Everything is recorded. Detail can be summarised later; what was never
   written down cannot be recovered, and these entries are a few dozen bytes. */
function cbLog(kind,text,unit){
  CB.log.push({t:Date.now(), r:CB.round, kind:kind, text:text,
               u:unit?unit.name:null});
  if(CB.log.length>4000) CB.log.splice(0,1000);
}
function cbUnit(name,side){
  return R.makeUnit({name:name, side:side||"ally"});
}
/* ---- reading a card ------------------------------------------------------
   A Unit is still a snapshot, not a live reference. Pulling from a card is
   simply another way to make one, which is why nothing else in the tracker had
   to change to support this. */


function cbFromCard(c,side){
  var u=R.unitFromCard({
    name:c.name, cardType:c.cardType, subtype:(c._raw||{}).subtype,
    stats:(c._raw||{}).stats, behaviors:(c._raw||{}).behaviors,
    entries:(c._raw||{}).abilities
  }, side);
  u.fromCard=c.name||null;
  return u;
}
/* Everything the tracker can say without adjudicating: it points things out,
   it does not stop you. */
/* What the statuses on a Unit change about it, in one place, so the Datapad
   applies them rather than leaving you to remember them. */
function cbEffective(u){ return R.effective(u); }
function cbWarnings(u){
  var w=[];

  if(u.subtype==="cyborg"){
    w.push("Cyborg \u2014 counts as Mechanical, and is also a valid target for anything aimed at Human Units.");
  }
  (u.actions||[]).forEach(function(a){
    if(a.cost>u.nrg && a.tag==="Active"){
      w.push('"'+a.name+'" costs '+a.cost+" NRG; "+u.name+" has "+u.nrg+".");
    }
  });
  return w;
}
/* The same seven the Card Forge defines, plus anything you added there. One
   vocabulary across the app rather than two that drift. */
var CB_KEYWORDS=[
  {name:"Evasive", desc:"Adds its value to the To-Hit threshold of Ranged Attacks against this Unit."},
  {name:"Overclock", desc:"A Vantage Robotics mechanic: spend now for a stronger effect, at a cost paid afterwards."},
  {name:"Aura", desc:"A Passive that affects only Units within its printed Radius."},
  {name:"Half Cover", desc:"A Unit adjacent to a Half Cover Barricade gains +2 To-Hit against Ranged Attacks from the opposite side."},
  {name:"Full Cover", desc:"A Unit adjacent to a Full Cover Barricade gains +4 To-Hit against Ranged Attacks from the opposite side."}
];
function cbKeywords(){
  var out=CB_KEYWORDS.slice(), seen={};
  out.forEach(function(k){ seen[k.name.toLowerCase()]=1; });
  try{
    (JSON.parse(localStorage.getItem("keter-app-keywords")||"[]")||[]).forEach(function(k){
      if(k&&k.name&&!seen[k.name.toLowerCase()]){ seen[k.name.toLowerCase()]=1; out.push(k); }
    });
  }catch(e){}
  return out.sort(function(a,b){ return a.name.localeCompare(b.name); });
}
function cbKeywordDesc(name){
  var k=cbKeywords().filter(function(x){
    return x.name.toLowerCase()===String(name||"").toLowerCase(); })[0];
  return k?k.desc:"";
}

/* ---- enemy Combos ---------------------------------------------------------
   Handbook: Combos run in strict sequence, and if the Enemy fails to use an
   Action the Combo restarts. That restart is the thing a table forgets, which
   is why resetting is a button rather than something you remember. */
function cbCombo(u){
  return (u.actions||[]).filter(function(a){ return a.tag==="Combo"; });
}
function cbSpecials(u){
  return (u.actions||[]).filter(function(a){ return a.tag==="Special"; });
}
function cbNextAction(u){
  var combo=cbCombo(u);
  if(!combo.length) return null;
  /* a Special Ability overrides the next Combo Action rather than advancing it */
  if(u.overrideNext){
    var sp=cbSpecials(u).filter(function(a){ return a.name===u.overrideNext; })[0];
    if(sp) return {action:sp, index:-1, override:true};
  }
  var i=((u.comboAt||0)%combo.length+combo.length)%combo.length;
  return {action:combo[i], index:i, override:false};
}
function cbFind(id){ return CB.units.filter(function(u){ return u.id===id; })[0]; }

/* Each hit is one instance of damage, whatever its size. A Unit hit once
   for 7 has taken one instance; hit seven times for 1 it has taken seven. That
   is why damage is entered as a value and applied as a single hit. */
function cbHit(u,amount){
  /* the rules live in KETER_RULES now; this turns its events into log lines */
  R.hit(u, amount).forEach(function(e){
    if(e.type==="hit")  cbLog("hit", e.amount+" damage (instance "+e.instance+")", u);
    if(e.type==="down") cbLog("down", u.name+" is down", u);
    if(e.type==="auto") cbLog("auto", e.rule+": "+e.detail, u);
  });
}
/* Healing restores what was lost, so it stops at the starting figure. Gaining
   Health is a different thing \u2014 a buff, a Consumable, a card that grants it \u2014
   and there is no reason that should be capped. */
function cbHeal(u,amount){
  R.heal(u, amount).forEach(function(e){
    cbLog("heal", e.amount+" healed"+
      (e.wasted?" ("+e.wasted+" wasted at full Health)":""), u);
  });
}
function cbGain(u,amount){
  R.gain(u, amount).forEach(function(e){
    cbLog("gain", "+"+e.amount+" Health"+(e.over?" (above "+u.hpMax+")":""), u);
  });
}
function cbHas(u,name){ return R.hasStatus(u,name); }
function cbAddStatus(u,name,turns){
  R.addStatus(u,name,null,"enemy",turns).forEach(function(){
    cbLog("status","gained "+name,u);
  });
}
function cbDropStatus(u,name){
  R.dropStatus(u,name).forEach(function(){ cbLog("status","lost "+name,u); });
}
/* The three things a table forgets, in one place. */
function cbNextTurn(){
  CB.round++;
  R.endTurn(CB.units).forEach(function(e){
    if(e.type==="status"&&e.expired) cbLog("status",e.name+" expired",cbFind(e.unit));
  });
  cbLog("turn","round "+CB.round+" begins");
  cbSave(); renderCombat();
}

function renderCombat(){
  var body=$("cbbody");
  if(!body) return;
  $("cbRoundN").textContent="Round "+CB.round;
  $("cbAeth").innerHTML="Aether <b>"+CB.aether+"</b>";
  if(!CB.units.length){
    body.innerHTML='<p class="empty">No units yet. <b>Add Unit</b> to start a fight. '+
      'Everything you do is logged, so you can look back at how it went.</p>';
    return;
  }
  var html="";
  ["ally","enemy"].forEach(function(side){
    var list=CB.units.filter(function(u){ return u.side===side; });
    if(!list.length) return;
    html+='<div class="cbside">'+(side==="ally"?"Your Units":"Enemies")+"</div>";
    list.forEach(function(u){
      var pct=u.hpMax?Math.round(u.hp/u.hpMax*100):0;
      var cls=pct<=25?"crit":(pct<=50?"low":"");
      html+='<div class="cbu'+(CB.open===u.id?" open":"")+(u.down?" down":"")+
        '" data-u="'+u.id+'">'+
        '<div class="hd" data-tog="'+u.id+'">'+
        '<span class="nm">'+esc(u.name)+(u.down?" \u2014 down":"")+"</span>"+
        '<span class="hp '+cls+'"><i style="width:'+pct+'%"></i></span>'+
        '<span class="num">'+u.hp+"/"+u.hpMax+"</span>"+
        '<span class="pips">'+(u.nrg>8
            ? u.nrg+"\u25C6"
            : new Array(Math.max(0,u.nrg)+1).join("\u25C6")+
              new Array(Math.max(0,u.nrgMax-u.nrg)+1).join("\u25C7"))+"</span>"+
        "</div>";
      var ef=cbEffective(u);
      if(u.statuses.length || u.hits){
        html+='<div class="chips">';
        if(ef.dmgMult!==1) html+='<span class="chip bad">half damage</span>';
        if(ef.ms!==ef.msBase) html+='<span class="chip bad">MS '+ef.ms+
          ' <s style="opacity:.6;">'+ef.msBase+"</s></span>";
        if(ef.passivesOff) html+='<span class="chip bad">Passives off</span>';
        if(u.hits) html+='<span class="chip">'+u.hits+" hit"+(u.hits===1?"":"s")+"</span>";
        u.statuses.forEach(function(x){
          html+='<span class="chip'+(/overwhelm|compromis/i.test(x.name)?" bad":"")+
            '">'+esc(x.name)+(x.turns?" "+x.turns:"")+"</span>";
        });
        html+="</div>";
      }
      html+='<div class="body">'+
        '<div class="cbrow"><label>Damage</label>'+
        '<input type="number" inputmode="numeric" id="dmg-'+u.id+'" placeholder="0">'+
        '<button class="ghost" data-hit="'+u.id+'">Hit</button>'+
        '<button class="ghost" data-heal="'+u.id+'">Heal</button>'+
        '<button class="ghost" data-gain="'+u.id+'">Gain</button></div>'+
        '<div class="cbrow"><label>Energy</label>'+
        '<button class="ghost" data-nrg="'+u.id+'" data-d="-1">\u2212</button>'+
        '<span class="num">'+u.nrg+" (+"+u.nrgMax+
          (u.carries?"/turn, carries":"/turn, resets")+")</span>"+
        '<button class="ghost" data-nrg="'+u.id+'" data-d="1">+</button></div>'+
        '<div class="cbrow"><label>Status</label>'+
        '<select id="st-'+u.id+'" style="flex:1;padding:7px;font-size:16px;'+
        'background:#141f28;border:1px solid #33505e;color:var(--text);border-radius:3px;">'+
        '<option value="">\u2014 pick one \u2014</option>'+
        cbKeywords().map(function(k){
          return '<option value="'+esc(k.name)+'">'+esc(k.name)+"</option>"; }).join("")+
        '<option value="__other">Something else\u2026</option>'+
        "</select>"+
        '<button class="ghost" data-st="'+u.id+'">Add</button></div>'+
        (u.statuses.length?'<div class="chips" style="padding:8px 0 0;">'+
          u.statuses.map(function(x){
            return '<span class="chip" data-rm="'+u.id+'|'+esc(x.name)+'">'+
                   esc(x.name)+" \u00d7</span>"; }).join("")+"</div>":"")+
        (function(){
          var combo=cbCombo(u);
          if(!combo.length) return "";
          var nx=cbNextAction(u);
          return '<div class="cbcombo">'+
            '<div class="lbl">Combo'+(nx&&nx.override?" \u2014 overridden":"")+"</div>"+
            '<div class="steps">'+combo.map(function(a,i){
              var on=(nx&&!nx.override&&nx.index===i);
              return '<span class="step'+(on?" on":"")+'" title="'+esc(a.name)+'">'+
                (i+1)+"</span>"; }).join("")+"</div>"+
            '<div class="upnext">Next: <b>'+esc(nx?nx.action.name:"\u2014")+"</b></div>"+
            '<div class="cbrow" style="margin-top:6px;">'+
            '<button class="ghost" data-combo="'+u.id+'|next">Advance</button>'+
            '<button class="ghost" data-combo="'+u.id+'|reset">Restart</button>'+
            (cbSpecials(u).length
              ? '<button class="ghost" data-combo="'+u.id+'|special">Special\u2026</button>' : "")+
            "</div></div>";
        })()+
        ((u.actions&&u.actions.length)
          ? '<div class="cbacts">'+u.actions.map(function(a,ai){
              return '<button class="cbact" data-act="'+u.id+'|'+ai+'"'+
                ((a.tag==="Active"&&a.cost>u.nrg)?' disabled':"")+">"+
                '<b>'+esc(a.name)+"</b>"+
                (a.cost?'<span class="c">'+a.cost+" NRG</span>":"")+
                (a.dmg?'<span class="d">'+esc(a.dmg)+" dmg</span>":"")+
                "</button>"; }).join("")+"</div>"
          : "")+
        cbEffective(u).notes.map(function(t){
          return '<p class="cbwarn">'+esc(t)+"</p>"; }).join("")+
        cbWarnings(u).filter(function(t){
          /* the effective-stat notes already say these */
          return !/^Overwhelmed:|^Compromised:/.test(t);
        }).map(function(t){
          return '<p class="cbwarn">'+esc(t)+"</p>"; }).join("")+
        '<div class="cbrow"><label>Edit</label>'+
        '<button class="ghost" data-edit="'+u.id+'">Stats</button>'+
        '<button class="ghost" data-del="'+u.id+'" style="color:var(--danger);border-color:#5a2a24;">Remove</button></div>'+
        "</div></div>";
    });
  });
  body.innerHTML=html;
}

document.addEventListener("click",function(e){
  var t=e.target;
  var tog=t.closest?t.closest("[data-tog]"):null;
  if(tog){ var id=tog.getAttribute("data-tog");
    CB.open=(CB.open===id)?null:id; renderCombat(); return; }

  function num(pre,id){
    var el=$(pre+"-"+id); var v=el?el.value:0;
    if(el) el.value="";
    return v;
  }
  var hit=t.getAttribute&&t.getAttribute("data-hit");
  if(hit){ var u=cbFind(hit); if(u){ cbHit(u,num("dmg",hit)); cbSave(); renderCombat(); } return; }
  var gain=t.getAttribute&&t.getAttribute("data-gain");
  if(gain){ var ug=cbFind(gain); if(ug){ cbGain(ug,num("dmg",gain)); cbSave(); renderCombat(); } return; }
  var heal=t.getAttribute&&t.getAttribute("data-heal");
  if(heal){ var u2=cbFind(heal); if(u2){ cbHeal(u2,num("dmg",heal)); cbSave(); renderCombat(); } return; }
  var nrg=t.getAttribute&&t.getAttribute("data-nrg");
  if(nrg){
    var u3=cbFind(nrg);
    if(u3){
      var d=+t.getAttribute("data-d");
      u3.nrg=Math.max(0,u3.nrg+d);
      cbLog("energy",(d>0?"+":"")+d+" Energy \u2192 "+u3.nrg,u3);
      cbSave(); renderCombat();
    }
    return;
  }
  var st=t.getAttribute&&t.getAttribute("data-st");
  if(st){
    var u4=cbFind(st), inp=$("st-"+st);
    var nm=inp?(inp.value||"").trim():"";
    if(!u4||!nm) return;
    if(nm==="__other"){
      promptBox("Name the status effect","",function(v){
        v=String(v||"").trim();
        if(v){ cbAddStatus(u4,v,0); cbSave(); renderCombat(); }
      });
      return;
    }
    cbConfirmStatus(u4,nm);
    return;
  }
  var rm=t.getAttribute&&t.getAttribute("data-rm");
  if(rm){
    var parts=rm.split("|"), u5=cbFind(parts[0]);
    if(u5){ cbDropStatus(u5,parts[1]); cbSave(); renderCombat(); }
    return;
  }
  var del=t.getAttribute&&t.getAttribute("data-del");
  if(del&&cbFind(del)){
    var u6=cbFind(del);
    cbLog("remove",u6.name+" left the fight",u6);
    CB.units=CB.units.filter(function(x){ return x.id!==del; });
    cbSave(); renderCombat();
    return;
  }
  var cmb=t.getAttribute&&t.getAttribute("data-combo");
  if(cmb){
    var cb=cmb.split("|"), cu=cbFind(cb[0]);
    if(cu){
      var n=Math.max(1,cbCombo(cu).length);
      if(cb[1]==="next"){
        cu.comboAt=((cu.comboAt||0)+1)%n; cu.overrideNext=null;
        cbLog("combo","advanced to step "+(cu.comboAt+1),cu);
      } else if(cb[1]==="reset"){
        cu.comboAt=0; cu.overrideNext=null;
        /* the Handbook's rule: an interrupted Combo starts again from one */
        cbLog("combo","Combo interrupted \u2014 restarted at step 1",cu);
      } else if(cb[1]==="special"){
        cbPickSpecial(cu); return;
      }
      cbSave(); renderCombat();
    }
    return;
  }
  var act=t.closest?t.closest("[data-act]"):null;
  if(act){
    var bits=act.getAttribute("data-act").split("|");
    var au=cbFind(bits[0]);
    var a=au?(au.actions||[])[+bits[1]]:null;
    if(a) cbConfirmAction(au,a);
    return;
  }
  var ed=t.getAttribute&&t.getAttribute("data-edit");
  if(ed){ cbEditUnit(cbFind(ed)); return; }
});

/* What the Action actually says, before it is spent. Reading it off the card
   mid-fight is the reason the physical cards get passed around the table. */
/* What the Action does to its target, read off the card. Damage on the strip
   is authoritative; otherwise the rules text is scanned for the usual phrasing.
   Anything it cannot read is left for you to enter by hand. */
function cbEffectOf(a){ return R.actionEffect(a); }
function cbTargetRows(u,a){
  var eff=cbEffectOf(a);
  /* an Action that damages usually points the other way; one that heals or
     grants Health usually points at your own side. It is only a default. */
  var prefer=eff.damage?(u.side==="ally"?"enemy":"ally"):u.side;
  var list=CB.units.slice().sort(function(x,y){
    if((x.side===prefer)!==(y.side===prefer)) return x.side===prefer?-1:1;
    return 0;
  });
  return list.map(function(t){
    return '<div class="cbtarget" data-target="'+t.id+'">'+
      '<b style="color:var(--text);">'+esc(t.name)+"</b>"+
      '<i style="font-style:normal;display:block;font-size:11px;color:var(--dim);">'+
      (t.side==="ally"?"your side":"enemy")+" \u00b7 "+t.hp+"/"+t.hpMax+" HP"+
      (t.down?" \u00b7 down":"")+"</i></div>";
  }).join("");
}

function cbConfirmAction(u,a){
  if(!u||!a) return;
  var short=(a.tag==="Active"||a.tag==="Combo") && a.cost>u.nrg;
  say(a.name,
    '<p style="font-size:11px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;">'+
      esc(u.name)+" \u00b7 "+esc(a.tag)+
      (a.cost?" \u00b7 "+a.cost+" NRG":"")+(a.dmg?" \u00b7 "+esc(a.dmg)+" damage":"")+"</p>"+
    "<p>"+esc(a.text?kwPlain(a.text):"No rules text on this Action.")+"</p>"+
    (short?'<p style="color:var(--danger);font-size:12px;">'+esc(u.name)+" has "+u.nrg+
           " NRG and this costs "+a.cost+".</p>":"")+
    (function(){
      var eff=cbEffectOf(a);
      if(!eff.damage && !eff.heal && !eff.gain) return "";
      return '<p style="font-size:11px;color:var(--dim);letter-spacing:.8px;'+
        'text-transform:uppercase;margin-top:10px;">Apply '+
        (eff.damage?eff.damage+" damage":"")+
        (eff.heal?(eff.damage?", ":"")+eff.heal+" healing":"")+
        (eff.gain?(eff.damage||eff.heal?", ":"")+"+"+eff.gain+" Health":"")+
        " to</p>"+
        '<div class="cbtargets">'+cbTargetRows(u,a)+"</div>";
    })()+
    '<div class="row" style="display:flex;gap:7px;margin-top:11px;">'+
    '<button class="ghost" id="cbActGo" style="flex:1;">Use it</button>'+
    '<button class="ghost" id="cbActNo" style="flex:1;">Cancel</button></div>');
  window._cbAct={u:u.id, name:a.name, cost:a.cost||0, tag:a.tag,
                 eff:cbEffectOf(a), target:null};
}
document.addEventListener("click",function(e){
  var tgt=e.target.closest?e.target.closest("[data-target]"):null;
  if(tgt && window._cbAct){
    window._cbAct.target=tgt.getAttribute("data-target");
    [].forEach.call(document.querySelectorAll(".cbtarget"),function(n){
      n.classList.toggle("on", n===tgt);
    });
    return;
  }
  var id=e.target&&e.target.id;
  if(id==="cbActNo"){ $("modal").classList.remove("on"); return; }
  if(id!=="cbActGo") return;
  var d=window._cbAct||{}, u=cbFind(d.u);
  if(u){
    u.nrg=Math.max(0,u.nrg-(d.cost||0));
    cbLog("action",'used "'+d.name+'"'+(d.cost?" for "+d.cost+" NRG":""),u);
    /* using the next Combo Action advances the sequence; a Special overrides
       it instead, and leaves the Combo where it was */
    if(d.tag==="Combo"){ u.comboAt=((u.comboAt||0)+1)%Math.max(1,cbCombo(u).length); u.overrideNext=null; }
    if(d.tag==="Special"){ u.overrideNext=null; }
    /* resolve it on whoever was picked. Legality is assumed \u2014 the Datapad
       counts, it does not adjudicate. */
    var eff=d.eff||{};
    var tu=d.target?cbFind(d.target):null;
    /* the attacker's own condition changes what lands */
    var mine=cbEffective(u);
    var dealt=eff.damage?Math.floor(eff.damage*mine.dmgMult):0;
    if(eff.damage && dealt!==eff.damage)
      cbLog("mod",eff.damage+" changed to "+dealt+" (a status)",u);
    if(tu){
      if(eff.damage) cbHit(tu,dealt);
      if(eff.heal)   cbHeal(tu,eff.heal);
      if(eff.gain)   cbGain(tu,eff.gain);
      if(eff.damage||eff.heal||eff.gain)
        cbLog("resolve",'"'+d.name+'" resolved on '+tu.name,u);
    } else if(eff.damage||eff.heal||eff.gain){
      cbLog("resolve",'"'+d.name+'" used with no target picked',u);
    }
    cbSave(); renderCombat();
  }
  $("modal").classList.remove("on");
});

/* A Special Ability overrides the next Combo Action rather than replacing the
   sequence, so it is armed rather than used. */
/* Show what it means before it goes on, so a status is never applied on the
   strength of a half-remembered name. */
function cbConfirmStatus(u,name){
  var desc=cbKeywordDesc(name);
  say("Apply "+name+"?",
    '<p style="font-size:11px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;">'+
      esc(u.name)+"</p>"+
    "<p>"+esc(desc||"No definition recorded for this one.")+"</p>"+

    '<label style="font-size:11px;color:var(--dim);display:block;margin-top:8px;">'+
      "Lasts how many turns? Leave at 0 for until removed.</label>"+
    '<input id="cbStTurns" type="number" inputmode="numeric" value="0" '+
      'style="width:80px;padding:8px;font-size:16px;background:#141f28;'+
      'border:1px solid #33505e;color:var(--text);border-radius:3px;">'+
    '<div class="row" style="display:flex;gap:7px;margin-top:11px;">'+
    '<button class="ghost" id="cbStGo" style="flex:1;">Apply</button>'+
    '<button class="ghost" id="cbStNo" style="flex:1;">Cancel</button></div>');
  window._cbSt={u:u.id, name:name};
}
document.addEventListener("click",function(e){
  var id=e.target&&e.target.id;
  if(id==="cbStNo"){ $("modal").classList.remove("on"); return; }
  if(id!=="cbStGo") return;
  var d=window._cbSt||{}, u=cbFind(d.u);
  if(u){
    var t=parseInt(($("cbStTurns")||{}).value,10)||0;
    cbAddStatus(u,d.name,t);
    cbSave(); renderCombat();
  }
  $("modal").classList.remove("on");
});

function cbPickSpecial(u){
  var sp=cbSpecials(u);
  if(!sp.length) return;
  say("Special Ability",
    "<p>A Special Ability overrides the next Combo Action. The Combo itself does "+
    "not advance.</p>"+
    sp.map(function(a,i){
      return '<div class="cbcard" data-special="'+u.id+"|"+esc(a.name)+'" style="padding:9px 10px;'+
        'border:1px solid var(--line);border-radius:4px;margin-bottom:6px;cursor:pointer;">'+
        '<b style="color:var(--text);">'+esc(a.name)+"</b>"+
        '<i style="font-style:normal;display:block;font-size:11px;color:var(--dim);">'+
        esc(kwPlain(a.text||""))+"</i></div>";
    }).join("")+
    '<button class="ghost" id="cbSpecNone" style="width:100%;">Clear the override</button>');
}
document.addEventListener("click",function(e){
  var sp=e.target.closest?e.target.closest("[data-special]"):null;
  if(sp){
    var bits=sp.getAttribute("data-special").split("|"), u=cbFind(bits[0]);
    if(u){
      u.overrideNext=bits[1];
      cbLog("combo",'"'+bits[1]+'" will override the next Combo Action',u);
      cbSave(); renderCombat();
    }
    $("modal").classList.remove("on");
    return;
  }
  if(e.target&&e.target.id==="cbSpecNone"){
    var all=CB.units.filter(function(x){ return x.overrideNext; });
    all.forEach(function(x){ x.overrideNext=null; });
    cbSave(); renderCombat();
    $("modal").classList.remove("on");
  }
});

function cbEditUnit(u){

      ' style="width:100%;padding:8px;font-size:16px;background:#141f28;'+
      'border:1px solid #33505e;color:var(--text);border-radius:3px;">';

    f("euName","Name",u.name)+
    f("euHp","Health Points",u.hpMax,'type="number" inputmode="numeric"')+
    f("euNrg","Energy per turn",u.nrgMax,'type="number" inputmode="numeric"')+

document.addEventListener("click",function(e){

/* ---------------------------------------------------------------------------
   Handbook 14.0. A Strike Team is up to three Heroes sharing one Deck, so setup
   asks only what changes from fight to fight \u2014 the Floor, the Team, who enters
   and who leads, and the Enemies \u2014 then shows a summary where everything else
   can be adjusted. The Action Cards and the Pouch are already saved with the
   Team, so they are carried in as they are unless you change them. ---------- */
var SIM_WIZ={step:"team", loadout:null, heroes:[], leader:null,
             enemyMode:"auto", foes:{}, protos:[], cons:{},
             startTroops:[], actions:{}, pouch:{},
             waveTimer:3, districts:0, instability:0, filters:{}};

function simLoadoutList(){
  if(SIM_DEP && window.KETER_DEPLOY){ var dt=KETER_DEPLOY.team(); return dt?[dt]:[]; }
  if(simDebugOn()) return [simTestTeam()].concat(simLoadoutListOwn());
  return simLoadoutListOwn();
}
function simLoadoutListOwn(){
  var lo=[];
  try{ lo=JSON.parse(localStorage.getItem("keter-app-loadouts")||"[]")||[]; }catch(e){}
  /* Loadouts are converted to Strike Teams when the Deck Builder is opened, and
     someone updating may come straight here instead. Read an old one as what it
     would become, without writing anything: each of its teams is a Strike Team
     of one Hero. */
  var out=[];
  lo.forEach(function(l){
    if(!l) return;
    if(Array.isArray(l.heroes)){ out.push(l); return; }
    (l.teams||[]).forEach(function(t,i){
      out.push({name:(l.name||"Loadout")+((l.teams||[]).length>1?" \u2014 "+(i+1):""),
        level:l.level||1, heroes:t&&t.hero?[t.hero]:[], deck:(t&&t.deck)||[],
        actions:{}, pouch:{}});
    });
  });
  return out;
}
function simRefCard(ref){
  if(!ref) return null;
  var want=String(ref).split("|").slice(1).join("|")||String(ref);
  return simAllCards().filter(function(c){ return c.name===want; })[0]||null;
}
/* How many Heroes this Floor admits: the Sandbox decides a floor's size and
   saves it, so the Simulator reads that rather than measuring tiles again. */
/* How many Heroes the floor's size lets in: Small 1, Medium 2, Large 3 */
function simFloorCap(){
  var sz=(SIM.map&&(SIM.map.battlefieldSize||SIM.map.floorSize))||"";
  if(!sz){
    var n=Object.keys((SIM.map&&SIM.map.hexes)||{}).length;
    sz = n<100?"Small":(n<=250?"Medium":"Large");
  }
  /* the Sandbox writes it in either case */
  return {small:1,medium:2,large:3}[String(sz).toLowerCase()]||1;
}
function simHeroCapacity(){
  var cap=simFloorCap();
  /* (v14.21) a deployment's fight at Skull 1 or 2 lets two Heroes in, whatever the floor's size */
  var d=simDepCtx(); if(d && window.KETER_DEPLOY && KETER_DEPLOY.soft(+d.skull||1)) cap=Math.max(cap,2);
  return cap;
}

function simAllCards(){
  var out=[];
  try{ out=mineCards().concat(masterCards(), designCards()); }catch(e){}
  /* v12.9: pre-built Troops bought at the dock fight here, though no Deck Builder shows them */
  try{ if(window.KETER_WORKSHOP && KETER_WORKSHOP.prebuiltCards) out=out.concat(KETER_WORKSHOP.prebuiltCards()); }catch(e){}
  var seen={};
  out=out.filter(function(c){
    var k=(c._src||"m")+"|"+(c.name||"").toLowerCase();
    if(seen[k]) return false; seen[k]=1; return true;
  });
  /* Revision 15.6: every Archetype a card carries is a narrowing word */
  if(window.KETER_KW && window.KETER_KW.registerArchetypes)
    out.forEach(function(c){ if(c.archetypes&&c.archetypes.length) window.KETER_KW.registerArchetypes(c.archetypes); });
  return out;
}
/* One filter bar shape reused for every step: free text plus whatever facets
   that step cares about. */
function simFilterBar(step, facets){
  var f=SIM_WIZ.filters[step]||{};
  var html='<div class="simfilters">'+
    '<input type="text" class="simf-q" data-simf-step="'+step+'" '+
    'placeholder="Search" value="'+esc(f.q||"")+'" '+
    'style="width:100%;padding:8px;font-size:16px;background:#141f28;'+
    'border:1px solid #33505e;color:var(--text);border-radius:3px;margin-bottom:6px;">';
  if(facets && facets.length){
    html+='<div class="simfrow">'+facets.map(function(fac){
      var cur=f[fac.key]||"";
      return '<select class="simf-facet" data-simf-step="'+step+'" '+
        'data-simf-key="'+fac.key+'">'+
        '<option value="">'+esc(fac.label)+'</option>'+
        fac.options.map(function(o){
          return '<option value="'+esc(o)+'"'+(cur===o?" selected":"")+'>'+
                 esc(o)+"</option>"; }).join("")+
        "</select>";
    }).join("")+"</div>";
  }
  return html+"</div>";
}
function simFilterApply(step, list, textFields){
  var f=SIM_WIZ.filters[step]||{};
  return list.filter(function(item){
    if(f.q){
      var hay=(textFields.map(function(k){ return item[k]||""; }).join(" ")).toLowerCase();
      if(hay.indexOf(f.q.toLowerCase())<0) return false;
    }
    for(var k in f){
      if(k==="q"||!f[k]) continue;
      if(String(item[k]||"")!==f[k]) return false;
    }
    return true;
  });
}
/* Typing in the search box used to call simWizRender(), which calls say()
   and replaces the WHOLE dialog \u2014 including the input being typed into. That
   dropped keyboard focus after every single character, the same failure mode
   as the Card Forge's entry-type change. Only the results region is rebuilt
   now; the filter bar itself is untouched by a keystroke. */
document.addEventListener("input",function(e){
  if(!e.target.classList||!e.target.classList.contains("simf-q")) return;
  var step=e.target.getAttribute("data-simf-step");
  SIM_WIZ.filters[step]=SIM_WIZ.filters[step]||{};
  SIM_WIZ.filters[step].q=e.target.value;
  simWizRefreshResults();
});
document.addEventListener("change",function(e){
  var step=e.target.getAttribute&&e.target.getAttribute("data-simf-step");
  var key=e.target.getAttribute&&e.target.getAttribute("data-simf-key");
  if(!step||!key) return;
  SIM_WIZ.filters[step]=SIM_WIZ.filters[step]||{};
  SIM_WIZ.filters[step][key]=e.target.value;
  simWizRefreshResults();
});

    pouch:{}, waveTimer:3, districts:0, instability:0, filters:{}});
  simWizRender();
}
var SIM_WIZ_STEPS=["team","heroes","troops","enemies","summary"];
/* a deployment's team is fixed and its Enemies come from the tile */
function simWizSteps(){ return SIM_DEP ? ["heroes","troops","summary"] : SIM_WIZ_STEPS; }
function simWizTitle(step){
  return {team:"Choose a Strike Team", heroes:"Who fights, and who leads",
          troops:"Starting Troops", enemies:"The Enemies", summary:"Ready to start",
          protos:"Prototypes", cons:"Consumables"}[step];
}
function simWizBack(){
  var ST=simWizSteps(), i=ST.indexOf(SIM_WIZ.step);
  if(i>0){ SIM_WIZ.step=ST[i-1]; simWizRender(); }
}
function simWizNext(){
  var ST=simWizSteps(), i=ST.indexOf(SIM_WIZ.step);
  if(i<ST.length-1){ SIM_WIZ.step=ST[i+1]; simWizRender(); }
}

var SIM_WIZ_FN={team:simWizTeam, heroes:simWizHeroes, troops:simWizTroops,
                enemies:simWizEnemies,
                summary:simWizSummary, protos:simWizProtos, cons:simWizCons};
function simWizRender(){
  var step=SIM_WIZ.step;
  var piece=(SIM_WIZ_FN[step]||function(){ return {filter:"",results:""}; })();

  var ST=simWizSteps(), i=ST.indexOf(step);
  var crumbs=ST.map(function(s2,idx){
    return '<span style="color:'+(idx<=i?"var(--cyan)":"var(--dim)")+
      ';">'+(idx+1)+"</span>";
  }).join('<span style="color:var(--dim);"> \u2013 </span>');

  /* The filter bar (search input, selects) is written once per step change.
     Everything a keystroke or a pick can affect lives inside #wizResults,
     which simWizRefreshResults() rewrites on its own \u2014 so typing a search
     term never touches the input the person is typing into. */
  var depHead=SIM_DEP ? '<p class="simdephead">'+esc(SIM_DEP.kind==="poi"?SIM_DEP.name+" \u00b7 floor "+(SIM_DEP.index+1)+" of "+SIM_DEP.count:"Ambush")+
    " \u00b7 District "+esc(SIM_DEP.district||"\u2014")+" \u00b7 Skull "+SIM_DEP.skull+"</p>" : "";
  say(simWizTitle(step),
    depHead+'<p style="font-size:10px;letter-spacing:2px;">'+crumbs+"</p>"+
    piece.filter+'<div id="wizResults">'+piece.results+"</div>"+
    '<div class="row" style="display:flex;gap:7px;margin-top:11px;">'+
    (i>0?'<button class="ghost" id="wizBack" style="flex:1;">Back</button>':"")+
    '<button class="ghost" id="wizNext" style="flex:2;">'+
    (step==="summary"?"Start combat":"Next")+"</button></div>");
}
function simWizRefreshResults(){
  var host=document.getElementById("wizResults");
  if(!host) return;
  var fn=SIM_WIZ_FN[SIM_WIZ.step];
  if(!fn) return;
  host.innerHTML=fn().results;
}

function simWizTeam(){
  var lo=simLoadoutList();
  if(!lo.length) return {filter:"", results:'<p style="font-size:12px;">No Strike Teams yet. '+
    "Build one in the Deck Builder: up to three Heroes, one Deck, and an Aether Pouch.</p>"};
  return {filter:"", results:lo.map(function(l,i){
    var names=(l.heroes||[]).map(function(r){ var c=simRefCard(r); return c?c.name:"?"; });
    var chips=Object.keys(l.pouch||{}).reduce(function(a,k){
      return a+(parseInt(l.pouch[k],10)||0); },0);
    return '<div class="wizrow'+(SIM_WIZ.loadout===i?" on":"")+'" data-wizteam="'+i+'">'+
      "<b>"+esc(l.name||"Untitled")+"</b><i>"+
      (names.length?esc(names.join(", ")):"No Heroes")+" \u00b7 "+
      ((l.deck||[]).length)+" cards \u00b7 "+chips+" chip"+(chips===1?"":"s")+"</i></div>";
  }).join("")};
}
function simWizHeroes(){
  var lo=simLoadoutList()[SIM_WIZ.loadout];
  if(!lo) return {filter:"", results:"<p>Choose a Strike Team first.</p>"};
  var cap=simHeroCapacity();
  var rows=(lo.heroes||[]).map(function(ref,i){
    var c=simRefCard(ref);
    var on=SIM_WIZ.heroes.indexOf(ref)>=0;
    var lead=SIM_WIZ.leader===ref;
    return '<div class="wizrow'+(on?" on":"")+'" data-wizhero="'+i+'">'+
      "<b>"+esc(c?c.name:"Missing card")+(lead?" \u00b7 leads":"")+"</b><i>"+
      (c?("LDR "+((c.stats||{}).ldr||0)+" \u00b7 Action Slots "+((c.stats||{}).slots||0)):"")+
      "</i></div>"+
      (on?'<div style="text-align:right;margin:-6px 4px 8px;"><button class="ghost" '+
        'data-wizlead="'+i+'" style="padding:3px 9px;font-size:11px;">'+
        (lead?"Leading":"Make leader")+"</button></div>":"");
  }).join("");
  return {filter:"", results:
    '<p style="font-size:11.5px;color:var(--dim);line-height:1.6;">This Floor is '+
    (SIM.map&&(SIM.map.battlefieldSize||SIM.map.floorSize)||"sized automatically")+
    ", so "+cap+" Hero"+(cap===1?"":"es")+" may enter. "+
    (SIM_WIZ.heroes.length?SIM_WIZ.heroes.length+" chosen.":"Tap to choose.")+
    " Heroes left behind are reserves.</p>"+rows};
}
/* The summary's rows open here. Each is a small dialog of its own rather than
   another wizard step, because none of them change for most fights. */
function simWizSub(kind){
  var lo=simLoadoutList()[SIM_WIZ.loadout]||{};
  var heroes=SIM_WIZ.heroes.map(simRefCard).filter(Boolean);
  var html="", title="";
  if(kind==="troops"){
    var ldr=heroes.reduce(function(a,h){ return a+(parseInt((h.stats||{}).ldr,10)||0); },0);
    var used=SIM_WIZ.startTroops.reduce(function(a,n){
      var c=simAllCards().filter(function(x){ return x.name===n; })[0];
      return a+(parseInt((c&&c.stats||{}).uslot,10)||1); },0);
    var troops={}, order=[];
    simWizDeckCards().forEach(function(c){
      if(c.cardType!=="troop") return;
      if(!troops[c.name]){ troops[c.name]={c:c,n:0}; order.push(c.name); }
      troops[c.name].n++;
    });
    title="Starting Troops";
    html='<p style="font-size:11.5px;line-height:1.6;">Troops taken out of the Deck to start '+
      "the combat beside your Heroes, up to their pooled Leadership of <b>"+ldr+
      "</b>. They cost nothing. Using <b>"+used+"</b>.</p>"+
      (SIM_WIZ.troopNote?'<p style="font-size:11.5px;color:var(--warn,#e0b34d);">'+
        esc(SIM_WIZ.troopNote)+"</p>":"")+
      (order.length?order.map(function(n){
        var e=troops[n], slot=parseInt((e.c.stats||{}).uslot,10)||1;
        var taken=SIM_WIZ.startTroops.filter(function(x){ return x===n; }).length;
        return '<div class="simpickrow" style="display:flex;align-items:center;gap:8px;">'+
          '<span style="flex:1;"><b>'+esc(n)+'</b><i style="display:block;">'+slot+
          " slot"+(slot===1?"":"s")+" \u00b7 "+e.n+" in Deck</i></span>"+
          '<button class="btn" data-wiztroopless="'+esc(n)+'" style="padding:4px 9px;">\u2212</button>'+
          '<span style="font-family:var(--mono);min-width:16px;text-align:center;">'+taken+"</span>"+
          '<button class="btn" data-wiztroopmore="'+esc(n)+'" style="padding:4px 9px;">+</button></div>';
      }).join(""):"<p>No Troop cards in this Deck.</p>");
  }else if(kind==="actions"){
    title="Action Cards";
    html='<p style="font-size:11.5px;line-height:1.6;">Assigned before combat and carried by '+
      "each Hero. Change them here for this fight; the Deck Builder keeps the Team's own.</p>"+
      (heroes.length?SIM_WIZ.heroes.map(function(ref){
        var h=simRefCard(ref), list=SIM_WIZ.actions[ref]||[];
        var cap=parseInt((h&&h.stats||{}).slots,10)||0;
        return '<div class="dksec">'+esc(h?h.name:"Hero")+" \u00b7 "+list.length+" of "+cap+"</div>"+
          (list.length?list.map(function(r){
            var c=simRefCard(r);
            return '<div class="wizrow"><b>'+esc(c?c.name:"?")+"</b><i>carried</i></div>"; }).join("")
            :'<div style="padding:8px 12px;color:var(--dim);font-size:11.5px;">Empty slots.</div>');
      }).join(""):"<p>Choose Heroes first.</p>");
  }else if(kind==="pouch"){
    var chips=Object.keys(SIM_WIZ.pouch).reduce(function(a,k){
      return a+(parseInt(SIM_WIZ.pouch[k],10)||0); },0);
    var need=simWizDeckCards().reduce(function(m,c){
      var a=c.aetherCost||{};
      return Math.max(m,(parseInt(a.generic,10)||0)+(parseInt(a.affinity,10)||0)+
        (parseInt(a.affinity2,10)||0)); },0);
    title="Aether Pouch";
    html='<p style="font-size:11.5px;line-height:1.6;">Carrying <b>'+chips+"</b> chip"+
      (chips===1?"":"s")+". The priciest card in the Deck costs <b>"+need+
      "</b>, so the Pouch needs at least that many"+
      (chips<need?' \u2014 <span style="color:var(--danger);">it is short</span>':"")+
      ". Change what you carry in the Deck Builder.</p>"+
      Object.keys(SIM_WIZ.pouch).map(function(k){
        var basic=/^basic\|/.test(k), c=basic?null:simRefCard(k);
        var nm=basic?("Basic Chip \u00b7 District "+k.split("|")[1]):(c?c.name:k);
        return '<div class="wizrow"><b>'+esc(nm)+"</b><i>\u00d7"+SIM_WIZ.pouch[k]+"</i></div>";
      }).join("");
  }else if(kind==="waves"){
    title="Waves and instability";
    html='<p style="font-size:11.5px;line-height:1.6;">The next wave arrives when the current '+
      "one is cleared, or after this many turns.</p>"+
      '<div class="dkfield"><label>Wave timer, in turns</label>'+
      '<input id="wizTimer" type="number" min="1" max="10" value="'+SIM_WIZ.waveTimer+'"></div>'+
      '<p style="font-size:11.5px;line-height:1.6;">Every District you have cleared adds 3% to '+
      "the chance that a spawn produces an Elite or a Mini-Boss instead.</p>"+
      '<div class="dkfield"><label>Districts cleared</label>'+
      '<input id="wizDistricts" type="number" min="0" max="5" value="'+SIM_WIZ.districts+'"></div>'+
      '<div class="dkfield"><label>Chance, in percent</label>'+
      '<input id="wizChance" type="number" min="0" max="100" value="'+SIM_WIZ.instability+'"></div>';
  }else{
    var piece=(kind==="protos"?simWizProtos:simWizCons)();
    title=(kind==="protos"?"Prototypes":"Consumables");
    html=piece.filter+'<div id="wizResults">'+piece.results+"</div>";
  }
  say(title, html+'<div class="row" style="display:flex;gap:7px;margin-top:11px;">'+
    '<button class="ghost" id="wizSubDone" style="flex:1;">Done</button></div>');
}
document.addEventListener("click",function(e){
  var id=e.target&&e.target.id;
  if(id==="wizSubDone"){
    var t=document.getElementById("wizTimer"), d=document.getElementById("wizDistricts"),
        ch=document.getElementById("wizChance");
    if(t) SIM_WIZ.waveTimer=Math.max(1,Math.min(10,parseInt(t.value,10)||3));
    if(d){
      var was=SIM_WIZ.districts;
      SIM_WIZ.districts=Math.max(0,Math.min(5,parseInt(d.value,10)||0));
      /* the chance follows the Districts unless you set it yourself */
      if(SIM_WIZ.districts!==was) SIM_WIZ.instability=SIM_WIZ.districts*3;
      else if(ch) SIM_WIZ.instability=Math.max(0,Math.min(100,parseInt(ch.value,10)||0));
    }
    SIM_WIZ.step="summary"; simWizRender(); return;
  }
  var tm=e.target.getAttribute&&e.target.getAttribute("data-wiztroopmore");
  var tl=e.target.getAttribute&&e.target.getAttribute("data-wiztroopless");
  if(tm||tl){
    var nm=tm||tl;
    if(tm){
      var c=simAllCards().filter(function(x){ return x.name===nm; })[0];
      var slot=parseInt((c&&c.stats||{}).uslot,10)||1;
      var heroes2=SIM_WIZ.heroes.map(simRefCard).filter(Boolean);
      var ldr2=heroes2.reduce(function(a,h){ return a+(parseInt((h.stats||{}).ldr,10)||0); },0);
      var used2=SIM_WIZ.startTroops.reduce(function(a,n2){
        var c2=simAllCards().filter(function(x){ return x.name===n2; })[0];
        return a+(parseInt((c2&&c2.stats||{}).uslot,10)||1); },0);
      var have=simWizDeckCards().filter(function(x){ return x.name===nm; }).length;
      var taken=SIM_WIZ.startTroops.filter(function(x){ return x===nm; }).length;
      if(used2+slot>ldr2)
        SIM_WIZ.troopNote=nm+" takes "+slot+" Unit Slot"+(slot===1?"":"s")+
          ", and only "+(ldr2-used2)+" of "+ldr2+" "+((ldr2-used2)===1?"is":"are")+" left.";
      else if(taken>=have)
        SIM_WIZ.troopNote="The Deck holds "+have+" "+nm+(have===1?"":"s")+", and "+
          (have===1?"it is":"they are")+" all taken.";
      else { SIM_WIZ.troopNote=null; SIM_WIZ.startTroops.push(nm); }
    }else{
      var i=SIM_WIZ.startTroops.indexOf(nm);
      if(i>=0) SIM_WIZ.startTroops.splice(i,1);
    }
    if(SIM_WIZ.step==="troops") simWizRefreshResults(); else simWizSub("troops");
    return;
  }
});

/* Its own step, because on the summary nobody found it. */
function simWizTroops(){
  var heroes=SIM_WIZ.heroes.map(simRefCard).filter(Boolean);
  var ldr=heroes.reduce(function(a,h){ return a+(parseInt((h.stats||{}).ldr,10)||0); },0);
  var used=SIM_WIZ.startTroops.reduce(function(a,n){
    var c=simAllCards().filter(function(x){ return x.name===n; })[0];
    return a+(parseInt((c&&c.stats||{}).uslot,10)||1); },0);
  var troops={}, order=[];
  simWizDeckCards().forEach(function(c){
    if(c.cardType!=="troop") return;
    if(!troops[c.name]){ troops[c.name]={c:c,n:0}; order.push(c.name); }
    troops[c.name].n++;
  });
  var head='<p style="font-size:11.5px;color:var(--dim);line-height:1.6;">'+
    "Troops taken out of the Deck to start the combat beside your Heroes, on your "+
    "Spawn Tiles, at no Aether cost. Their Unit Slots come out of your Heroes' "+
    "pooled Leadership: <b>"+used+" of "+ldr+"</b> used."+
    (ldr?"":" These Heroes have no Leadership, so none can start.")+"</p>"+
    (SIM_WIZ.troopNote?'<p style="font-size:11.5px;color:var(--warn,#e0b34d);">'+
      esc(SIM_WIZ.troopNote)+"</p>":"")+
    '<p style="font-size:11px;color:var(--dim);">This step is optional \u2014 Next '+
    "moves on with none.</p>";
  if(!order.length)
    return {filter:"", results:head+'<p style="font-size:12px;">No Troop cards in this Deck.</p>'};
  return {filter:"", results: head+order.map(function(n){
    var e=troops[n], slot=parseInt((e.c.stats||{}).uslot,10)||1;
    var taken=SIM_WIZ.startTroops.filter(function(x){ return x===n; }).length;
    var fits=(used+slot)<=ldr && taken<e.n;
    return '<div class="wizrow'+(taken?" on":"")+'">'+
      '<span class="m"><b>'+esc(n)+"</b><i>"+slot+" Unit Slot"+(slot===1?"":"s")+
      " \u00b7 "+e.n+" in the Deck</i></span>"+
      '<button class="ghost" data-wiztroopless="'+esc(n)+'" style="padding:4px 11px;"'+
      (taken?"":" disabled")+">\u2212</button>"+
      '<span style="font-family:var(--mono);min-width:18px;text-align:center;">'+taken+"</span>"+
      '<button class="ghost" data-wiztroopmore="'+esc(n)+'" style="padding:4px 11px;"'+
      (fits?"":" disabled")+">+</button></div>";
  }).join("")};
}

function simWizSummary(){
  var lo=simLoadoutList()[SIM_WIZ.loadout]||{};
  var heroes=SIM_WIZ.heroes.map(simRefCard).filter(Boolean);
  var ldr=heroes.reduce(function(a,h){ return a+(parseInt((h.stats||{}).ldr,10)||0); },0);
  var slots=SIM_WIZ.startTroops.reduce(function(a,n){
    var c=simAllCards().filter(function(x){ return x.name===n; })[0];
    return a+(parseInt((c&&c.stats||{}).uslot,10)||1); },0);
  var chips=Object.keys(SIM_WIZ.pouch).reduce(function(a,k){
    return a+(parseInt(SIM_WIZ.pouch[k],10)||0); },0);
  var acts=Object.keys(SIM_WIZ.actions).reduce(function(a,k){
    return a+((SIM_WIZ.actions[k]||[]).length); },0);
  function row(kind,label,detail){
    return '<div class="wizrow" data-wizsub="'+kind+'"><b>'+label+
      '</b><i>'+detail+'</i></div>';
  }
  return {filter:"", results:
    '<p style="font-size:11.5px;color:var(--dim);line-height:1.6;">'+
    esc(heroes.map(function(h){ return h.name; }).join(", ")||"No Heroes")+
    " on "+esc((SIM.map&&SIM.map.name)||"the map")+". Tap anything to change it.</p>"+
    row("actions","Action Cards",acts+" assigned")+
    row("pouch","Aether Pouch",chips+" chip"+(chips===1?"":"s"))+
    row("protos","Prototypes",SIM_WIZ.protos.length+" equipped")+
    row("cons","Consumables",Object.keys(SIM_WIZ.cons).reduce(function(a,k){
      return a+SIM_WIZ.cons[k]; },0)+" carried")+
    row("waves","Waves and instability","timer "+SIM_WIZ.waveTimer+" turns \u00b7 "+
      SIM_WIZ.districts+" Districts cleared \u00b7 "+SIM_WIZ.instability+"%")};
}

function simTeamsOf(l){
  if(!l) return [];
  if(Array.isArray(l.teams)) return l.teams;
  return (l.heroes||[]).map(function(h){ return {hero:h, deck:l.deck||[]}; });
}
/* Six waves across every Enemy Spawn Tile is how many Enemies a Floor can want,
   which is what Auto fills the pile to. */
function simEnemyWant(){
  var tiles=simEnemySpawnTiles();
  var by={};
  tiles.forEach(function(t){ by[t.level]=(by[t.level]||0)+simWaves(); });
  return by;
}

function simWizDeckCards(){
  var lo=simLoadoutList()[SIM_WIZ.loadout];
  if(!lo) return [];
  var out=[];
  (lo.deck||[]).forEach(function(ref){
    var c=simRefCard(ref);
    if(c) out.push(c);
  });
  return out;
}

function simWizProtos(){
  /* Prototypes are equipped to the Strike Team, not drawn from the Deck, so
     they are offered from the full collection rather than from what the Deck
     you just picked contains. */
  var all=simAllCards().filter(function(c){ return c.cardType==="prototype"; });
  /* v12.9: on a deployment, only what was packed */
  var pk=simDepPack();
  if(pk) all=all.filter(function(c){ return pk.protos[c.name]>0; });
  if(!all.length)
    return {filter:"", results:pk?"<p>No Prototypes packed for this deployment.</p>":"<p>No Prototype cards yet. This step can be skipped.</p>"};
  var rarities=Array.from(new Set(all.map(function(c){ return c.rarity; }).filter(Boolean)));
  var cards=simFilterApply("protos",
    all.map(function(c){ return {c:c, name:c.name, rarity:c.rarity||""}; }), ["name"]);
  var results = !cards.length ? "<p>Nothing matches.</p>"
    : '<div class="simpicklist">'+cards.map(function(row){
        var on=SIM_WIZ.protos.indexOf(row.name)>=0;
        return '<div class="simpickrow'+(on?" on":"")+'" data-wizproto="'+esc(row.name)+'">'+
          '<b>'+esc(row.name)+"</b>"+(row.rarity?"<i>"+esc(row.rarity)+"</i>":"")+"</div>";
      }).join("")+"</div>";
  return {filter: simFilterBar("protos",[{key:"rarity",label:"Any Rarity",options:rarities}]),
          results: results};
}
document.addEventListener("click",function(e){
  var row=e.target.closest?e.target.closest("[data-wizproto]"):null;
  if(!row) return;
  var n=row.getAttribute("data-wizproto"), i=SIM_WIZ.protos.indexOf(n);
  if(i>=0) SIM_WIZ.protos.splice(i,1); else SIM_WIZ.protos.push(n);
  simWizRefreshResults();
});

function simDepPack(){ if(!SIM_DEP || !window.KETER_DEPLOY) return null; var t=KETER_DEPLOY.team(); return (t&&t.pack)||{cons:{},protos:{}}; }
function simWizCons(){
  var all=simAllCards().filter(function(c){ return c.cardType==="consumable"; });
  var pk=simDepPack();
  if(pk) all=all.filter(function(c){ return pk.cons[c.name]>0; });
  if(!all.length)
    return {filter:"", results:pk?"<p>No Consumables left in the pack.</p>":"<p>No Consumable cards yet. This step can be skipped.</p>"};
  var rarities=Array.from(new Set(all.map(function(c){ return c.rarity; }).filter(Boolean)));
  var cards=simFilterApply("cons",
    all.map(function(c){ return {c:c, name:c.name, rarity:c.rarity||""}; }), ["name"]);
  var results = (!cards.length ? "<p>Nothing matches.</p>" :
    '<div class="simpicklist">'+cards.map(function(row){
      var n=SIM_WIZ.cons[row.name]||0;
      return '<div class="simpickrow" style="display:flex;align-items:center;gap:8px;">'+
        '<span style="flex:1;"><b>'+esc(row.name)+"</b>"+
        (row.rarity?"<i style=\"display:block;\">"+esc(row.rarity)+"</i>":"")+"</span>"+
        '<button class="btn" data-wizconless="'+esc(row.name)+'" style="padding:4px 9px;">\u2212</button>'+
        '<span style="font-family:var(--mono);min-width:16px;text-align:center;">'+n+"</span>"+
        '<button class="btn" data-wizconmore="'+esc(row.name)+'" style="padding:4px 9px;">+</button>'+
        "</div>";
    }).join("")+"</div>");
  return {filter: simFilterBar("cons",[{key:"rarity",label:"Any Rarity",options:rarities}])+
      '<p style="font-size:11px;color:var(--dim);">Up to three types come to a '+
      'battle, per the Handbook. Set how many of each.</p>',
    results: results};
}
document.addEventListener("click",function(e){
  var more=e.target.getAttribute&&e.target.getAttribute("data-wizconmore");
  var less=e.target.getAttribute&&e.target.getAttribute("data-wizconless");
  if(!more&&!less) return;
  var n=more||less;
  var cur=SIM_WIZ.cons[n]||0;
  var next=Math.max(0,cur+(more?1:-1));
  /* a deployment brings only what was packed */
  var pk0=simDepPack(); if(pk0 && next>(pk0.cons[n]||0)) next=pk0.cons[n]||0;
  if(next) SIM_WIZ.cons[n]=next; else delete SIM_WIZ.cons[n];
  var kinds=Object.keys(SIM_WIZ.cons).length;
  if(more && kinds>3 && !SIM_WIZ.cons[n]){
    /* stopped at three kinds, per the Handbook */
  }
  simWizRefreshResults();
});

function simWizEnemies(){
  if(!SIM.map)
    return {filter:"", results:"<p>Pick a map first \u2014 its Enemy Spawn tiles and their "+
      "Skull Levels decide what can arrive.</p>"};
  var want=simEnemyWant(), tiles=simEnemySpawnTiles();

/* A card's stats and effects live in _raw for a Forge card, and on the card
   itself for one from the Master. Reading only _raw gave Master Enemies no
   Actions at all, so they stood there unable to attack. */
function simUnitSpec(card, side){
  var raw=card._raw||{};
  var fx=raw.abilities||card.entries||card.abilities||[];
  var affs = card.affinities && card.affinities.length ? card.affinities
    : [raw.aff && {district:raw.aff, level:parseInt(raw.lvl,10)||0},
       raw.aff2 && {district:raw.aff2, level:parseInt(raw.lvl2,10)||0}].filter(Boolean);
  /* subtypes (Combat Roles) and Archetypes are what narrowing words match */
  var roles=card.combatRoles||(raw.roles&&typeof raw.roles==="object"
    ? Object.keys(raw.roles).filter(function(k){ return raw.roles[k]; }) : []);
  var spec={name:card.name, src:card.name, cardType:card.cardType,
          subtype:raw.subtype||card.subtype,
          stats:raw.stats||card.stats,
          behaviors:raw.behaviors||card.behaviors,
          combatRoles:roles, archetypes:card.archetypes||raw.arches||[],
          entries:fx, affinities:affs,
          skull:parseInt(card.skullLevel||raw.skull,10)||0, salvage:card.salvage||raw.salvage||"",
          lootPool:card.lootPool||raw.lootPool||[], setDrops:card.setDrops||raw.setDrops||[]},
      /* v13.4: a Unit from a variable-cost card has X = 1 until it is paid for */
      vc=simCostOf(card);
  if(simSlotX(vc.generic)||simSlotX(vc.affinity)) spec.x=1;
  return spec;
}
/* A card's Aether cost as it is printed, X and all. An older card kept only a
   flag that it had a variable cost, and a 0 where the X stood: its X is taken
   to be in the first slot that is empty, Generic before Affinity. */
function simCostOf(c){
  var a=c.aetherCost||{}, raw=c._raw||{};
  var cost={generic:(a.generic!==undefined&&a.generic!==null)?a.generic:0,
            affinity:(a.affinity!==undefined&&a.affinity!==null)?a.affinity:0};
  /* the Forge's own copy of a card still has the X where it was typed */
  if(simSlotX(raw.aeGen)) cost.generic=raw.aeGen;
  if(simSlotX(raw.aeAff)) cost.affinity=raw.aeAff;
  ["generic","affinity"].forEach(function(k){ if(simSlotX(cost[k])) cost[k]=String(cost[k]).trim().toUpperCase(); });
  if(c.hasVariableCost && !simSlotX(cost.generic) && !simSlotX(cost.affinity) && !simSlotX(a.affinity2)){
    if(!(parseInt(cost.generic,10)>0)) cost.generic="X";
    else if(!(parseInt(cost.affinity,10)>0)) cost.affinity="X";
  }
  return cost;
}
function simHandCardOf(c){
    /* A Forge card carries its effects in _raw.abilities; a card from the
       Master carries them as entries, with no _raw at all. Normalising here
       means the play paths never have to know which kind they were handed \u2014
       reading only _raw silently lost the effect on every Master card. */
    var raw=c._raw||{};
    /* Three shapes exist in practice: a Forge card keeps them in _raw.abilities,
       a schema card in entries, and a Master card in whatever it was published
       with \u2014 which is abilities. Accept all three rather than guessing. */
    var fx=(raw.abilities||c.entries||c.abilities||[]).map(function(a){
      return {name:a.name||"", kind:a.kind||a.tag||"Active",
              role:a.role||"", text:a.text||"",
              damage:(a.damage!==undefined?a.damage:a.dmg),
              range:(a.attackRange!==undefined?a.attackRange:a.rng),
              toHit:(a.toHit!==undefined?a.toHit:a.hit),
              pen:(a.armorPenetration!==undefined?a.armorPenetration:a.pen)};
    });
    return {name:c.name, type:c.cardType, cost:simCostOf(c),
            district:(c.affinities&&c.affinities[0]||{}).district||null,
            stats:raw.stats||c.stats||{}, subtype:raw.subtype||c.subtype||"",
            behaviors:raw.behaviors||c.behaviors||[],
            effects:fx, _raw:c._raw};
  }
function simWizFinish(){
  SIM.burst=null;
  /* the map dialog that had #simMapSel is long closed by this step; SIM.map
     was set there and is the one to use */
  var map=SIM.map;
  if(!map){ say("No map","<p>Go back and choose a map first.</p>"); return; }

  var heroCards=SIM_WIZ.heroes.map(simRefCard).filter(Boolean);
  if(!heroCards.length){ say("No Hero","<p>Choose at least one Hero first.</p>"); return; }
  var units=[];
  SIM.leader=null;
  heroCards.forEach(function(hc,i){
    var spec=simUnitSpec(hc,"ally");
    /* The Action Cards a Hero carries become Actions of that Hero. They are
       merged into the card's entries so the resolver builds them exactly like
       a printed Action \u2014 built by hand they came out with the wrong field
       names and could never be used. */
    var ref=SIM_WIZ.heroes[i];
    (SIM_WIZ.actions[ref]||[]).forEach(function(ar){
      var ac=simRefCard(ar);
      if(!ac) return;
      var fx=((ac._raw||{}).abilities||ac.entries||ac.abilities||[]);
      spec.entries=(spec.entries||[]).concat(fx.filter(function(a){
        return (a.text||"").trim() || (a.name||"").trim();
      }).map(function(a){
        var copy={}; for(var k in a) copy[k]=a[k];
        copy.name=(a.name||ac.name);
        copy.from=ac.name;
        return copy;
      }));
    });
    var u=R.unitFromCard(spec,"ally");
    /* v13.3 (Handbook, Section 3): an Action card prints its use cost: Energy,
       Aether, or both. The Aether part is paid from the Bank at every use. */
    (SIM_WIZ.actions[ref]||[]).forEach(function(ar){
      var ac=simRefCard(ar);
      if(!ac) return;
      /* v13.4: with a variable cost, X is chosen each time it is used. Until
         then it stands at 1, the least it can be: what it needs, how it reads. */
      var hc=simHandCardOf(ac), vary=simCardVar(hc), KX=window.KETER_KW;
      var cost=simCardCost(hc, vary?1:null);
      if(!cost.generic && !cost.affinity) return;
      ((ac._raw||{}).abilities||ac.entries||ac.abilities||[]).forEach(function(a){
        var nm=(a.name||ac.name);
        for(var ai=(u.actions||[]).length-1; ai>=0; ai--){
          var ua=u.actions[ai];
          if(ua.name===nm && !ua.aether){
            ua.aether=cost;
            if(vary){ ua.aetherX={generic:hc.cost.generic, affinity:hc.cost.affinity}; ua.textX=ua.text; ua.x=1;
              if(KX && KX.fillX) ua.text=KX.fillX(ua.textX, 1); }
            break;
          }
        }
      });
    });
    units.push(u);
    if(ref===SIM_WIZ.leader || (!SIM.leader && i===0)) SIM.leader=u.id;
  });
  /* Starting Troops come out of the Deck and begin on Player Spawn Tiles */
  var startNames=SIM_WIZ.startTroops.slice(), started=[];
  startNames.forEach(function(nm){
    var c=simAllCards().filter(function(x){ return x.name===nm; })[0];
    if(!c) return;
    var spec=simUnitSpec(c,"ally");
    var n=units.filter(function(u){ return u.side==="ally" &&
      (u.name===nm || (u.name||"").indexOf(nm+" ")===0); }).length;
    spec.name=nm+(n?" "+(n+1):"");
    var su=simXFill(R.unitFromCard(spec,"ally"));     /* a Starting Troop nobody paid for: X is 1 */
    units.push(su);
    started.push({name:nm, unit:su});
  });

  SIM.map=map; SIM.units=units; SIM.round=1; SIM.phase="turn";
  /* a new fight is never over, whatever the last one left behind */
  SIM.over=false; SIM.result=null; SIM.autoRunning=false; SIM.busy=false;
  SIM.deploy=SIM_DEP?JSON.parse(JSON.stringify(SIM_DEP)):null; SIM.deployResult=null; SIM.autoStop=false;
  if(window.KETER_PROG && map && map.district) KETER_PROG.see("district", String(map.district));
  SIM.phaseBack=null; SIM.enemyQueue=null; SIM.notice=null;
  SIM.loot=null; SIM.looted={}; SIM.lootResult=null; SIM.found=[];
  var loNow=simLoadoutList()[SIM_WIZ.loadout]||{};
  SIM.playerLevel=Math.max(1,Math.min(6,parseInt(loNow.level,10)||1));
  SIM.wave=0; SIM.waveTurn=0; SIM.waveTimer=SIM_WIZ.waveTimer||3;
  SIM.instability=SIM_WIZ.instability||0; SIM.bank=[];
  SIM.log=[]; SIM.selected=null; SIM.reach=[]; SIM.pan=null; SIM.targets=null;
  SIM.aether={}; SIM.hand=[]; SIM.discard=[]; SIM.field=[];

  SIM.deck=simWizDeckCards().map(simHandCardOf);
  for(var i=SIM.deck.length-1;i>0;i--){
    var j=Math.floor(simDice().roll("d20")/21*(i+1));
    var t=SIM.deck[i]; SIM.deck[i]=SIM.deck[j]; SIM.deck[j]=t;
  }
  /* The Pouch is what the Strike Team carries, not every Chip that exists.
     Each entry is expanded by how many were packed. */
  SIM.pouch=[];
  Object.keys(SIM_WIZ.pouch||{}).forEach(function(k){
    var qty=parseInt(SIM_WIZ.pouch[k],10)||0;
    var basic=/^basic\|/.test(k), card=basic?null:simRefCard(k);
    for(var i=0;i<qty;i++){
      SIM.pouch.push(basic
        ? {name:"Basic Chip \u00b7 District "+k.split("|")[1], value:1,
           district:k.split("|")[1], text:"", spent:false}
        : {name:(card&&card.name)||k, value:R.chipValue(card||{}),
           district:(card&&(card.affinities||[])[0]||{}).district||null,
           text:((card&&(card._raw||{}).abilities||card&&card.entries||[])
             .map(function(a){ return a.text; }).filter(Boolean).join(" ")),
           spent:false});
    }
  });
  /* The Enemy pile: Auto fills it from your Enemies at each Spawn Tile's Level,
     Manual takes exactly what you chose. Either way it is counted, and when it
     runs out no more Enemies arrive. */
  SIM.enemyPile=[];
  if(SIM_WIZ.enemyMode==="manual"){
    Object.keys(SIM_WIZ.foes).forEach(function(nm){
      var c=simAllCards().filter(function(x){ return x.name===nm; })[0];
      if(!c) return;
      for(var i=0;i<SIM_WIZ.foes[nm];i++)
        SIM.enemyPile.push({name:nm, level:parseInt(c.skullLevel||c.level,10)||1});
    });
  }else{
    var want=simEnemyWant();
    Object.keys(want).forEach(function(lv){
      var pool=SIM.deploy ? simFoePool(+lv, SIM.deploy.district, true) : simFoeCards().filter(function(c){ return c.cardType==="enemy" &&
        (parseInt(c.skullLevel||c.level,10)||1)===+lv; });
      if(!pool.length) return;
      /* (v14.24) on a deployment, one Enemy in two is drawn from the level below */
      var lower=(SIM.deploy && +lv>1) ? simFoePool(+lv-1, SIM.deploy.district, true) : [];
      for(var i=0;i<want[lv];i++){
        var from=(lower.length && simDice().roll("d6")<=3) ? lower : pool;
        var c=from[Math.floor(simDice().roll("d20")/21*from.length)];
        SIM.enemyPile.push({name:c.name, level:+lv});
      }
    });
  }
  for(var ei=SIM.enemyPile.length-1;ei>0;ei--){
    var ej=Math.floor(simDice().roll("d20")/21*(ei+1));
    var et=SIM.enemyPile[ei]; SIM.enemyPile[ei]=SIM.enemyPile[ej]; SIM.enemyPile[ej]=et;
  }

  /* Prototypes are persistent, kept on the Datapad rather than in the Deck */
  SIM.protos=SIM_WIZ.protos.map(function(name){
    var c=simAllCards().filter(function(x){ return x.name===name; })[0];
    /* a Master card carries its effects as entries, a Forge card in _raw */
    var fx=c ? ((c._raw||{}).abilities||c.entries||c.abilities||[]) : [];
    return c ? {name:c.name, text:fx.map(function(a){ return a.text; }).filter(Boolean).join(" "),
                fx:fx.filter(function(a){ return (a.text||"").trim(); }).map(function(a){ return {kind:a.kind||a.tag||"Passive", text:a.text}; })}
             : {name:name, text:"", fx:[]};
  });
  /* Consumables are always available, no Aether cost, kept in their own row */
  SIM.cons=[];
  Object.keys(SIM_WIZ.cons).forEach(function(name){
    var c=simAllCards().filter(function(x){ return x.name===name; })[0];
    for(var i=0;i<SIM_WIZ.cons[name];i++)
      SIM.cons.push({name:name, used:false,
        text:c?((c._raw||{}).abilities||c.entries||c.abilities||[]).map(function(a){return a.text;})
          .filter(Boolean).join(" "):""});
  });

  startNames.forEach(function(nm){
    for(var i=0;i<SIM.deck.length;i++)
      if(SIM.deck[i].name===nm){
        /* v13.3: the card goes with its Troop, and to the Discard Pile when it falls */
        var took=SIM.deck.splice(i,1)[0];
        var st=started.filter(function(s){ return s.name===nm && !s.unit.card; })[0];
        if(st) st.unit.card=took;
        break;
      }
  });

  simUndoClear();
  simPlace();
  simSpawnWave();
  simDrawPhase(true);
  /* the phase is a key from SIM_PHASES, not a label: set to the display name it
     matched nothing, so the tracker read as Waves and the board refused taps */
  SIM.phase="turn";
  simSave();
  $("modal").classList.remove("on");
  simFit(); simDraw(); renderSim();
}

function simPlace(){
  var taken={};
  var fallback=Object.keys(SIM.map.hexes).map(R.hexParse)
    .sort(function(a,b){ return a.r-b.r; });
  function claim(list, note){
    for(var i=0;i<list.length;i++){
      var k=R.hexKey(list[i].q,list[i].r);
      if(!taken[k]){ taken[k]=1; return {pos:{q:list[i].q,r:list[i].r}, note:note}; }
    }
    return null;
  }
  SIM.spawnWarning=null;
  SIM.units.forEach(function(u){
    var spawns=simSpawnTiles(u.side);
    var got = spawns.length ? claim(spawns,"spawn") : null;
    if(!got){
      /* a floor with no Spawn tiles for that side, or more Units than Spawns */
      var edge = u.side==="ally" ? fallback.slice().reverse() : fallback;
      got = claim(edge,"edge");
      SIM.spawnWarning = spawns.length
        ? "More Units than Spawn tiles; the rest deployed at the edge."
        : "This floor has no Spawn tiles, so both sides deployed at opposite edges.";
    }
    if(got) u.pos=got.pos;
  });
  /* everything placed at the start has just been deployed. Prototypes are the
     Strike Team's, not any one Unit's: their Passives act through the leader,
     so one written "when this Unit is deployed" fires as the fight begins. */
  SIM.haltedPassives={};
  SIM_EV.queue=[];
  simApplyContinuous();
  SIM.units.forEach(function(u){ if(u.side==="ally" && u.pos) simEmit("is deployed", u); });
  simFlushEvents();
}

/* ================= glossary page =================
   Handbook 13 stays the single source. This page presents it, says where each
   term is defined, and in Dev Mode adds new rows straight back into 13 so the
   two can never drift apart. */
function glossSections(){
  var hb=null;
  for(var i=0;i<DOCS.length;i++) if(DOCS[i].id==="hb") hb=DOCS[i];
  return hb?(hb.secs||[]):[];
}
/* This was a scan of every section for every one of 181 terms, re-run on each
   render and each keystroke. The answer only changes when the Handbook does,
   so it is built once and cached. */
var WHERE=null;
function buildWhere(){
  WHERE={};
  var hb=DOCS.find(function(d){ return d.id==="hb"; });
  if(!hb) return;
  var secs=(hb.secs||[]).filter(function(s){ return !/glossary/i.test(s.head); });
  var bodies=secs.map(function(s){ return secText(hb,s).toLowerCase(); });
  glossTerms().forEach(function(g){
    var needle=(g.label||g.term).toLowerCase();
    for(var i=0;i<secs.length;i++){
      if(bodies[i].indexOf(needle)>=0){ WHERE[g.term]=secs[i]; return; }
    }
  });
}
function whereDefined(term){
  if(!WHERE) buildWhere();
  return WHERE[term]||null;
}
/* Derive the term list from the Handbook's own Glossary source every time,
   including any unpublished edit, rather than from the cached build-time
   index. One source, and the page cannot fall behind it. */
function glossTerms(){
  var secs=glossSections(), target=null;
  for(var i=0;i<secs.length;i++) if(/glossary/i.test(secs[i].head)) target=secs[i];
  if(!target) return GLOSS;
  var e=editFor("hb",target.id);
  var md=e?e.md:(target.md||"");
  var out=[];
  md.split("\n").forEach(function(line){
    /* three columns now: term, definition, group. The two-column form is still
       read so an unedited Handbook keeps working. */
    var m=/^\|\s*\*\*([^*|]+)\*\*\s*\|\s*(.+?)\s*\|\s*([A-Za-z ]*)\|\s*$/.exec(line) ||
          /^\|\s*\*\*([^*|]+)\*\*\s*\|\s*(.+?)\s*\|\s*$/.exec(line);
    if(!m) return;
    var term=m[1].trim(), def=m[2].replace(/\*\*|\*/g,"").trim();
    var grp=(m[3]||"").replace(/\*\*/g,"").trim();
    /* the table's own header row is not a term */
    if(!def||/^term$/i.test(term)||/^definition$/i.test(def)) return;
    var label=term, alias=[term];
    var am=/^(.*?)\s*\(([^)]+)\)\s*$/.exec(term);
    if(am){ label=am[1].trim(); alias=[label,am[2].trim()]; }
    out.push({term:term,label:label,def:def,group:grp||"",
              alias:alias.filter(function(a){ return a.length>=2; })});
  });
  return out.length>20?out:GLOSS;
}

function renderGlossary(){
  var q=($("glq").value||"").toLowerCase().trim();
  var fg=$("glGroup")?$("glGroup").value:"";
  var sort=$("glSort")?$("glSort").value:"az";
  var all=glossTerms();

  /* the group list is built from the terms themselves, so it always matches
     what is actually in the Handbook */
  var sel=$("glGroup");
  if(sel){
    var groups=[], seen={};
    all.forEach(function(g){
      if(g.group && !seen[g.group]){ seen[g.group]=1; groups.push(g.group); }
    });
    groups.sort();
    var keep=sel.value;
    sel.innerHTML='<option value="">All groups</option>'+
      groups.map(function(x){ return '<option value="'+esc(x)+'">'+esc(x)+"</option>"; }).join("");
    if(keep) sel.value=keep;
  }

  var list=all.filter(function(g){
    if(fg && g.group!==fg) return false;
    if(!q) return true;
    return g.term.toLowerCase().indexOf(q)>=0 || (g.def||"").toLowerCase().indexOf(q)>=0;
  });
  list.sort(function(a,b){
    if(sort==="za") return b.term.localeCompare(a.term);
    if(sort==="group") return (a.group||"~").localeCompare(b.group||"~") ||
                              a.term.localeCompare(b.term);
    return a.term.localeCompare(b.term);
  });
  $("glcount").textContent=list.length+" term"+(list.length===1?"":"s")+
    (q?" matching":" from Handbook \u00a713");
  $("glAdd").style.display=isDev()?"":"none";
  $("gllist").innerHTML=list.map(function(g){
    var w=whereDefined(g.label||g.term);
    return '<div class="glrow"><b>'+esc(g.term)+
      (g.group?'<span class="grp">'+esc(g.group)+"</span>":"")+
      "</b><p>"+esc(g.def)+"</p>"+
      (w?'<span class="where" data-gloss-jump="'+esc(w.id)+'">'+esc(w.head)+"</span>":"")+
      (isDev()?'<div class="devbtns">'+
        '<button class="ghost" data-gl-edit="'+esc(g.term)+'">Edit</button>'+
        '<button class="ghost" data-gl-del="'+esc(g.term)+'" style="color:var(--danger);border-color:#5a2a24;">Delete</button>'+
        "</div>":"")+
      "</div>";
  }).join("") || '<div style="padding:24px 16px;color:var(--dim);font-size:12.5px;">No terms match.</div>';
}

$("glGroup")&&$("glGroup").addEventListener("change",function(){ renderGlossary(); });
$("glSort")&&$("glSort").addEventListener("change",function(){ renderGlossary(); });

/* Editing and deleting write back into Handbook \u00a713, which is the single
   source. Nothing is kept in a second list that could drift from it. */
function glossSectionMd(){
  var secs=glossSections(), target=null;
  for(var i=0;i<secs.length;i++) if(/glossary/i.test(secs[i].head)) target=secs[i];
  if(!target) return null;
  var e=editFor("hb",target.id);
  return {sec:target, md:(e?e.md:target.md)||""};
}
function writeGlossMd(target,md){
  HBEDITS.edits.hb=HBEDITS.edits.hb||{};
  HBEDITS.edits.hb[target.id]={md:md,at:Date.now()};
  saveHandbookEdits();
  WHERE=null; SECTXT={};
  for(var d=0;d<DOCS.length;d++) if(DOCS[d].id==="hb"){ sel.value=d; renderDoc(d); }
  renderGlossary();
}
function rowFor(md,term){
  var lines=md.split("\n");
  for(var i=0;i<lines.length;i++){
    var m=/^\|\s*\*\*([^*|]+)\*\*\s*\|/.exec(lines[i]);
    if(m && m[1].trim()===term) return i;
  }
  return -1;
}
document.addEventListener("click",function(e){
  var ed=e.target.closest?e.target.closest("[data-gl-edit]"):null;
  if(ed && isDev()){
    var term=ed.getAttribute("data-gl-edit");
    var g=glossTerms().filter(function(x){ return x.term===term; })[0];
    if(!g) return;
    var groups=["Stats","Combat","Turn","Economy","World","Units","Cards"];
    say("Edit term",
      '<input id="geTerm" value="'+esc(g.term)+'" style="width:100%;padding:10px;font-size:16px;background:#141f28;border:1px solid #33505e;color:var(--text);border-radius:3px;margin-bottom:8px;">'+
      '<textarea id="geDef" style="width:100%;height:110px;padding:10px;font-size:16px;background:#141f28;border:1px solid #33505e;color:var(--text);border-radius:3px;margin-bottom:8px;">'+esc(g.def)+"</textarea>"+
      '<select id="geGroup" style="width:100%;padding:10px;font-size:16px;background:#141f28;border:1px solid #33505e;color:var(--text);border-radius:3px;margin-bottom:10px;">'+
      groups.map(function(x){ return '<option value="'+x+'"'+(x===g.group?" selected":"")+">"+x+"</option>"; }).join("")+
      "</select>"+
      '<button class="ghost" id="geSave">Save</button>'+
      '<p style="font-size:11px;margin-top:10px;">Writes into Handbook \u00a713. Export the Handbook to publish it.</p>');
    window._glEditing=term;
    return;
  }
  var dl=e.target.closest?e.target.closest("[data-gl-del]"):null;
  if(dl && isDev()){
    var t2=dl.getAttribute("data-gl-del");
    say("Delete \u201c"+esc(t2)+"\u201d?",
      "<p>The term is removed from Handbook \u00a713 and stops being a tappable keyword.</p>"+
      "<p>This cannot be undone from here, though the Handbook can be edited back by hand.</p>"+
      '<button class="ghost" id="geDelYes" style="margin-right:8px;color:var(--danger);border-color:#5a2a24;">Delete</button>'+
      '<button class="ghost" id="geDelNo">Cancel</button>');
    window._glDeleting=t2;
    return;
  }
  var id=e.target&&e.target.id;
  if(id==="geSave"){
    var g2=glossSectionMd();
    if(!g2) return;
    var i=rowFor(g2.md,window._glEditing);
    if(i<0){ say("Not found","<p>That row is no longer in \u00a713.</p>"); return; }
    var nt=($("geTerm").value||"").trim(), nd=($("geDef").value||"").trim(),
        ng=$("geGroup").value;
    if(!nt||!nd){ return; }
    var lines=g2.md.split("\n");
    lines[i]="| **"+nt+"** | "+nd+" | "+ng+" |";
    writeGlossMd(g2.sec,lines.join("\n"));
    $("modal").classList.remove("on");
    return;
  }
  if(id==="geDelNo"){ $("modal").classList.remove("on"); return; }
  if(id==="geDelYes"){
    var g3=glossSectionMd();
    if(!g3) return;
    var j=rowFor(g3.md,window._glDeleting);
    if(j>=0){
      var ls=g3.md.split("\n");
      ls.splice(j,1);
      writeGlossMd(g3.sec,ls.join("\n"));
    }
    $("modal").classList.remove("on");
    return;
  }
  if(!e.target||e.target.id!=="gtSave") return;
  var term=($("gtTerm").value||"").trim(), def=($("gtDef").value||"").trim();
  if(!term||!def){ return; }
  var secs=glossSections(), target=null;
  for(var i=0;i<secs.length;i++) if(/glossary/i.test(secs[i].head)) target=secs[i];
  if(!target){ say("Not found","<p>The Glossary section could not be located in the Handbook.</p>"); return; }
  var cur=(HBEDITS.edits.hb&&HBEDITS.edits.hb[target.id])
    ? HBEDITS.edits.hb[target.id].md : target.md;
  var row="| **"+term+"** | "+def+" | "+(($("gtGroup")&&$("gtGroup").value)||"Cards")+" |";
  var lines=cur.replace(/\s+$/,"").split("\n");
  lines.push(row);
  HBEDITS.edits.hb=HBEDITS.edits.hb||{};
  HBEDITS.edits.hb[target.id]={md:lines.join("\n"),at:Date.now()};
  saveHandbookEdits();
  WHERE=null; SECTXT={};
  for(var d=0;d<DOCS.length;d++) if(DOCS[d].id==="hb"){ sel.value=d; renderDoc(d); }
  renderGlossary();
  $("modal").classList.remove("on");
  say("Added",'<p><b>'+esc(term)+'</b> was added to Handbook \u00a713. Export the Handbook to publish it.</p>');
});
