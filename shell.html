/* ---- the Enemy turn ------------------------------------------------------
   The app runs the Enemies so you do not have to. Every decision comes from
   the Behavior keywords on their cards through the resolver, and each one is
   reported with the reason \u2014 partly so you can check it, and partly because
   at a table you would have to say it out loud anyway. */
function simEnemyTurn(done){
  var foes=SIM.units.filter(function(u){ return u.side==="enemy" && !u.down; });
  var i=0;
  function step(){
    if(i>=foes.length){ if(done) done(); return; }
    var e=foes[i++];
    if(e.down) return step();
    simOneEnemy(e, step);
  }
  step();
}
function simOneEnemy(enemy, next){
  SIM.acting=enemy.id;
  enemy.travel=0;              /* Revision 16.1: what it moves this turn, for Charge */
  var allies=SIM.units.filter(function(u){ return u.side==="ally" && !u.down; });
  if(!allies.length) return next();

  /* v13.4 (Handbook, Stunned: "cannot act or move at all"): a Stunned Enemy
     loses its turn, and its Combo, interrupted, starts again. It used to be
     held to its tile and attack anyway. */
  if(R.effective(enemy).cannotAct){
    if((enemy.actions||[]).some(function(a){ return a.tag==="Combo"; })) enemy.comboAt=0;
    simLogEnemy(enemy.name+" is Stunned and loses its turn");
    simDraw(); renderSim();
    return setTimeout(next, 420);
  }

  /* movement first, exactly as the round sequence has it */
  var nearest=Math.min.apply(null, allies.map(function(a){
    return R.hexDistance(enemy.pos, a.pos); }));
  var plan=R.movePlan(enemy, {nearestEnemyDistance:nearest});

  if(plan.move==="away"){
    var away=simStepAway(enemy, allies);
    if(away) simLogEnemy(enemy.name+" backs off"+(plan.why?" ("+plan.why+")":""));
  }
  if(!plan.act){
    /* Cowardly takes no Action at all, and loses its place in a Combo */
    if((enemy.actions||[]).some(function(a){ return a.tag==="Combo"; })) enemy.comboAt=0;
    simLogEnemy(enemy.name+" does not act"+(plan.why?" ("+plan.why+")":""));
    simDraw(); renderSim();
    return setTimeout(next, 420);
  }

  var target=R.chooseTarget(enemy, allies, {
    distance:function(u){ return R.hexDistance(enemy.pos,u.pos); }
  });
  if(!target){ return setTimeout(next, 200); }

  /* close the distance if it needs to */
  var act=simEnemyAction(enemy, target);
  if(!act.inReach){
    simStepToward(enemy, target);
    act=simEnemyAction(enemy, target);
  }
  /* v13.2: a held shot can bring it down as it moves. It used to go on and
     make its attack anyway. */
  if(enemy.down){ simDraw(); renderSim(); return setTimeout(next, 380); }
  /* (v14.24) still out of reach: another in reach instead */
  if(!act.inReach){ var alt=simInReachInstead(enemy, allies, target); if(alt){ target=alt.target; act=alt.act; } }
  if(!act.action){
    simLogEnemy(enemy.name+" has nothing it can use");
    simDraw(); renderSim();
    return setTimeout(next, 380);
  }
  /* v13.2: still out of reach after its move, it has nothing to attack with
     from here. It used to attack regardless, from wherever it stood. */
  if(!act.inReach){
    simLogEnemy(enemy.name+" has nothing in reach");
    simDraw(); renderSim();
    return setTimeout(next, 380);
  }

  /* Revision 16.1: a Lunge closes the gap first */
  if(!simDoLunge(enemy, act.action, target)){ simDraw(); renderSim(); return setTimeout(next, 380); }
  var why=simWhyTarget(enemy, target);
  var ctx={distance:R.hexDistance(enemy.pos,target.pos),
           cover:simCoverFor(target,enemy), evasive:target.evasive||0, rolls:{}};
  function resolve(){
    var c=Object.assign({}, ctx);
    if(SIM.autoRunning) c.dice=simDice(); else c.manual=true;
    var res=R.resolveAttack(enemy, simCharged(enemy, act.action), target, c);
    if(res.damage && simCharged(enemy, act.action)._charge) res.charge=simChargeOf(act.action);
    if(res.pending){
      simGetRoll({die:res.die, needed:res.needed,
        label:enemy.name+(res.pending==="accuracy"?" rolls to hit":" rolls to Penetrate"),
        pass:res.pending==="accuracy"?"Hit":"Penetrates", fail:res.pending==="accuracy"?"Miss":"Glances off",
        prompt:enemy.name+" attacks "+target.name+" \u2014 roll "+
          (res.pending==="accuracy"?"to hit":"to Penetrate")},
        function(v){ ctx.rolls[res.pending]=v; resolve(); });
      return;
    }
    simApplyEnemyAttack(enemy, act.action, target, res, why, {follow:burstDone>0});
    simDraw(); renderSim();
    /* Burst: the next attack chooses afresh, as the Enemy normally targets,
       among what its Action can still reach */
    burstDone++;
    if(burstDone<burstTotal && !enemy.down){
      var pool=SIM.units.filter(function(u){ return u.side==="ally" && !u.down && u.pos && simCanReach(enemy,act.action,u,true); });
      if(pool.length){
        target=R.chooseTarget(enemy, pool, {distance:function(u){ return R.hexDistance(enemy.pos,u.pos); }})||pool[0];
        why=simWhyTarget(enemy, target);
        ctx={distance:R.hexDistance(enemy.pos,target.pos), cover:simCoverFor(target,enemy), evasive:target.evasive||0, rolls:{}};
        setTimeout(resolve, SIM.autoRunning?60:520);
        return;
      }
      simLogEnemy(enemy.name+"'s Burst ends: nothing left in reach");
    }
    simAfterAttacks(enemy, target);
    setTimeout(next, 520);
  }
  var burstTotal=simBurstOf(act.action), burstDone=0;
  resolve();
}
/* Revision 16.1: an Enemy with an always-on Dash hits and runs: once its
   attacks are made, it Dashes away from the Unit it attacked last. */
function simAfterAttacks(enemy, target){
  if(!(+enemy.pDash>0) || enemy.down || SIM.over) return;
  simLogEnemy(simDashAway(enemy, target, +enemy.pDash));
  simCheckDowns();
}
/* Why it picked who it picked, in the words of the keyword that decided. */
function simWhyTarget(enemy, target){
  var defs=(enemy.behaviors||[]).map(function(b){
    var d=(R.behaviors()||[]).filter(function(x){ return x.k===b.k; })[0];
    return d?d.name:null;
  }).filter(Boolean);
  return defs.length ? defs.join(", ") : "closest";
}
function simApplyEnemyAttack(enemy, action, target, res, why, opts){
  opts=opts||{};
  if(!opts.follow) enemy.nrg=Math.max(0, enemy.nrg-(parseInt(action.cost,10)||0));
  simFxHold(target);
  target.lastAttackedBy=enemy.id;
  target.attackedThisRound=true;
  simEmit("attacks", enemy, target); simEmit("is attacked", target, enemy);
  var prevDealer=SIM_EV.dealer; SIM_EV.dealer=enemy;
  var line=enemy.name+" used "+action.name+" on "+target.name+" ("+why+"): ";
  if(res.damage){
    R.hit(target,res.damage,true);   /* Revision 16.3: Hardened is in res.damage already */
    line+=res.damage+" damage"+(res.charge?" (Charge +"+res.charge+")":"")+(res.halved?" halved":"")+
      (target.down?" \u2014 "+target.name+" is down":"");
  } else if(res.hit===false){ line+="missed"; }
  else if(res.penetrated===false){ line+="no Penetration"; }
  else { line+="no effect"; }
  simLogEnemy(line);
  if(action.text && res.hit!==false && res.penetrated!==false)
    simRunText(action.text,{actor:enemy, target:target, damaged:(res.damage||0)>0,
      killed:!!target.down, damage:res.damage||0, sourceCard:action.name});
  SIM_EV.dealer=prevDealer;
  simCheckDowns();
  var ht=simHitText(res);
  simShot(enemy, target, action, function(){ simFxRelease(target, ht); });
  /* advance the Combo, unless a Special overrode it \u2014 once per Burst */
  var combo=(enemy.actions||[]).filter(function(a){ return a.tag==="Combo"; });
  if(combo.length && action.tag==="Combo" && !opts.follow)
    enemy.comboAt=((enemy.comboAt||0)+1)%combo.length;
}
/* Would this Action's AoE catch a Unit on the actor's own side? */
function simHurtsOwnSide(actor, a, target){
  var K=window.KETER_KW;
  if(!K || !a.text || !target || !target.pos) return false;
  /* 14.12: a Line or a Cone running through one of its own counts too */
  var shp=K.parse(a.text).filter(function(p){ return p.type==="kw" && p.kw && (p.kw.name==="Line"||p.kw.name==="Cone"); })[0];
  if(shp && actor.pos && simShapeTiles(shp.kw.name, actor.pos, target.pos, parseInt(shp.n,10)||1).some(function(t){
      var u=simUnitAt(t.q,t.r); return u && u!==target && u!==actor && u.side===actor.side; })) return true;
  var aoe=K.parse(a.text).filter(function(p){ return p.type==="kw" && p.kw && p.kw.name==="AoE"; })[0];
  if(!aoe) return false;
  var rad=parseInt(aoe.n,10)||1;
  return SIM.units.some(function(u){
    return u!==target && !u.down && u.pos && u.side===actor.side &&
      R.hexDistance(u.pos,target.pos)<=rad;
  });
}
function simEnemyAction(enemy, target){
  var d=R.hexDistance(enemy.pos,target.pos);
  var combo=(enemy.actions||[]).filter(function(a){ return a.tag==="Combo"; });
  var pick=null;
  if(combo.length){
    var i=((enemy.comboAt||0)%combo.length+combo.length)%combo.length;
    pick=combo[i];
  }
  var usable=function(a){
    if(!a) return false;
    if(a.tag==="Passive"||a.tag==="Aura") return false;
    if(simTileAction(a)) return false;               /* 14.12: Auto aims at Units, not tiles */
    if(!R.canAfford(enemy,a)) return false;
    if(!simAetherOK(enemy,a)) return false;          /* v13.4: one of yours under Auto, with a carried Action card */
    if(!simCanReach(enemy,a,target)) return false;   /* range, and sight when ranged */
    /* (v14.24) nor one that would only give the target a status it already has */
    if(simPointless(a,target)) return false;
    /* Auto never drops an area effect on its own side */
    if(simHurtsOwnSide(enemy,a,target)) return false;
    return true;
  };
  if(usable(pick)) return {action:pick, inReach:true};
  var any=(enemy.actions||[]).filter(usable)[0];
  if(any) return {action:any, inReach:true};
  return {action:pick||(enemy.actions||[])[0]||null, inReach:false};
}
/* (v14.24) An Action that would do nothing to this target: it deals no damage
   and heals nothing, does nothing else, and every status it gives is one the
   target already has (or has only just shrugged off). Auto and the Enemies
   don't use it; they move to bring another Action in reach. */
function simPointless(a, target){
  var eff=R.actionEffect(a);
  if((eff.damage||0)>0 || (eff.heal||0)>0) return false;
  var K=window.KETER_KW, statuses=[];
  if(!K) return false;
  var parts=K.parse(a.text||"");
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(p.type!=="kw" || !p.kw) continue;
    var cat=String(p.kw.cat||"");
    if(cat==="status") statuses.push(String(p.kw.name));
    else if(cat==="effect"||cat==="modifier"||cat==="stats") return false;
  }
  if(!statuses.length) return false;
  return statuses.every(function(k){ return !!R.lockBlock(target, k); });
}
/* (v14.24) A Unit whose chosen target is still out of reach after its move
   attacks another it can reach, chosen by its own Behavior keywords, rather
   than do nothing. {target, act}, or null. */
function simInReachInstead(unit, pool, target){
  var near=pool.filter(function(u){ return u!==target && !u.down && u.pos && simEnemyAction(unit, u).inReach; });
  if(!near.length) return null;
  var pick=R.chooseTarget(unit, near, {distance:function(u){ return R.hexDistance(unit.pos,u.pos); }})||near[0];
  return {target:pick, act:simEnemyAction(unit, pick)};
}
/* One move toward or away, respecting Movement Speed and the map. */
function simStepToward(enemy, target){
  var tiles=simReach(enemy, simMoveSteps(enemy));
  if(!tiles.length) return false;
  /* A hazard is walked around when there is a way around, and walked through
     when there is not \u2014 so a corridor of fire still gets crossed rather than
     leaving a Unit standing at the edge of it forever. */
  var clear=tiles.filter(function(t){ return !simHazardAt(t.q,t.r); });
  var pool = clear.length ? clear : tiles;
  var best=null;
  pool.forEach(function(t){
    var d=R.hexDistance({q:t.q,r:t.r}, target.pos);
    if(!best || d<best.d || (d===best.d && t.cost<best.cost))
      best={q:t.q, r:t.r, d:d, cost:t.cost};
  });
  /* if every safe tile leads away from the target, take the hazard */
  if(clear.length && best && best.d >= R.hexDistance(enemy.pos,target.pos)){
    var through=null;
    tiles.forEach(function(t){
      var d=R.hexDistance({q:t.q,r:t.r}, target.pos);
      if(!through || d<through.d) through={q:t.q, r:t.r, d:d, cost:t.cost};
    });
    if(through && through.d < best.d) best=through;
  }
  if(best && best.d < R.hexDistance(enemy.pos,target.pos)){
    enemy.pos={q:best.q, r:best.r};
    enemy.travel=(enemy.travel||0)+best.cost;
    simHazardHit(enemy, "moves onto");
    simEmit("moves", enemy);
    simReactTo(enemy);
    return true;
  }
  return false;
}
function simStepAway(enemy, allies){
  var tiles=simReach(enemy, simMoveSteps(enemy));
  if(!tiles.length) return false;
  var here=Math.min.apply(null, allies.map(function(a){
    return R.hexDistance(enemy.pos,a.pos); }));
  var best=null;
  tiles.forEach(function(t){
    var d=Math.min.apply(null, allies.map(function(a){
      return R.hexDistance({q:t.q,r:t.r}, a.pos); }));
    if(!best || d>best.d) best={q:t.q, r:t.r, d:d, cost:t.cost};
  });
  if(best && best.d>here){
    enemy.pos={q:best.q,r:best.r};
    enemy.travel=(enemy.travel||0)+best.cost;
    simHazardHit(enemy, "backs onto");
    simEmit("moves", enemy); simCheckDowns();
    return true;
  }
  return false;
}
function simLogEnemy(text){
  SIM.log.push({t:Date.now(), text:text});

/* ---- playing a card from hand --------------------------------------------
   Troops deploy to a Spawn tile, Equipment attaches to a standing Unit, an
   Action resolves like any other Action (targeted if it damages or heals),
   and a Command is logged for the Player to interpret \u2014 consistent with how
   the rest of the app treats free text it cannot mechanically parse. */
/* v13.4 (Handbook 15.8, Variable Costs): a cost slot may hold X, XX or XXX.
   X is chosen as the card is played, at least 1; XX is that X paid twice. */
function simSlotX(v){ var m=/^X{1,3}$/i.exec(String(v==null?"":v).trim()); return m?m[0].length:0; }
function simCardVar(card){
  var c=(card&&card.cost)||{};
  return !!(simSlotX(c.generic)||simSlotX(c.affinity));
}
/* What a card costs: with X as given, else the X it is being played for, else 1. */
function simCardCost(card, x){
  var c=card.cost||{generic:0,affinity:0};
  var n=Math.max(1, parseInt((x===undefined||x===null)?card.x:x,10)||1);
  var slot=function(v){ var k=simSlotX(v); return k ? k*n : (parseInt(v,10)||0); };
  return {generic:slot(c.generic), affinity:slot(c.affinity),
          district:card.district};
}
/* Whether the Bank could pay for it at all: a variable cost at its least. */
function simCanPlay(card){
  return R.aetherCanPay(SIM.aether, simCardCost(card, simCardVar(card)?1:null));
}
/* The most X the Bank could pay for. */
function simMaxX(card){
  var n=0;
  while(n<20 && R.aetherCanPay(SIM.aether, simCardCost(card, n+1))) n++;
  return n;
}
function simXNote(card){ return simCardVar(card) ? " (X = "+(parseInt(card.x,10)||1)+")" : ""; }
/* A Unit that came from a variable-cost card reads its text with its X in
   place from the moment it arrives. */
function simXFill(u){
  var K=window.KETER_KW;
  if(!u || u.x===undefined || u.x===null || !K || !K.fillX) return u;
  (u.actions||[]).forEach(function(a){ if(a.text) a.text=K.fillX(a.text, u.x); });
  return u;
}
/* Choosing X: a stepper from 1 to what the Bank can pay, then the play goes on. */
function simAskX(label, max, costOf, then){
  var w={n:1, max:Math.max(1,max), costOf:costOf, then:then, label:label};
  window._simX=w;
  simAskXDraw();
}
function simAskXDraw(){
  var w=window._simX; if(!w) return;
  say("Choose X",
    "<p>"+esc(w.label)+" has a variable cost. X is at least 1, and at most what the Bank can pay.</p>"+
    '<div style="display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0;">'+
    '<button class="ghost" id="simXLess"'+(w.n<=1?" disabled":"")+'>\u2212</button>'+
    '<b id="simXNow" style="font-size:22px;min-width:64px;text-align:center;">X = '+w.n+"</b>"+
    '<button class="ghost" id="simXMore"'+(w.n>=w.max?" disabled":"")+">+</button></div>"+
    '<p style="font-size:12px;color:var(--dim);text-align:center;">Costs '+esc(w.costOf(w.n))+
    " \u00b7 the Bank holds "+simAetherLabel(SIM.aether)+"</p>"+
    '<div class="row" style="display:flex;gap:7px;margin-top:11px;">'+
    '<button class="ghost" id="simXGo" style="flex:1;">Play it</button>'+
    '<button class="ghost" id="simXNo" style="flex:1;">Not yet</button></div>');
}
document.addEventListener("click",function(e){
  var id=e.target&&e.target.id, w=window._simX;
  if(!w || !/^simX(Less|More|Go|No)$/.test(id||"")) return;
  if(id==="simXLess"){ w.n=Math.max(1,w.n-1); simAskXDraw(); return; }
  if(id==="simXMore"){ w.n=Math.min(w.max,w.n+1); simAskXDraw(); return; }
  window._simX=null; $("modal").classList.remove("on");
  if(id==="simXGo") w.then(w.n);
});
/* Tapping a card shows it before it commits. The Datapad already confirms an
   Action before it fires; a card costing Aether deserves the same, and it is
   the only place the rules text is legible. */
function simCardSheet(idx){
  var card=SIM.hand[idx];
  if(!card) return;
  var can=simCanPlay(card);
  var text=(card.effects||[]).map(function(f){
    return (f.name?"<b>"+esc(f.name)+"</b> ":"")+esc(kwPlain(f.text||""));

document.addEventListener("click",function(e){

  if(id!=="simCardGo") return;

function simPlayCard(idx){
  var card=SIM.hand[idx];
  if(!card) return;
  if(simBurstLive()){ simSay("Finish the Burst first \u2014 choose its next target."); return; }
  /* Handbook 14.0: cards are played on your turn, like moving and acting.
     Moving and attacking already refused otherwise; playing a card never did. */
  if(!simCanAct()){ simSay("Cards are played on your turn \u2014 it is the "+simPhaseDef().name+" phase."); return; }
  if(!simCanPlay(card)){
    say("Not enough Aether",
      "<p>"+esc(card.name)+" needs "+simCostLabel(card)+
      ", and the Bank holds "+simAetherLabel(SIM.aether)+".</p>");
    return;
  }
  /* v13.4: a variable cost asks for X before anything else */
  if(simCardVar(card)){
    simAskX(card.name, simMaxX(card), function(n){ return simCostLabel(card, n); }, function(n){
      card.x=n; simPlayCardGo(idx);
    });
    return;
  }
  simPlayCardGo(idx);
}
function simPlayCardGo(idx){
  var card=SIM.hand[idx];
  if(!card) return;
  if(card.type==="troop"){ simPlayTroop(idx); return; }
  if(card.type==="equipment"){ simPlayEquipment(idx); return; }
  if(card.type==="action"){ simPlayAction(idx); return; }
  simPlayPlain(idx);   /* Commands and anything else: pay, resolve, discard */
}
/* What a card costs, in words. A variable slot reads X until x is given. */
function simCostLabel(card, x){
  if(card.type==="sphere") return "generates Aether";
  if(card.type==="consumable") return "no Aether cost";
  var c=simCardCost(card, x), raw=card.cost||{}, parts=[];
  var given=!(x===undefined||x===null);
  var aff=(simSlotX(raw.affinity)&&!given) ? String(raw.affinity).trim().toUpperCase() : c.affinity;
  var gen=(simSlotX(raw.generic)&&!given) ? String(raw.generic).trim().toUpperCase() : c.generic;
  if(aff) parts.push(aff+(c.district?" D"+c.district:""));
  if(gen) parts.push(gen+"\u25c7");
  return parts.length?parts.join(" + "):"free";
}
function simPayAndDiscard(idx){
  var card=SIM.hand[idx];
  simSnapshot("playing "+card.name);
  R.aetherPay(SIM.aether, simCardCost(card));
  SIM.hand.splice(idx,1);
  /* v13.3: a Troop's card and an Equipment card stay on the Battlefield with
     their Unit (simDiscardOf); everything else is discarded as it is played */
  if(card.type!=="troop" && card.type!=="equipment") SIM.discard.push(card);
  return card;
}
/* Handbook 15.3: a card's coloured words are carried out, and whatever is
   left over is written into the log. A card aimed at one Unit asks which. */
function simCardNeeds(card){
  var K=window.KETER_KW, need=null, radius=0;
  var fill=function(t){ return (K && K.fillX && simCardVar(card)) ? K.fillX(t||"", card.x) : (t||""); };
  (card.effects||[]).forEach(function(e){
    (K?K.parse(fill(e.text)):[]).forEach(function(p){
      if(p.type!=="kw"||!p.kw) return;
      if(p.kw.name==="target enemy") need=need||"enemy";
      if(p.kw.name==="target ally") need=need||"ally";
      if(p.kw.name==="target tile") need=need||"tile";
      if(/^all (enemies|allies|units) within$/.test(p.kw.name)) radius=Math.max(radius,parseInt(p.n,10)||0);
      if(p.kw.name==="AoE") radius=Math.max(radius,parseInt(p.n,10)||0);
    });
  });
  card._aimRadius=radius;
  /* Revision 15.6: "target Sniper ally" offers only Snipers */
  card._aimNarrow=[];
  if(K && K.analyse) (card.effects||[]).forEach(function(e){
    K.sentences(fill(e.text)).forEach(function(sent){
      K.analyse(sent).targets.forEach(function(t){
        if(/^target (enemy|ally)$/.test(t.part.kw.name) && !card._aimNarrow.length) card._aimNarrow=t.narrow;
      });
    });
  });
  return need;
}
/* Handbook 15.3: an area can be centred on any tile. Aiming shows what it
   would catch, and nothing happens until it is confirmed. */
function simBeginAim(idx, card, rec){
  SIM.aim={idx:idx, card:card.name, radius:card._aimRadius||0, at:null, recover:rec||null};
  SIM.selected=null; SIM.reach=[]; SIM.targets=null;

}

function simConfirmAim(){

function simLeader(){

/* v13.3 (Revision 15.7): a card that Recovers asks which Troop's card before

function simRecoverable(){ return (SIM.discard||[]).filter(function(c){ return c && c.type==="troop"; }); }
function simWithRecover(label, text, then){
  var K=window.KETER_KW;

  if(!asks){ then(null); return true; }
  var pool=simRecoverable();
  if(!pool.length){ simSay(label+" Recovers a Troop's card from the Discard Pile, and there is none there."); return false; }
  if(pool.length===1){ then(pool[0]); return true; }
  say("Recover which Troop?",
    "<p>"+esc(label)+" returns one Troop's card from the Discard Pile to your hand.</p>"+
    pool.map(function(c,i){
      return '<div class="cbtarget" data-simrecover="'+i+'"><b style="color:var(--text);">'+esc(c.name)+"</b>"+
        '<i style="font-style:normal;display:block;font-size:11px;color:var(--dim);">'+esc(simCostLabel(c))+"</i></div>";
    }).join(""));
  window._simRecover={pool:pool, then:then};
  return true;
}
document.addEventListener("click",function(e){
  var row=e.target.closest?e.target.closest("[data-simrecover]"):null;
  if(!row || !window._simRecover) return;
  var w=window._simRecover, c=w.pool[+row.getAttribute("data-simrecover")];
  window._simRecover=null; $("modal").classList.remove("on");
  w.then(c);
});
function simCardText(card){ return (card.effects||[]).map(function(e){ return e.text||""; }).join(" "); }
function simPlayPlain(idx){
  var card=SIM.hand[idx];
  var need=simCardNeeds(card);
  simWithRecover(card.name, simCardText(card), function(rec){
    if(need==="tile"){ simBeginAim(idx, card, rec); return; }
    if(need){
      var actor=simLeader();
      var pool=SIM.units.filter(function(u){
        return !u.down && u.pos && (need==="enemy" ? u.side!=="ally" : u.side==="ally") &&
          simNarrowOK(u, card._aimNarrow||[], {actor:actor}); });
      if(!pool.length){ simSay(card.name+" needs "+(need==="enemy"?"an Enemy":"another friendly Unit")+
        " to target, and there is none."); return; }
      simBeginPick(card.name, pool, function(t){ simResolveCard(simPayAndDiscard(idx), t, rec); });
      return;
    }
    simResolveCard(simPayAndDiscard(idx), null, rec);
  });
}

function simUseConsumable(i){

/* ---- the turn's income -------------------------------------------------
   Handbook: Heroes generate Aether of their own Affinity equal to their
   Affinity Level, and the Player draws Chips equal to their Player Level. The
   two are separate and both happen before anything is played. */
function simAetherLabel(pool){
  var parts=[];
  Object.keys(pool).sort().forEach(function(k){
    if(!pool[k]) return;
    parts.push(pool[k]+(k==="generic"?"\u25c7":" D"+k.slice(1)));
  });
  return parts.length?parts.join("  "):"\u2014";
}
/* Each step of the upkeep is its own phase now, so the player watches the
   Aether arrive and the cards come rather than finding it already done. */
function simPhaseGenerate(){
  var income=R.aetherIncome(SIM.units,"ally");
  if(R.aetherTotal(income)){
    R.aetherAdd(SIM.aether, income);
    SIM.log.push({t:Date.now(), text:"Heroes generated "+simAetherLabel(income)});
  } else {
    SIM.log.push({t:Date.now(), text:"No Hero generated Aether this turn"});
  }
}
function simPhaseChips(){
  var drew=[];
  for(var i=0;i<SIM.playerLevel;i++){
    if(!SIM.pouch.length) break;
    var idx=Math.floor(simDice().roll("d20")/21*SIM.pouch.length);
    var chip=SIM.pouch.splice(Math.min(idx,SIM.pouch.length-1),1)[0];
    chip.spent=false;
    SIM.bank.push(chip);
    drew.push(chip);
  }
  SIM.log.push({t:Date.now(), text: drew.length
    ? ("Drew "+drew.length+" Aether Chip"+(drew.length===1?"":"s")+": "+
        drew.map(function(c){ return c.name; }).join(", "))
    : "The Aether Pouch is empty"});
  var gen={};
  SIM.bank.forEach(function(c){
    var key=c.district?("d"+c.district):"generic";
    gen[key]=(gen[key]||0)+(c.value||0);
  });
  if(R.aetherTotal(gen)){
    R.aetherAdd(SIM.aether,gen);
    SIM.log.push({t:Date.now(), text:"The Bank generated "+simAetherLabel(gen)+" from "+
      SIM.bank.length+" Chip"+(SIM.bank.length===1?"":"s")});
  }
}
function simPhaseDraw(opening){
  var heroes=SIM.units.filter(function(u){
    return u.side==="ally" && !u.down && /hero/i.test(u.cardType||""); }).length;
  var want = opening ? 6 : heroes;
  var pulled=0;
  for(var h=0;h<want;h++){
    if(!SIM.deck.length && !simRefillDeck()) break;
    SIM.hand.push(SIM.deck.shift()); pulled++;
  }
  SIM.log.push({t:Date.now(), text: pulled
    ? ("Drew "+pulled+" card"+(pulled===1?"":"s"))
    : (SIM.deck.length?"No Hero left to draw for":"The Deck is empty")});
}
/* (v14.24) An empty Deck takes back the cards played so far, shuffled: every one
   in the discard pile but a Troop's (a fallen Troop stays fallen). Returns
   whether there are cards to draw again. */
function simRefillDeck(){
  if((SIM.deck||[]).length) return true;
  var isBack=function(c){ return c && typeof c==="object" && String(c.type||"")!=="troop"; };
  var back=(SIM.discard||[]).filter(isBack);
  if(!back.length) return false;
  SIM.discard=(SIM.discard||[]).filter(function(c){ return !isBack(c); });
  for(var i=back.length-1;i>0;i--){
    var j=Math.floor(simDice().roll("d20")/21*(i+1));
    var t=back[i]; back[i]=back[j]; back[j]=t;
  }
  SIM.deck=back;
  SIM.log.push({t:Date.now(), text:"The Deck is empty: "+back.length+" played card"+(back.length===1?" is":"s are")+" shuffled back in"});
  return true;
}
/* kept for the opening hand, which happens before the first phase */
function simDrawPhase(opening){
  if(opening){ simPhaseGenerate(); simPhaseChips(); simPhaseDraw(true); }
  return [];
}

/* ---- selecting and moving ---------------------------------------------- */
function simSelect(u){
  SIM.pendingAct=null; SIM.odds=null;
  SIM.selected = u ? u.id : null;
  SIM.reach = [];
  SIM.targets = null;
  if(u && u.side==="ally" && !u.down && u.pos) simMarkTargets(u);
  if(u && u.side==="ally" && !u.down && u.pos && SIM.phase==="turn"){
    var eff=R.effective(u);
    /* Movement Speed is what a Unit may cover in a turn, and it may be spent in
       pieces. Reach was worked out from the full MS every time a Unit was
       selected, so re-selecting refilled it and a Unit could walk all day. */
    var left=simMoveLeft(u);
    /* Revision 16.1: with a Dash on top, and Leap's jumps among them */
    SIM.reach = simReach(u, left);
  }
  simDraw(); renderSim();
}
/* Enemies this Unit could attack from where it stands: something in reach of
   at least one Action it can still pay for. */
/* Handbook 15.3: a ranged Action needs range and line of sight; melee reaches
   an adjacent tile, and a wall on the edge between them stops it. */
function simSees(a,b){
  var segs=SIM._wallSegs;
  if(!segs || SIM._wallSegsFor!==SIM.map){
    segs=SIM._wallSegs=R.wallSegments((SIM.map||{}).walls||{}); SIM._wallSegsFor=SIM.map;
  }
  return R.lineOfSight(a,b,null,segs);
}
/* Cyber (the unit rework) reaches and aims like a ranged attack; it then has to
   penetrate Integrity rather than Armor Class */
function simAimed(role){ role=String(role||"").toLowerCase(); return role==="ranged"||role==="cyber"; }
/* noLunge: the next attacks of a Burst, and a held shot, reach as they stand */
function simCanReach(u,a,f,noLunge){
  var d=R.hexDistance(u.pos,f.pos);
  var role=String(a.role||"").toLowerCase();
  if(simAimed(role))
    return d <= (parseInt(a.rng,10)||1)+(R.effective(u).range||0) && simSees(u.pos,f.pos);
  if(d===1 && !simWallFor(null)(u.pos,f.pos)) return true;
  /* Revision 16.1: a Lunge reaches as far as it can walk to stand beside the target */
  var lg=noLunge?0:simLungeOf(a);
  if(!lg || d>lg+1) return false;
  return !!simLungeSpot(u,a,f);
}
/* ---- Revision 16.1: the movement keywords -------------------------------
   Lunge and Charge ride on a Melee Action; Dash and Leap are given to a Unit.
   A Unit's travel is every tile it has moved this turn of its own accord:
   walking, a Lunge, a Leap or a Dash (never a Push). Charge reads it. */
function simKwNum(action, name){
  var m=String((action&&action.text)||"").match(new RegExp("\\[\\[\\s*"+name+"\\s+(\\d+)\\s*\\]\\]","i"));
  return m?Math.max(0,parseInt(m[1],10)||0):0;
}
function simMeleeRole(a){ var r=String((a&&a.role)||"").toLowerCase(); return r==="melee"||r===""; }
function simLungeOf(a){ return simMeleeRole(a) ? simKwNum(a,"Lunge") : 0; }
function simChargeOf(a){ return simMeleeRole(a) ? simKwNum(a,"Charge") : 0; }
function simLeapOf(u){
  var n=Math.max(+(u&&u.leap)||0, +(u&&u.pLeap)||0);
  ((u&&u.mods)||[]).forEach(function(m){ if(m.stat==="LEAP") n=Math.max(n, +m.amt||0); });
  return n;
}
/* How far a Unit may move this turn in all: its Movement Speed, and for one of
   yours any Dash on top (an Enemy Dashes at once instead). Rooted or Stunned, none. */
function simMoveSteps(u){
  var eff=R.effective(u);
  if(eff.cannotMove) return 0;
  return Math.max(0,eff.ms)+(u.side==="ally"?(+u.dash||0)+(+u.pDash||0):0);
}
function simMoveLeft(u){ return Math.max(0, simMoveSteps(u)-(u.moved||0)); }
/* The tiles a Unit could move to with this many steps: walking round walls
   and Units, and with Leap, jumping to any empty tile that near as well. */
function simReach(u, steps){
  var tiles=R.reachable(u.pos, steps, {
    wall:simWallFor(u),
    passable:function(n){ return !!SIM.map.hexes[R.hexKey(n.q,n.r)]; },
    blocked:function(n){ return !!simUnitAt(n.q,n.r); }
  });
  var lp=Math.min(simLeapOf(u), steps);
  if(lp>0){
    var at={}, jumps=[];
    tiles.forEach(function(t){ at[R.hexKey(t.q,t.r)]=t; });
    Object.keys(SIM.map.hexes).forEach(function(k){
      var p=R.hexParse(k), d=R.hexDistance(u.pos,p);
      if(d<1 || d>lp || simUnitAt(p.q,p.r)) return;
      var have=at[k];
      if(have){ if(d<have.cost){ have.cost=d; have.leap=true; } return; }
      jumps.push({q:p.q, r:p.r, cost:d, leap:true});
    });
    jumps.sort(function(a,b){ return a.cost-b.cost || a.q-b.q || a.r-b.r; });
    tiles=tiles.concat(jumps);
  }
  return tiles;
}
function simCoverScore(t){
  var s=0;
  R.hexNeighbours(t.q,t.r).forEach(function(n){ s+=SIM_COVER[simKindAt(n.q,n.r)]||0; });
  return s;
}
/* Where a Lunge would end: a tile beside the target, with no wall between,
   that the attacker can walk to: one with no hazard on it if there is one,
   then the shortest way, then the most Cover around it, then the lowest
   tile. Where it stands, if that will do. */
function simLungeSpot(u, a, f){
  var n=simLungeOf(a);
  if(!n || !u.pos || !f.pos || R.effective(u).cannotMove) return null;
  var wall=simWallFor(null);
  var tiles=[{q:u.pos.q, r:u.pos.r, cost:0}].concat(R.reachable(u.pos, n, {
    wall:simWallFor(u),
    passable:function(n){ return !!SIM.map.hexes[R.hexKey(n.q,n.r)]; },
    blocked:function(p){ return !!simUnitAt(p.q,p.r); }
  }));
  var best=null;
  tiles.forEach(function(t){
    if(R.hexDistance(t,f.pos)!==1 || wall(t,f.pos)) return;
    var cv=simCoverScore(t), hz=simHazardAt(t.q,t.r)?1:0;
    if(!best || hz<best.hz || (hz===best.hz && (t.cost<best.cost || (t.cost===best.cost && (cv>best.cv || (cv===best.cv && (t.q<best.q || (t.q===best.q && t.r<best.r))))))))
      best={q:t.q, r:t.r, cost:t.cost, cv:cv, hz:hz};
  });
  return best;
}
/* Makes the Lunge, if the Action has one and the target isn't beside it
   already. False if the attacker went down on the way (a hazard, a held shot). */
function simDoLunge(u, a, f){
  if(!simLungeOf(a) || !u.pos || !f.pos) return true;
  if(R.hexDistance(u.pos,f.pos)===1 && !simWallFor(null)(u.pos,f.pos)) return true;
  var spot=simLungeSpot(u,a,f);
  if(!spot) return true;
  u.pos={q:spot.q, r:spot.r};
  u.travel=(u.travel||0)+spot.cost;
  simLogEnemy(u.name+" lunges "+spot.cost+" tile"+(spot.cost===1?"":"s")+" at "+f.name);
  simHazardHit(u, "lunges onto");
  simEmit("moves", u);
  if(u.side==="enemy") simReactTo(u);
  simCheckDowns();
  if(u.side==="ally" && !u.down) simFindLoot(u);
  return !u.down;
}
/* The Action as it lands: Charge adds its damage once the Unit has moved 3
   tiles this turn (extra: tiles a Lunge would add first). */
function simCharged(u, a, extra){
  var c=simChargeOf(a);
  if(!c || ((u.travel||0)+(extra||0))<3) return a;
  var b=Object.assign({}, a);
  b.dmg=String(R.actionEffect(a).damage+c); b._charge=c;
  return b;
}
/* An Enemy's Dash: at once, away from the Unit it attacked (or from your
   nearest, with none). What happened, in words. */
function simDashAway(u, from, n){
  var foes=SIM.units.filter(function(x){ return x.side!==u.side && !x.down && x.pos; });
  var away=(from && from.pos && !from.down) ? [from] : foes;
  if(!away.length || !u.pos || R.effective(u).cannotMove) return u.name+" cannot Dash";
  var far=function(p){ return Math.min.apply(null, away.map(function(a){ return R.hexDistance(p,a.pos); })); };
  var here=far(u.pos), best=null;
  simReach(u, n).forEach(function(t){
    var d=far(t);
    if(!best || d>best.d || (d===best.d && t.cost<best.cost)) best={q:t.q, r:t.r, d:d, cost:t.cost};
  });
  if(!best || best.d<=here) return u.name+" has nowhere to Dash";
  u.pos={q:best.q, r:best.r};
  u.travel=(u.travel||0)+best.cost;
  simHazardHit(u, "dashes onto");
  simEmit("moves", u);
  if(u.side==="enemy") simReactTo(u);
  return u.name+" Dashes "+best.cost+" tile"+(best.cost===1?"":"s")+" away";
}
/* ---- reactions ----------------------------------------------------------
   Handbook 15.2. A Unit whose card grants Suppressive Fire may hold fire
   instead of attacking, if it has not moved this turn. It pays the Action's
   Energy as it holds, then shoots the first Enemy that moves within range and
   line of sight during the Enemy turn. The Enemy takes the shot and carries
   on; the hold lapses at the end of the Enemy turn either way. */
function simHoldable(u){
  var K=window.KETER_KW;
  if(!K || !u || u.down || (u.moved||0)>0) return [];
  return (u.actions||[]).filter(function(a){
    if(a.tag==="Passive"||a.tag==="Aura"||!a.text) return false;
    if(!R.canAfford(u,a) || !simAetherOK(u,a)) return false;
    return K.parse(a.text).some(function(p){ return p.type==="kw" && p.kw && p.kw.name==="Suppressive Fire"; });
  });
}
function simHoldFire(u, actionName){
  var a=simHoldable(u).filter(function(x){ return x.name===actionName; })[0];
  if(!a){ simSay(u.name+" cannot hold fire now."); return; }
  simPhaseSnapshot();
  if(a.aetherX) simActionSetX(a, 1);      /* a held shot is made at X = 1 */
  u.nrg=Math.max(0,u.nrg-(parseInt(a.cost,10)||0));
  simPayAether(u,a);
  u.holding={name:a.name, action:a};
  /* v13.5: logged outright. Said through simSay, two Units of one name that
     held fire one after the other were one line in the log, not two. */
  var held=u.name+" holds fire with "+a.name+".";
  SIM.log.push({t:Date.now(), text:held}); SIM.notice=held;
  simSelect(null); simSave(); renderSim();
}
function simReactTo(enemy){
  if(!enemy||!enemy.pos||enemy.down) return;
  SIM.units.forEach(function(h){
    if(!h.holding || h.down || !h.pos || h.side===enemy.side) return;
    if(R.effective(h).cannotAct) return;     /* v13.4: Stunned since it took aim, it can't take the shot */
    var a=h.holding.action;
    if(!simCanReach(h,a,enemy,true)) return;
    h.holding=null;
    for(var shot=0; shot<simBurstOf(a) && !enemy.down && simCanReach(h,a,enemy,true); shot++){
    var d=R.hexDistance(h.pos,enemy.pos);
    var res=R.resolveAttack(h,a,enemy,{dice:simDice(), distance:d, reaction:true,
      cover:simCoverFor(enemy,h)});
    simFxHold(enemy);
    simEmit("attacks", h, enemy); simEmit("is attacked", enemy, h);
    var prevDealer=SIM_EV.dealer; SIM_EV.dealer=h;
    var line=h.name+" reacts with "+a.name+" as "+enemy.name+" moves: ";
    if(res.damage){ R.hit(enemy,res.damage,true); line+=res.damage+" damage"+(enemy.down?" \u2014 "+enemy.name+" is down":""); }
    else if(res.hit===false) line+="missed";
    else if(res.penetrated===false) line+="hit but did not Penetrate";
    else line+="no effect";
    SIM.log.push({t:Date.now(), text:line, rolls:res.rolls});
    if(a.text && res.hit!==false && res.penetrated!==false)
      simRunText(a.text,{actor:h, target:enemy, damaged:(res.damage||0)>0, killed:!!enemy.down,
        damage:res.damage||0, sourceCard:a.name});
    SIM_EV.dealer=prevDealer;
    (function(ht){ simShot(h, enemy, a, function(){ simFxRelease(enemy, ht); }); })(simHitText(res));
    }
  });
  simCheckDowns();
}
function simLapseHolds(){

/* A Unit's pixel-art token: the picture its card points at. Numbered copies
   ("Test Grunt 2") share their card's token. */
var SIM_TOKENS={};
function simTokenFor(u){

/* ===========================================================================
   The dock: the bottom of the board, where your hand and a Unit's actions take
   turns. Cards are the real card faces, fanned and overlapping as in Slay the
   Spire; tap one to raise it, tap it again to use it, then tap its target if it
   needs one. Selecting a Unit swaps the hand for that Unit's action bar, in the
   manner of Age of Wonders: pick the Action first, and every target it can
   reach lights up with its odds.
   =========================================================================== */
var SIM_UI={handOpen:true, raised:null, lastDock:null};
var SIM_ART={}, SIM_ART_PENDING={};

function simCardArt(card){
  var key=card.name;
  if(SIM_ART[key]) return SIM_ART[key];
  if(!SIM_ART_PENDING[key] && typeof makeThumb==="function"){
    SIM_ART_PENDING[key]=true;
    /* The hand holds the Simulator's own copy of a card, which does not carry
       its type, so the renderer drew every one as a Hero. Render the library
       card of the same name instead. */
    var lib=simAllCards().filter(function(c){ return c.name===card.name; })[0]||card;
    makeThumb(lib,80).then(function(url){
      if(!url) return;
      SIM_ART[key]=url;
      /* Slot the face into the cards already showing rather than rebuilding the
         dock: a rebuild mid-tap swaps the card out from under the finger, and
         the tap is lost. */
      [].slice.call(document.querySelectorAll('#simdock [data-fan]')).forEach(function(el){
        if(el.getAttribute("data-name")!==key) return;
        var ph=el.querySelector(".cardph");
        if(ph){ var img=document.createElement("img"); img.src=url; img.alt=""; img.draggable=false; ph.replaceWith(img); }
      });
      SIM_UI.lastDock=null;
    });
  }
  return null;
}
function simSelUnit(){
  return SIM.selected ? SIM.units.filter(function(u){ return u.id===SIM.selected; })[0]||null : null;
}
function simDockMode(){
  var u=simSelUnit();
  if(u && u.side==="ally" && !u.down && simCanAct()) return "actions";
  return "hand";
}
function simWhyNot(card){
  if(!simCanAct()) return "Only on your turn";
  return "Needs "+simCostLabel(card)+" \u2014 you have "+simAetherLabel(SIM.aether||{});
}
function simHandFanHTML(){
  if(!SIM.hand.length) return '<div class="dockempty">No cards in hand.</div>';
  var n=SIM.hand.length, spread=Math.min(12, 44/n), mid=(n-1)/2;
  /* Fit the fan to the width actually there. Tilting the outer cards swings
     them outward, so that allowance comes off first; sized by an estimate
     instead, the end cards hung off both edges of a phone screen. */
  var host=$("simboard"), W=((host&&host.clientWidth)||window.innerWidth)-16;
  var CW=96, maxRot=mid*spread*0.35, swing=Math.ceil(134*1.2*Math.sin(maxRot*Math.PI/180)+CW*0.5*(1-Math.cos(maxRot*Math.PI/180)))+6;
  var room=W-2*swing, overlap=n>1?Math.max(0,(n*CW-room)/(n-1)):0;
  return '<div class="fan" style="--n:'+n+'">'+SIM.hand.map(function(card,i){
    var art=simCardArt(card), can=simCanPlay(card), up=SIM_UI.raised===i;
    var off=i-mid, rot=up?0:off*spread*0.35, lift=up?0:Math.min(14,Math.abs(off)*Math.abs(off)*1.3);
    var face = art ? '<img src="'+art+'" alt="" draggable="false">'
      : '<div class="cardph"><b>'+esc(card.name)+"</b><i>"+esc(card.type||"")+"</i>"+
        "<span>"+esc(simCostLabel(card))+"</span></div>";
    return '<div class="fcard'+(up?" up":"")+(can?"":" off")+'" data-fan="'+i+'" data-name="'+esc(card.name)+'" style="'+
      "--i:"+i+";--rot:"+rot.toFixed(1)+"deg;--lift:"+lift.toFixed(1)+"px;"+
      (i?"margin-left:"+(-overlap).toFixed(1)+"px;":"")+
      'z-index:'+(up?50:10+i)+';">'+face+
      (up ? '<div class="fcue">'+(can?"Tap again to play":esc(simWhyNot(card)))+"</div>" : "")+
      "</div>";
  }).join("")+"</div>";
}

/* ---- the action bar ---- */
/* Revision 16.2: a Support Action whose only Target is "this Unit" needs no
   one to aim at: it is used at once, on the Unit using it. */
function simSelfOnly(a){
  var K=window.KETER_KW;
  if(!K || !a || !a.text || String(a.role||"").toLowerCase()!=="support") return false;
  var mine=false, other=false;
  K.sentences(a.text).forEach(function(sent){
    K.analyse(sent).targets.forEach(function(t){ if(t.part.kw.name==="this Unit") mine=true; else other=true; });
  });
  return mine && !other;
}
function simUseOnSelf(u, a){
  simSnapshot("the action");
  u.nrg=Math.max(0, u.nrg-(parseInt(a.cost,10)||0));
  simPayAether(u, a);
  u.acted=true;
  SIM.log.push({t:Date.now(), text:u.name+" used "+a.name});
  simRunText(a.text, {actor:u, target:u, sourceCard:a.name});
  SIM.pendingAct=null; SIM.odds=null; SIM.targets=null;
  simCheckDowns();
  simSave(); renderSim();
}
/* 14.12: an Action that says "target tile" is aimed at a tile: any tile within
   its range (1 for one that has none) that the Unit can see, its own included.
   Its text is carried out there, with no attack roll, as a card's would be. */
function simTileAction(a){
  var K=window.KETER_KW;
  if(!K || !a || !a.text) return false;
  return K.sentences(a.text).some(function(sent){
    var an=K.analyse(sent); if(an.when) return false;
    return an.targets.some(function(t){ return t.part.kw.name==="target tile"; });
  });
}
function simTileReach(u,a){
  var out={}, rng=(parseInt(a.rng,10)||1)+(R.effective(u).range||0);
  if(!u.pos) return out;
  Object.keys(SIM.map.hexes).forEach(function(key){
    var q=+key.split(",")[0], r=+key.split(",")[1], t={q:q,r:r};
    if(R.hexDistance(u.pos,t)<=rng && simSees(u.pos,t)) out[key]="tile";
  });
  return out;
}
function simUseOnTile(u, a, cell){
  simSnapshot("the action");
  u.nrg=Math.max(0, u.nrg-(parseInt(a.cost,10)||0));
  simPayAether(u, a);
  u.acted=true;
  SIM.log.push({t:Date.now(), text:u.name+" used "+a.name+" at "+cell.q+","+cell.r});
  simRunText(a.text, {actor:u, tile:{q:cell.q, r:cell.r}, target:null, sourceCard:a.name});
  SIM.pendingAct=null; SIM.odds=null; SIM.targets=null;
  simCheckDowns();
  simSave(); simDraw(); renderSim();
}
function simActionState(u,a){
  var eff=R.effective(u);
  if(eff.cannotAct) return {ok:false, why:"Stunned"};
  if(!R.canAfford(u,a)) return {ok:false, why:"Needs "+(parseInt(a.cost,10)||0)+" NRG"};
  if(!simAetherOK(u,a)) return {ok:false, why:"Needs "+simAetherWords(a.aether)+" Aether"};
  if(simSelfOnly(a)) return {ok:true};
  if(simTileAction(a)) return Object.keys(simTileReach(u,a)).length ? {ok:true} : {ok:false, why:"No tile in reach"};
  var role=String(a.role||"").toLowerCase();
  var pool=SIM.units.filter(function(f){
    return !f.down && f.pos && (role==="support" ? (f.side===u.side && f!==u) : f.side!==u.side); });
  if(pool.some(function(f){ return simCanReach(u,a,f); })) return {ok:true};
  var blind=pool.some(function(f){
    return simAimed(role) && R.hexDistance(u.pos,f.pos)<=(parseInt(a.rng,10)||1) && !simSees(u.pos,f.pos); });
  return {ok:false, why: blind?"No line of sight":"Nothing in reach"};
}
/* v13.3: the Aether a carried Action card costs to use, on top of its Energy */
function simAetherOK(u,a){
  return !(a && a.aether && u && u.side==="ally") || R.aetherCanPay(SIM.aether||{}, a.aether);
}
/* v13.4: what a carried Action costs at the X it is being used for */
function simActionAether(a){
  if(!a || !a.aether) return null;
  return a.aetherX ? simCardCost({cost:a.aetherX, district:a.aether.district}, a.x||1) : a.aether;
}
function simActionSetX(a, n){
  var K=window.KETER_KW;
  a.x=Math.max(1,parseInt(n,10)||1);
  if(K && K.fillX && a.textX) a.text=K.fillX(a.textX, a.x);
}
/* as it prints on the Action's button: X where the card says X */
function simActionAetherWords(a){
  return simAetherWords(a.aetherX ? {generic:a.aetherX.generic, affinity:a.aetherX.affinity, district:a.aether.district} : a.aether);
}
function simAetherWords(c){
  var parts=[];
  if(c && c.affinity) parts.push(c.affinity+(c.district?" D"+c.district:""));
  if(c && c.generic) parts.push(c.generic+"\u25c7");

}
function simPayAether(u,a){
  var c=simActionAether(a);

}
function simActionBarHTML(u){

function simDockHTML(){

function simRenderDock(){

/* ---- odds, for the action bar's targets: to hit, times to penetrate ---- */
function simOdds(u,a,f){
  var role=String(a.role||"").toLowerCase(), eff=R.effective(f), mine=R.effective(u);
  var pHit=1;
  if(simAimed(role) && !eff.alwaysHit){
    var need=(parseInt(a.hit,10)||0)+(simCoverFor(f,u)||0)+(eff.evasion||0)-(mine.aim||0);   /* Revision 16.3: Aim */
    pHit=Math.max(0,Math.min(1,(21-need)/20));
  }
  if(!simAimed(role) && eff.flying) pHit=0;
  var ac=role==="cyber"?eff.integrity:eff.ac, ap=(parseInt(a.pen,10)||0)+(mine.ap||0);
  var pPen=role==="support"?1:Math.max(0,Math.min(1,(21-(ac-ap))/20));
  /* Revision 16.1: Charge's damage, once it would apply (after any Lunge) */
  var lsp=simLungeOf(a)?simLungeSpot(u,a,f):null;
  var ca=simCharged(u, a, lsp?lsp.cost:0);
  var dmg=Math.max(0,Math.floor((parseInt(ca.dmg,10)||0)*mine.dmgMult)+(mine.dmgFlat||0));
  if(R.hardenedCut && role!=="support") dmg=R.hardenedCut(f, dmg);   /* 14.12: what a Hardened target would really take */
  return {p:pHit*pPen, dmg:dmg};
}
function simBeginPick(label, pool, done){
  var valid={};
  pool.forEach(function(u){ if(u.pos) valid[R.hexKey(u.pos.q,u.pos.r)]=u.id; });
  SIM.pick={label:label, valid:valid, done:function(t){ SIM_UI.raised=null; SIM.targets=null; done(t); }};
  SIM.selected=null; SIM.reach=[]; SIM.targets=valid;
  simSay("Tap a lit Unit for "+label+".");
  simDraw(); renderSim();
}
function simPickAction(u,name){
  if(simBurstLive()){ simSay("Finish the Burst first \u2014 choose its next target."); return; }
  var a=(u.actions||[]).filter(function(x){ return x.name===name; })[0];
  if(!a) return;
  var st=simActionState(u,a);
  if(!st.ok){ simSay(a.name+": "+st.why+"."); return; }
  if(SIM.pendingAct && SIM.pendingAct.name===name){
    SIM.pendingAct=null; SIM.odds=null; simMarkTargets(u); simDraw(); renderSim(); return;
  }
  /* v13.4: a carried Action card with a variable cost asks for X each time */
  if(a.aetherX && u.side==="ally" && !a._xAsked){
    var xc={cost:a.aetherX, district:a.aether.district};
    simAskX(a.name, simMaxX(xc), function(n){ return simAetherWords(simCardCost(xc,n)); }, function(n){
      simActionSetX(a, n);
      a._xAsked=true;
      try{ simPickAction(u,name); } finally { delete a._xAsked; }
    });
    return;
  }
  /* Revision 16.2: on itself, at once */
  if(simSelfOnly(a)){ simUseOnSelf(u, a); return; }
  /* 14.12: aimed at a tile */
  if(simTileAction(a)){
    SIM.pendingAct={unit:u.id, name:name, tile:true};
    SIM.targets=simTileReach(u,a); SIM.odds=null;
    simSay("Tap a lit tile for "+a.name+".");
    simDraw(); renderSim(); return;
  }
  var role=String(a.role||"").toLowerCase();
  var narrow=simActionNarrow(a);
  var pool=SIM.units.filter(function(f){
    return !f.down && f.pos && (role==="support" ? (f.side===u.side && f!==u) : f.side!==u.side) &&
      simNarrowOK(f, narrow, {actor:u}); });
  var tg={}, odds={};
  pool.forEach(function(f){
    if(!simCanReach(u,a,f)) return;
    var k=R.hexKey(f.pos.q,f.pos.r); tg[k]=f.id; odds[k]=simOdds(u,a,f);
  });
  SIM.pendingAct={unit:u.id, name:name};
  SIM.targets=tg; SIM.odds=odds;
  simDraw(); renderSim();
}
/* Revision 15.6: an Action written "target Sniper enemy" can only be aimed at one */
function simActionNarrow(a){
  var K=window.KETER_KW, out=[];
  if(!K || !K.analyse || !a || !a.text) return out;
  K.sentences(a.text).some(function(sent){
    var an=K.analyse(sent); if(an.check || an.when) return false;
    var t=an.targets.filter(function(t){ return /^target (enemy|ally)$/.test(t.part.kw.name); })[0];
    if(t){ out=t.narrow; return true; } return false;
  });
  return out;
}
function simDrawOdds(x,size,list){
  list.forEach(function(it){
    var c=simCentre(it.u.pos.q,it.u.pos.r,size), cx=c.x+SIM_VIEW.ox, cy=c.y+SIM_VIEW.oy-size*0.95;
    var txt=Math.round(it.o.p*100)+"% \u00b7 "+it.o.dmg;
    x.font="600 "+Math.max(10,Math.round(size*0.34))+"px ui-monospace, monospace";
    var w=x.measureText(txt).width+10, h=Math.max(15,size*0.46);
    x.fillStyle="rgba(8,14,18,.92)"; x.strokeStyle=it.o.p>=0.66?"#7bd88f":(it.o.p>=0.33?"#e0b34d":"#e0684d");
    x.lineWidth=1.2; x.beginPath(); x.rect(cx-w/2,cy-h/2,w,h); x.fill(); x.stroke();
    x.fillStyle=x.strokeStyle; x.textAlign="center"; x.textBaseline="middle"; x.fillText(txt,cx,cy+0.5);
  });
}

/* ===========================================================================
   Debug mode. Test cards and test floors exist to check that the Simulator does
   what the Handbook says; this mode gathers them into a ready Strike Team,
   limits the Enemies to the test ones, and adds the tools and the checklist
   that make checking quick. It is a setting, off by default, and a debug fight
   is marked as one throughout.
   =========================================================================== */
var SIM_DEBUG_KEY="keter-app-simdebug", SIM_CHECK_KEY="keter-app-testcheck";
var SIM_FORCE=[];                         /* results queued for the next rolls */
var SIM_DBG={move:false, place:null};
function simDebugOn(){ try{ return localStorage.getItem(SIM_DEBUG_KEY)==="1"; }catch(e){ return false; } }
function simSetDebug(v){ try{ localStorage.setItem(SIM_DEBUG_KEY, v?"1":"0"); }catch(e){} }
function simIsTest(c){ return !!(c && (c.testCard || (c._raw && c._raw.testCard))); }
/* Enemies, Elites and Mini-Bosses a fight may draw: only the test ones in debug */
function simFoeCards(){
  var all=simAllCards();
  return simDebugOn() ? all.filter(simIsTest) : all;
}
function simTestCards(){ return simAllCards().filter(simIsTest); }
/* The Strike Team debug mode offers, built from the test cards each time so it
   always matches them. It is never saved among your own Strike Teams. */
function simTestTeam(){
  var t=simTestCards(), ref=function(c){ return "master|"+c.name; };
  var of=function(type){ return t.filter(function(c){ return c.cardType===type; }); };
  var heroes=of("hero");

    of(type).forEach(function(c){ deck.push(ref(c)); deck.push(ref(c)); });
  });

  var pouch={"basic|3":4};
  of("sphere").forEach(function(c){ pouch[ref(c)]=2; });
  return {v:2, name:"Test Strike Team", level:3, heroes:heroes.map(ref), deck:deck,
          actions:acts, pouch:pouch, isTestTeam:true,
          prototypes:of("prototype").map(ref), consumables:of("consumable").map(ref)};
}
function simTestFloors(){
  var all={};
  try{ all=JSON.parse(localStorage.getItem("keter-hexmap-levels")||"{}")||{}; }catch(e){}
  return Object.keys(all).filter(function(k){ return all[k] && all[k].testMap; });
}

/* ---- the quick start: straight into a fight on a test floor ---- */
function simDebugQuick(){
  var floors=simTestFloors();
  if(!floors.length){ simSay("No test floors in the library yet."); return; }
  say("Debug combat",
