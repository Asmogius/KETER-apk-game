<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>KETER — Companion</title>
<style>
:root{
  --bg:#080b10; --panel:#0f161d; --panel-2:#0b1116;
  --line:#1d2b34; --line-hot:#2c4854;
  --cyan:#57d8e3; --text:#dde8ec; --dim:#7a8d97; --danger:#e05a4d;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --disp:"Trebuchet MS","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --nav:56px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overscroll-behavior:none;}
/* Safari's toolbars are not counted by height:100%, which buries the bottom nav.
   -webkit-fill-available fixes older iOS; dvh fixes 15.4 and up. */
body{height:-webkit-fill-available;}
@supports (height:100dvh){ html,body{height:100dvh;} }
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;
  overflow:hidden;-webkit-text-size-adjust:100%;}
button{font-family:inherit;color:inherit;touch-action:manipulation;}

#shell{display:flex;flex-direction:column;height:100%;
  padding-top:env(safe-area-inset-top);}

/* ---------- header ---------- */
#bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:linear-gradient(180deg,#0d151c,#080b10);
  border-bottom:1px solid var(--line);}
#bar .hex{color:var(--cyan);font-size:15px;}
#bar h1{margin:0;font-family:var(--disp);font-size:14px;letter-spacing:2.4px;
  text-transform:uppercase;color:var(--cyan);font-weight:600;}
#bar .sub{font-size:10px;color:var(--dim);letter-spacing:1px;}
#bar .sp{flex:1;}
/* Buttons were dim text on a near-black fill with a near-black border — three
   low-contrast choices stacked, so they read as labels rather than controls.
   The surface now lifts a step, the border is thin but visible, and the text
   is full strength. */
/* Buttons size to their text rather than clipping it: a cut-off label reads
   as a rendering fault. */
.pgrow{display:flex;align-items:center;gap:8px;}
  .pgsp{flex:1;}
  .pghelp{flex:0 0 auto;width:34px;height:30px;padding:0;text-align:center;
    font-family:var(--mono);font-size:15px;font-weight:700;line-height:1;}
  .pghelp.helping{background:rgba(87,216,227,.22);color:var(--cyan);
    border-color:var(--cyan);}
  #cbround{display:flex;align-items:center;gap:10px;}
/* The app bar only appears on Home, so help lives on the page itself \u2014 it
     has to be reachable from whatever it is meant to label. */
  #helpBtn{position:fixed;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));
    z-index:180;width:38px;height:38px;border-radius:19px;
    background:#182530;border:1px solid #33505e;color:var(--dim);
    font-size:16px;line-height:1;cursor:pointer;display:none;}
  #helpBtn.on{display:block;}
  #helpBtn.helping{border-color:var(--cyan);color:var(--cyan);}
  .ghost{background:#182530;border:1px solid #33505e;border-radius:4px;
  color:var(--text);font-size:11.5px;letter-spacing:.8px;padding:8px 11px;
  cursor:pointer;flex:0 0 auto;overflow:visible;
  /* wrap rather than clip: a cut-off label reads as a rendering fault */
  white-space:normal;word-break:keep-all;line-height:1.35;}
.ghost:hover{background:#1e2f3c;border-color:#43687a;}
.ghost:active{background:rgba(87,216,227,.22);border-color:var(--cyan);color:var(--cyan);}
.ghost[disabled]{opacity:.4;}

/* ---------- views ---------- */
#views{flex:1;position:relative;min-height:0;}
.view{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;display:none;overflow:auto;
  -webkit-overflow-scrolling:touch;}
.view.on{display:block;}
.view.frame{overflow:hidden;}
iframe{width:100%;height:100%;border:0;display:block;background:var(--bg);}

/* ---------- home ---------- */
#v-home{padding:18px 14px 26px;}
.brand{font-family:var(--disp);font-size:30px;letter-spacing:7px;color:var(--cyan);
  text-transform:uppercase;margin:8px 0 2px;}
.tag{color:var(--dim);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  margin-bottom:20px;}
#launcher{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px;}
.lt{background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:12px 11px;text-align:left;cursor:pointer;color:var(--text);
  display:flex;flex-direction:column;gap:5px;min-height:96px;}
.lt:active{border-color:var(--cyan);background:var(--panel-2);}
.lt .g{font-size:19px;line-height:1;color:var(--cyan);}
.lt b{font-family:var(--disp);font-size:12.5px;letter-spacing:.9px;
  text-transform:uppercase;}
.lt span{font-size:10.5px;color:var(--dim);line-height:1.45;}
.lt.wip{border-style:dashed;}
.lt.wip b{color:var(--dim);}
.lt.wip:after{content:"Not built yet";font-size:9px;letter-spacing:1px;
  text-transform:uppercase;color:#e0b34d;}
@media (min-width:600px){ #launcher{grid-template-columns:repeat(3,1fr);} }
.tile{display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:2px solid var(--cyan);border-radius:4px;
  padding:14px;margin-bottom:11px;cursor:pointer;}
.tile:active{border-color:var(--cyan);background:var(--panel-2);}
.tile b{display:block;font-family:var(--disp);font-size:15px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--text);margin-bottom:5px;}
.tile span{display:block;font-size:11.5px;color:var(--dim);line-height:1.55;}
.note{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
  padding:12px;margin-top:16px;font-size:11.5px;color:var(--dim);line-height:1.65;}
.note b{color:var(--danger);}
.note.ok{border-color:var(--line-hot);} .note.ok b{color:var(--cyan);}
.note .row{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;}
.note .row:last-child{margin-bottom:0;}
.note .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:5px;
  background:var(--dim);}
.note .dot.g{background:var(--cyan);} .note .dot.r{background:var(--danger);}
.note .dot.y{background:#e0b34d;}
.snap{display:flex;gap:8px;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);padding:9px 0;}
.snap span{font-size:11.5px;color:var(--dim);}
.snap button{background:#182530;border:1px solid #33505e;border-radius:3px;
  color:var(--cyan);font-size:11px;padding:6px 10px;cursor:pointer;font-family:var(--mono);}
.rowbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.rowbtns .ghost{flex:1;min-width:120px;text-align:center;}
#userBtn.set{color:var(--cyan);border-color:var(--line-hot);}
#updBtn.has{border-color:var(--cyan);color:var(--cyan);}
#updBtn.has:after{content:" \25CF";color:var(--cyan);}
#devBtn.on{color:#e0b34d;border-color:#6a5324;}
#devflag{display:none;margin-top:12px;padding:9px 11px;border:1px solid #6a5324;
  border-radius:4px;background:#161008;color:#e0b34d;font-size:11px;line-height:1.6;}
#devflag.on{display:block;}
#fixflag{display:none;margin-top:10px;padding:10px 12px;border-radius:4px;
  background:#1a1208;border:1px solid #6a5324;color:#e0b34d;font-size:11.5px;
  line-height:1.6;}
#fixflag.on{display:block;}
.ver{margin-top:20px;font-size:10.5px;color:var(--dim);line-height:1.9;
  border-top:1px solid var(--line);padding-top:12px;}

/* ---------- manual ---------- */
#v-manual{display:none;}
#v-manual.on{display:flex;flex-direction:column;overflow:hidden;}
#mtop{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 10px;display:flex;gap:7px;align-items:center;}
/* The blanket reset was for the iOS zoom fix, but it also flattens checkboxes
     to invisible zero-width boxes — which is why the review list looked as
     though it had nothing to tick. */
  input:not([type=checkbox]):not([type=radio]),textarea,select{
    -webkit-appearance:none;appearance:none;border-radius:3px;}
  input[type=checkbox],input[type=radio]{
    -webkit-appearance:checkbox;appearance:checkbox;
    width:18px;height:18px;accent-color:var(--cyan);flex:0 0 auto;cursor:pointer;}
  input[type=radio]{-webkit-appearance:radio;appearance:radio;}
input[type=search]::-webkit-search-decoration,
input[type=search]::-webkit-search-cancel-button,
input[type=search]::-webkit-search-results-button{-webkit-appearance:none;}
#mtop select,#mtop input{background:#141f28;border:1px solid #33505e;
  color:var(--text);border-radius:3px;padding:8px;font-family:var(--mono);
  font-size:16px;min-width:0;}
#mtop select{flex:0 1 auto;max-width:36%;}
#mtop #tocBtn{flex:0 0 auto;}
#mtop input{flex:1;}
#mstage{flex:1;position:relative;min-height:0;display:flex;}
#mbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 15px 60px;
  font-family:var(--disp);line-height:1.68;font-size:15px;}
#mbody h1{font-size:20px;letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan);
  border-bottom:1px solid var(--line);padding-bottom:7px;margin:26px 0 12px;}
#mbody h2{font-size:16px;letter-spacing:1px;color:var(--text);margin:22px 0 8px;}
#mbody h3{font-size:14px;letter-spacing:.6px;color:var(--dim);text-transform:uppercase;
  margin:18px 0 6px;}
#mbody p{margin:0 0 11px;}
#mbody ul,#mbody ol{padding-left:20px;margin:0 0 12px;}
#mbody li{margin-bottom:5px;}
#mbody table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px;
  font-family:var(--mono);display:block;overflow-x:auto;}
#mbody th,#mbody td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
#mbody th{background:var(--panel);color:var(--cyan);}
#mbody code{font-family:var(--mono);background:var(--panel-2);padding:1px 4px;
  border-radius:2px;font-size:12.5px;}
#mbody blockquote{border-left:2px solid var(--cyan);margin:0 0 12px;padding-left:12px;
  color:var(--dim);}
#mbody .pending{border:1px solid var(--danger);border-radius:4px;padding:12px;
  color:var(--dim);}
#mbody mark{background:rgba(87,216,227,.25);color:var(--text);}
#mbody img{max-width:100%;height:auto;}
#toc{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:var(--bg);z-index:30;display:none;
  overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 0 60px;}
#toc.on{display:block;}
#toc a{display:block;padding:11px 16px;border-bottom:1px solid var(--line);
  color:var(--text);text-decoration:none;font-size:13.5px;}
#toc a.l2{padding-left:30px;color:var(--dim);font-size:12.5px;}
#toc a.l3{padding-left:46px;color:var(--dim);font-size:12px;}
#toc a:active{background:var(--panel);color:var(--cyan);}
#toc .empty{padding:20px 16px;color:var(--dim);font-size:12px;}

/* ---------- compendium ---------- */
/* ---------- glossary ---------- */
#v-battle{display:none;}
#v-battle.on{display:flex;flex-direction:column;overflow:hidden;}
#simtop{flex:0 0 auto;padding:9px 10px;background:var(--panel);
  border-bottom:1px solid var(--line);}
  #simphases{display:flex;flex-wrap:wrap;align-items:center;gap:2px;
    padding:5px 10px 6px;font-family:var(--disp);font-size:9.5px;
    letter-spacing:.6px;text-transform:uppercase;}
  .simph{padding:2px 5px;border-radius:3px;color:var(--dim);opacity:.55;}
  .simph.done{opacity:.75;}
  .simph.on{background:rgba(87,216,227,.16);border:1px solid var(--cyan);
    color:var(--cyan);opacity:1;}
  .simpharrow{color:var(--line);font-size:9px;}
#simstate{font-family:var(--disp);font-size:13px;letter-spacing:1px;
  text-transform:uppercase;color:var(--cyan);margin-bottom:5px;}
#simticker{display:none;font-size:11.5px;color:var(--text);line-height:1.4;
  padding:5px 8px;margin-bottom:7px;border-left:2px solid var(--line-hot);
  background:#131e27;border-radius:0 3px 3px 0;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#simticker.on{display:block;}
#simticker:active{background:#1a2833;}
.simbtns{display:flex;gap:6px;}
.simbtns .ghost{flex:1;}
.simbtns #simGear{flex:0 0 46px;font-size:17px;}
#simboard{flex:1 1 auto;position:relative;overflow:hidden;background:#0a1219;}
#simpad{flex:0 0 auto;position:relative;height:215px;background:var(--panel);
  border-top:1px solid var(--line);overflow-y:auto;
  -webkit-overflow-scrolling:touch;}
#simpad.collapsed{height:18px !important;overflow:hidden;}
#simGrip{position:sticky;top:0;height:16px;cursor:ns-resize;display:flex;
  align-items:center;justify-content:center;touch-action:none;
  background:var(--panel);z-index:2;}
#simGrip i{display:block;width:44px;height:3px;border-radius:2px;
  background:var(--line-hot);opacity:.75;}
#simGrip:active i{background:var(--cyan);opacity:1;}
#simpadbody{padding:2px 10px 12px;}
#simpad.collapsed #simpadbody{display:none;}
.simrow{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);
  margin-bottom:8px;}
.simrow b{color:var(--text);}
.simpile{border:1px solid var(--line);border-radius:4px;padding:6px 9px;
  background:#131e27;min-width:74px;}
.simbank{display:flex;align-items:baseline;gap:9px;padding:6px 10px;
  border:1px solid #33505e;border-radius:4px;background:#131e27;
  margin-bottom:6px;}
.simbank .lbl{font-family:var(--disp);font-size:9.5px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--dim);}
.simbank .val{font-family:var(--mono);font-size:16px;color:var(--cyan);}
.simpiles{margin:0 0 8px;font-size:11.5px;color:var(--dim);}
/* The setup rows had no styling at all, so choosing a Hero changed nothing on
   screen and the button read as broken. */
/* "primary" was used throughout to mark the main action \u2014 and never styled,
   so it did nothing at all. */
button.ghost.primary{border-color:var(--cyan);color:var(--cyan);background:rgba(87,216,227,.10);}
/* "btn" was used on a dozen buttons and never defined, so they drew as bare
   browser buttons with no chosen state. It looks like the rest now. */
button.btn{background:#182530;border:1px solid #33505e;border-radius:4px;color:var(--text);
  font-size:11.5px;letter-spacing:.8px;padding:8px 11px;cursor:pointer;}
button.btn.primary{border-color:var(--cyan);color:var(--cyan);background:rgba(87,216,227,.10);}
/* debug mode */
.dbg{font-size:12px;}
.dbgh{margin:12px 0 5px;font-family:var(--disp);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--warn,#e0b34d);}
.dbgh span{color:var(--dim);text-transform:none;letter-spacing:0;font-family:var(--mono);margin-left:6px;}
.dbgrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;}
.dbgrow input,.dbgrow select{background:#141f28;border:1px solid #33505e;color:var(--text);border-radius:3px;
  padding:6px 7px;font-family:var(--mono);font-size:12px;max-width:100%;}
.dbgrow input[type=number]{width:70px;}
.dbgrow label{display:flex;gap:5px;align-items:center;color:var(--dim);font-size:11px;}
.dbgnote{margin:0 0 6px;color:var(--dim);font-size:11px;line-height:1.5;}
.dbgcard{border:1px solid var(--line);border-radius:4px;padding:7px 9px;margin-bottom:6px;}
.dbgcard>b{font-size:12px;}
.dbgcard>i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);}
.dbgck{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.45;margin-top:5px;color:var(--text);}
.dbgck input{margin-top:2px;flex:0 0 auto;}
.dbgck.on{color:#7bd88f;}
.dbgflag{display:inline-block;margin-left:8px;padding:1px 6px;border:1px solid var(--warn,#e0b34d);
  color:var(--warn,#e0b34d);border-radius:3px;font-size:10px;letter-spacing:1px;vertical-align:middle;}
/* A choice between two or three, like Auto and Manual: the chosen one is lit and
   ticked, the others plainly not. */
/* ---- dice ---- */
.die{width:64px;height:64px;display:inline-block;}
.die .dieface{width:100%;height:100%;display:block;}
.die .diebody{fill:#13222c;stroke:#57d8e3;stroke-width:3;}
.die .dietri{fill:none;stroke:#33505e;stroke-width:2;}
.die .dienum{fill:#e8f1f4;font:700 30px ui-monospace,monospace;}
.die .diepip{fill:#e8f1f4;}
.die.tumbling{animation-name:dieTumble;animation-timing-function:cubic-bezier(.2,.7,.3,1);animation-fill-mode:both;}
@keyframes dieTumble{0%{transform:rotate(0) translateY(-6px) scale(.92);}
  35%{transform:rotate(520deg) translateY(4px) scale(1.04);}
  70%{transform:rotate(700deg) translateY(-2px);} 100%{transform:rotate(720deg) translateY(0) scale(1);}}
.die.settled{animation:dieSettle .22s ease-out;}
@keyframes dieSettle{0%{transform:scale(1.12);}100%{transform:scale(1);}}
.die.top .diebody{stroke:#f2cf6d;filter:drop-shadow(0 0 5px rgba(242,207,109,.55));}
.die.top .dienum,.die.top .diepip{fill:#f2cf6d;}
.die.low .diebody{stroke:#b0605a;}
.dicerow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.dicepage{padding:14px 14px 90px;max-width:520px;margin:0 auto;}
.dicepage .pghead{display:flex;align-items:center;margin-bottom:12px;}
.dicepage .pghead h2{margin:0;font-family:var(--disp);letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan);font-size:17px;}
.dicecount{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0;}
.dicecount button{min-width:46px;height:42px;font-size:20px;}
.dicecount span{font-family:var(--mono);font-size:14px;color:var(--dim);min-width:90px;text-align:center;}
.dicecount b{color:var(--text);font-size:20px;}
.diceroll{width:100%;height:52px;font-size:15px;letter-spacing:2px;text-transform:uppercase;font-family:var(--disp);}
.dicetray{min-height:150px;display:flex;align-items:center;justify-content:center;padding:18px 0;}
.dicetray .die{width:72px;height:72px;}
.dicehint{color:var(--dim);font-size:12px;}
.dicetotal{text-align:center;font-family:var(--mono);color:var(--dim);font-size:13px;min-height:20px;margin:0 0 14px;}
.dicetotal b{color:var(--cyan);font-size:22px;}
.diceset{border-top:1px solid var(--line);padding-top:12px;}
.diceset label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px;}
.diceset label b{color:var(--text);font-family:var(--mono);}
.diceset input{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
  background:#1d2c38;outline:none;}
.diceset input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
  border-radius:50%;background:#57d8e3;border:3px solid #0a1218;box-shadow:0 0 0 1px #57d8e3;}
.diceset input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#57d8e3;border:3px solid #0a1218;}
/* in a fight: the top-right corner, over a dimmed board */
#simDiceLayer{position:absolute;inset:0;z-index:9;background:rgba(4,8,12,.45);pointer-events:auto;}
.simdicebox{position:absolute;top:10px;right:10px;background:rgba(10,18,24,.96);border:1px solid var(--line);
  border-radius:7px;padding:8px 10px 9px;width:136px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.6);}
.simdicebox .die{width:52px;height:52px;}
.simdicelabel{margin:0 0 6px;font-size:10.5px;line-height:1.35;color:var(--text);font-family:var(--mono);}
.simdicelabel span{display:block;color:var(--dim);}
.simdiceout{margin:7px 0 0;font-family:var(--disp);letter-spacing:1.2px;text-transform:uppercase;font-size:11.5px;min-height:15px;}
.simdiceout.ok{color:#7bd88f;} .simdiceout.no{color:#e0684d;}
/* filter toggles: lit is shown, dark is hidden */
#fchips{display:flex;flex-direction:column;gap:9px;width:100%;}
.fglabel{margin:0 0 4px;font-family:var(--disp);font-size:10px;letter-spacing:1px;
  text-transform:uppercase;color:var(--dim);}
.fglabel span{color:var(--warn,#e0b34d);text-transform:none;letter-spacing:0;font-family:var(--mono);margin-left:4px;}
.fgrow{display:flex;flex-wrap:wrap;gap:5px;}
.fchip{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:13px;
  padding:4px 10px;font-size:11.5px;text-decoration:line-through;opacity:.7;}
.fchip.on{background:rgba(87,216,227,.13);border-color:var(--cyan);color:var(--cyan);
  text-decoration:none;opacity:1;}
/* ---- Pixel Studio ---- */
.pxs{padding:14px;} .pxh{margin:0 0 4px;font-family:var(--disp);letter-spacing:1px;text-transform:uppercase;font-size:15px;color:var(--cyan);}
.pxnote{color:var(--dim);font-size:12px;line-height:1.55;margin:4px 0 10px;}
.pxsub{margin:12px 0 5px;font-family:var(--disp);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);}
.pxrow{display:flex;flex-wrap:wrap;gap:6px;}
.pxlib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.pxitem{border:1px solid var(--line);border-radius:5px;padding:8px;display:flex;flex-direction:column;gap:3px;}
.pxitem canvas{width:72px;height:72px;image-rendering:pixelated;border-radius:3px;}
.pxitem b{font-size:12px;} .pxitem i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);}
.pxitem .pxrow button{padding:5px 8px;font-size:10.5px;}
.pxpick{border:1px solid var(--line);border-radius:5px;padding:8px;margin-top:8px;}
.pxpick input{width:100%;box-sizing:border-box;background:#141f28;border:1px solid #33505e;color:var(--text);padding:8px;border-radius:3px;margin-bottom:6px;}
.pxhit{padding:8px;border-bottom:1px solid var(--line);cursor:pointer;} .pxhit b{display:block;font-size:12.5px;}
.pxhit i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);}
.pxe{display:flex;flex-direction:column;gap:6px;padding:8px;}
.pxtop{display:flex;gap:6px;align-items:center;} .pxtop input{flex:1;min-width:0;background:#141f28;border:1px solid #33505e;color:var(--text);padding:8px;border-radius:3px;}
.pxtop button{min-width:40px;font-size:15px;}
.pxmeta{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--dim);}
.pxmeta #pxStatus{margin-left:auto;color:var(--cyan);}
.pxstage{position:relative;height:52vh;min-height:240px;border:1px solid var(--line);border-radius:5px;overflow:hidden;touch-action:none;}
.pxstage canvas{display:block;touch-action:none;}
.pxstage .pxover{position:absolute;left:0;top:0;pointer-events:none;}
.pxzoom{position:absolute;right:6px;top:6px;display:flex;gap:0;background:rgba(10,18,24,.88);border:1px solid var(--line);border-radius:5px;overflow:hidden;}
.pxzoom button{border:0;border-radius:0;min-width:36px;}
/* every tool in view: they wrap rather than scroll out of sight */
.pxtools{display:flex;flex-wrap:wrap;gap:4px;}
.pxtool{flex:1 0 58px;min-width:58px;background:#101c24;border:1px solid #33505e;border-radius:5px;color:var(--text);padding:5px 6px;text-align:center;}
.pxtool span{display:block;font-size:17px;line-height:1.2;} .pxtool i{display:block;font-style:normal;font-size:9.5px;color:var(--dim);}
.pxtool.on{border-color:var(--cyan);background:rgba(87,216,227,.16);} .pxtool.on i{color:var(--cyan);}
.pxcur{display:flex;align-items:center;gap:6px;} .pxbig{width:36px;height:36px;border-radius:5px;border:2px solid #eaf2f6;flex:0 0 auto;}
.pxrecent{display:flex;gap:3px;flex:1;overflow-x:auto;}
/* ---- Chassis editor ---- */
.chs{padding:14px;} .chlist{display:flex;flex-direction:column;gap:8px;}
.chitem{border:1px solid var(--line);border-left:5px solid;border-radius:5px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;}
.chitem b{font-size:13px;} .chitem i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--dim);}
.chitem .pxrow button{padding:5px 9px;font-size:10.5px;}
.chsaved{font-family:var(--mono);font-size:10.5px;color:var(--cyan);min-width:48px;text-align:right;}
.chband{height:4px;border-radius:2px;margin:8px 0 4px;}
.chgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.chf{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--dim);font-family:var(--mono);}
.chf input,.chf select,.chnotes,.chtryrow textarea,.chtryrow select{background:#141f28;border:1px solid #33505e;color:var(--text);padding:7px;border-radius:3px;font-size:13px;min-width:0;}
.chnotes{width:100%;box-sizing:border-box;}
.chcat{margin:6px 0;} .chcathead{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:4px;}
.chcathead b{flex:1;} .chcathead button{padding:3px 9px;font-size:10px;}
.chchips{display:flex;flex-wrap:wrap;gap:4px;}
.chchip{background:#101c24;border:1px solid #2c3f4a;color:var(--dim);border-radius:12px;padding:4px 9px;font-size:11px;}
.chchip.on{background:rgba(255,255,255,.05);font-weight:600;}
.chtryrow{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;} .chtryrow textarea{flex:1;font-family:var(--mono);font-size:12px;}
.chresult{border:1px solid var(--line);border-radius:5px;padding:9px;margin-top:6px;}
.chbar{height:6px;background:#141f28;border-radius:3px;overflow:hidden;margin-bottom:8px;} .chbar div{height:100%;}
.chrow{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:2px 0;} .chrow span{color:var(--dim);min-width:74px;}
.chrow i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--dim);}
.chok{color:#6dff3a;font-size:12.5px;margin:8px 0 0;} .chbad{color:var(--danger,#ff4a52);font-size:12.5px;margin:8px 0 0;}
.pxexp{font-size:9.5px;letter-spacing:.8px;color:var(--warn,#e0b34d);border:1px solid var(--warn,#e0b34d);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
.pxopts{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.pxopts button{padding:6px 9px;font-size:11px;} .pxopts button[disabled]{opacity:.4;}
.pxseg{margin:0;max-width:100%;} .pxseg button{padding:6px 10px;font-size:11px;}
.pxhint{font-size:11px;color:var(--dim);}
.pxbig.tgt{box-shadow:0 0 0 2px #22f0ff;} .pxbig2{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;
  background-image:repeating-conic-gradient(#1c252c 0% 25%,#232e36 0% 50%);background-size:10px 10px;}
.pxlaytog{font-size:11px;padding:6px 10px;}
.pxlays{border:1px solid var(--line);border-radius:5px;padding:6px;display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow-y:auto;}
.pxlay{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:4px;border:1px solid transparent;cursor:pointer;}
.pxlay.on{border-color:var(--cyan);background:rgba(87,216,227,.10);}
.pxlname{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .pxlname i{font-style:normal;color:var(--dim);font-family:var(--mono);font-size:10px;}
.pxic{min-width:32px;padding:4px 6px;font-size:12px;} .pxic[disabled]{opacity:.3;}
.pxlayx{display:flex;flex-direction:column;gap:6px;padding:4px 6px 8px;border-bottom:1px solid var(--line);}
.pxlayx label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);} .pxlayx input[type=range]{flex:1;}
.pxlayx select{background:#141f28;border:1px solid #33505e;color:var(--text);padding:6px;border-radius:3px;font-size:12px;}
/* v14.3: the frames strip, under the canvas */
.pxframes{border:1px solid var(--line);border-radius:5px;padding:6px;display:flex;flex-direction:column;gap:6px;}
.pxframes button[disabled]{opacity:.35;}
.pxfps{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);} .pxfps .pxnum{width:52px;padding:5px;}
.pxfrstrip{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch;}
.pxfr{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px;border:1px solid #33505e;border-radius:4px;background:#0e1418;cursor:pointer;}
.pxfr canvas{display:block;image-rendering:pixelated;} .pxfr i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);}
.pxfr.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan);} .pxfr.on i{color:var(--cyan);}
.pxfr.play{border-color:#f8c53a;} .pxfr.play i{color:#f8c53a;}
.pxcustom{align-items:center;margin-top:6px;} .pxcustom span{color:var(--dim);font-size:12px;}
.pxnum{width:64px;background:#141f28;border:1px solid #33505e;color:var(--text);padding:7px;border-radius:3px;font-family:var(--mono);}
.pxpalbody{max-height:26vh;overflow-y:auto;margin-top:6px;padding-right:2px;}
.pxgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;}
.pxsw{height:26px;min-width:0;border-radius:3px;border:1px solid rgba(0,0,0,.4);padding:0;}
.pxrecent .pxsw{width:26px;flex:0 0 auto;}
.pxsw.on{outline:2px solid #eaf2f6;outline-offset:1px;}
/* v12.4: ramp, swatch groups, brush sizes, nudge arrows, reference sliders */
.pxramp{display:flex;align-items:center;gap:3px;margin-top:6px;} .pxramp .pxsw{width:24px;flex:0 0 auto;}
.pxlbl{font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-right:4px;}
.pxrampmid{padding:0 3px;border-left:1px solid var(--line);border-right:1px solid var(--line);display:inline-flex;}
.pxgroup{border:1px solid var(--line);border-radius:4px;padding:6px;margin-bottom:6px;} .pxgroup b{flex:1;font-size:12px;}
.pxgroup .pxrow{align-items:center;margin-bottom:4px;}
.pxnudge{display:inline-flex;gap:3px;} .pxnudge button{min-width:34px;}
.pxbrush button{min-width:30px;}
.pxrange{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);} .pxrange input{width:110px;}
.pxe input[type=range]{accent-color:#57d8e3;}
.pxmenu{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:5px;padding:8px;}
/* v12.6: loot in the Battle Simulator */
.simhaul{margin-left:8px;font-family:var(--mono);font-size:10.5px;color:#b98ef0;border:1px solid rgba(185,142,240,.45);border-radius:3px;padding:1px 6px;letter-spacing:0;text-transform:none;}
.simloot{border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin:8px 0;font-size:12.5px;}
.simloot ul{margin:2px 0 0;padding-left:18px;line-height:1.6;} .simloot i{font-size:10.5px;margin-left:4px;}
/* v12.6: the Loot page */
.lts{padding:14px;max-width:720px;margin:0 auto;}
.ltshards{display:flex;align-items:baseline;gap:10px;margin:10px 0 8px;} .ltshards span{font-family:var(--disp);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);}
.ltshards b{font-family:var(--mono);font-size:26px;color:#b98ef0;}
.ltgrid{width:100%;border-collapse:collapse;table-layout:fixed;} .ltgrid th{font-size:11px;font-family:var(--disp);letter-spacing:.6px;text-transform:uppercase;color:var(--dim);text-align:left;padding:4px 3px;}
.ltgrid tbody th{width:78px;font-size:10.5px;} .ltgrid td{border:1px solid var(--line);padding:5px 6px;vertical-align:top;}
.ltgrid td b{display:block;font-family:var(--mono);font-size:15px;} .ltgrid td i{display:block;font-style:normal;font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ltgrid td.lt0 b{color:var(--dim);font-weight:400;}
.ltin{width:100%;box-sizing:border-box;background:#141f28;border:1px solid #33505e;color:var(--text);padding:6px;border-radius:3px;font-family:var(--mono);font-size:13px;}
.ltin.ltbig{width:140px;font-size:18px;} #ltX{width:90px;} .ltspread .ltin{width:70px;}
.ltsel{width:100%;background:#141f28;border:1px solid #33505e;color:var(--text);padding:7px;border-radius:3px;}
.lthist{display:flex;flex-direction:column;gap:6px;} .lthist div{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:12px;}
.lthist b{display:block;font-size:12px;} .lthist i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);} .lthist span{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;}
.ltsrc{display:flex;flex-wrap:wrap;gap:5px;} .ltsrc button{padding:7px 10px;font-size:11.5px;} .ltsrc button[disabled]{opacity:.4;}
.ltres ul{margin:4px 0 8px;padding-left:18px;line-height:1.7;font-size:13px;} .ltres i{font-style:normal;font-size:10.5px;margin-left:4px;}
.ltline{font-size:12.5px;margin:4px 0;} .ltline b{font-family:var(--mono);}
.ltbars{display:flex;flex-direction:column;gap:4px;margin:8px 0;} .ltbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:11.5px;}
.ltbar i{height:10px;background:#141f28;border-radius:2px;overflow:hidden;display:block;} .ltbar em{display:block;height:100%;}
.ltbar b{font-family:var(--mono);font-weight:400;text-align:right;}
.ltscroll{overflow-x:auto;} .ltw{border-collapse:collapse;width:100%;min-width:320px;} .ltw th{font-size:10.5px;padding:3px;text-align:left;color:var(--dim);font-weight:400;}
.ltw td{padding:2px;} .ltw .ltin{padding:5px 4px;font-size:12px;min-width:38px;} .lts2 tbody th{white-space:nowrap;color:var(--text);font-size:11.5px;}
.ltnote{font-size:10.5px;color:var(--dim);text-align:center;}
.ltnames{display:grid;grid-template-columns:78px repeat(3,minmax(0,1fr));gap:4px;align-items:center;font-size:11px;}
.ltnames b{font-family:var(--disp);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);}
.ltname{min-width:0;background:#141f28;border:1px solid #33505e;color:var(--text);padding:6px;border-radius:3px;font-size:11.5px;}
/* v12.8: the World Map and deployments */
.wld .wldmap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#05080b;touch-action:none;}
.wld canvas{display:block;touch-action:none;}
.wldzoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;}
.wldzoom button{min-width:34px;min-height:30px;padding:3px 6px;font-size:11px;background:rgba(8,14,18,.85);}
.wldstat{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0 10px;font-size:12px;line-height:1.55;}
.wldstat p{margin:2px 0;} .wldout{border-color:var(--cyan);}
.wldbox{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:12.5px;line-height:1.55;}
.wldbox p{margin:3px 0;} .wldnote{font-size:11.5px;color:var(--dim);} .wldok{color:#6fd189;} .wldbad{color:#ff7a7a;}
.wldnote2{border:1px solid var(--cyan);border-radius:5px;padding:7px 9px;margin:8px 0;font-size:12.5px;line-height:1.5;}
.wldlog{max-height:180px;overflow:auto;padding-left:16px;margin:6px 0 0;font-size:11.5px;color:var(--dim);}
.wldwhy{padding-left:16px;font-size:12px;color:#ff9a9a;margin:6px 0;}
.wldchoices{display:flex;flex-direction:column;gap:6px;margin-top:6px;} .wldchoices button{text-align:left;} .wldchoices i{font-style:normal;color:var(--dim);font-size:11px;}
.wldleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;margin-top:8px;} .wldleg b{color:var(--cyan);}
.wldsec{border:1px solid var(--line);border-radius:5px;padding:6px 9px;margin:6px 0;} .wldsec summary{cursor:pointer;font-size:12.5px;}
.wldrow{border-bottom:1px solid var(--line);padding:6px 0;display:flex;flex-direction:column;gap:2px;font-size:12px;} .wldrow i{font-style:normal;color:var(--dim);font-size:11px;}
.wldmini{flex-direction:row;align-items:center;gap:6px;} .wldmini span{flex:1;min-width:0;} .wldmini .ltin{width:60px;}
.wldform{border:1px dashed var(--line);border-radius:5px;padding:8px;margin:8px 0;display:flex;flex-direction:column;gap:6px;}
.wldform input:not([type=checkbox]),.wldform select{background:#141f28;border:1px solid #33505e;color:var(--text);padding:6px;border-radius:3px;}
.wldchoice{border:1px solid var(--line);border-radius:5px;padding:6px;} .wldout{margin-top:4px;} .wldchk{font-size:12px;display:flex;gap:6px;align-items:center;}
.wsch.on{border-color:var(--cyan);}
.wsstarter{color:#e0b34d !important;} .wslock{color:#57d8e3 !important;}
.wslockbar{border:1px solid #e0b34d;border-radius:5px;padding:7px 9px;font-size:12px;line-height:1.5;margin:8px 0;}
.simdephead{font-size:11.5px;color:var(--cyan);margin:0 0 6px;} .simdepnote{font-size:12px;color:#ffb0a0;}
.tagpill.design{color:#e0b34d;border-color:#6b5a2a;}
.wldlockdk{margin:10px 12px;padding:10px;border:1px solid #e0b34d;border-radius:4px;font-size:12px;line-height:1.6;}
/* v13.0: skins and assets */
.pxstabs{margin:6px 0 10px;}
.skset{align-items:center;gap:6px;font-size:12px;} .skset .ltsel{width:auto;flex:1;min-width:120px;}
.sklist{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px;}
.skcard{border:1px solid var(--line);border-radius:5px;padding:7px 9px;} .skcard.on{border-color:var(--cyan);}
.sktop{display:flex;gap:6px;align-items:center;flex-wrap:wrap;} .sktop b{font-size:12.5px;flex:1;min-width:0;}
.sktop button{padding:4px 9px;font-size:11px;}
.sktag{font-style:normal;font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:1px 6px;}
.skvars{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.skvar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid #1d2a33;border-radius:4px;padding:4px;}
.skvar>i{font-style:normal;font-size:11px;color:var(--dim);width:100%;}
.skvar canvas,.asth canvas,.skrcprev canvas{image-rendering:pixelated;border-radius:2px;display:block;}
.skmiss{display:inline-flex;align-items:center;justify-content:center;border:1px dashed #33505e;border-radius:2px;font-size:10px;color:var(--dim);}
.skbtns{display:flex;flex-wrap:wrap;gap:4px;width:100%;} .skbtns button{padding:4px 7px;font-size:10.5px;}
.skvname{background:#141f28;border:1px solid #33505e;color:var(--text);padding:4px 6px;border-radius:3px;font-size:11px;min-width:0;flex:1;}
.skedit{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;display:flex;flex-direction:column;gap:6px;}
.skedit input{background:#141f28;border:1px solid #33505e;color:var(--text);padding:6px;border-radius:3px;}
.skq{width:100%;box-sizing:border-box;background:#141f28;border:1px solid #33505e;color:var(--text);padding:7px;border-radius:3px;margin:6px 0;}
.skrc{border:1px solid var(--cyan);border-radius:5px;padding:8px;} .skrcprev{display:flex;gap:8px;align-items:flex-end;margin:6px 0;}
.skrow{display:flex;flex-wrap:wrap;gap:6px;} .skpair{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--dim);}
.skcol{width:24px;height:24px;min-width:0;padding:0;border:1px solid #33505e;border-radius:3px;} .skcol.on{outline:2px solid #fff;outline-offset:1px;}
.skpal{display:flex;flex-wrap:wrap;gap:2px;max-height:180px;overflow:auto;} .skpal .skcol{width:18px;height:18px;}
.aslist{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;}
.asrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:7px 9px;font-size:12px;}
.asrow>span:first-child{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:2px;} .asrow i{font-style:normal;font-size:11px;color:var(--dim);}
.asth{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;} .aspic{display:flex;flex-direction:column;gap:3px;align-items:center;} .aspic button{padding:3px 6px;font-size:10px;}
.asbtns{display:flex;flex-wrap:wrap;gap:4px;width:100%;} .asbtns button{padding:4px 8px;font-size:11px;}
.pxseg button i{font-style:normal;font-size:10px;color:var(--dim);}
.wslooks{display:flex;flex-direction:column;gap:6px;margin:6px 0;}
.wslook{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:5px;padding:6px 8px;}
.wslook>b{width:100%;font-size:12px;} .wslook>b i{font-style:normal;font-size:10.5px;color:#6fd189;margin-left:6px;}
.wslookv{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent;border-radius:4px;padding:3px;background:transparent;color:var(--text);min-width:0;}
.wslookv.on{border-color:var(--cyan);} .wslookv span{display:flex;gap:4px;align-items:flex-end;} .wslookv i{font-style:normal;font-size:10.5px;color:var(--dim);}

/* v12.9: the Dock */

.cbu.open .body{display:block;}
.cbrow{display:flex;gap:6px;align-items:center;margin-top:8px;}
.cbrow label{font-size:10px;color:var(--dim);flex:0 0 54px;}
.cbrow input[type=number]{width:60px;padding:7px;font-size:16px;background:#141f28;
  border:1px solid #33505e;color:var(--text);border-radius:3px;font-family:var(--mono);}
.cbrow .ghost{padding:7px 10px;font-size:11px;}
.cbwarn{margin-top:8px;font-size:11px;color:#e0b34d;line-height:1.45;}
.cbcombo{margin-top:9px;padding:8px 9px;border:1px solid var(--line);border-radius:4px;
  background:#111c24;}
.cbcombo .lbl{font-family:var(--disp);font-size:9.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--dim);}
.cbcombo .steps{display:flex;gap:5px;margin:6px 0;}
.cbcombo .step{width:22px;height:22px;border-radius:3px;border:1px solid #33505e;
  background:#182530;color:var(--dim);font-family:var(--mono);font-size:11px;
  display:flex;align-items:center;justify-content:center;}
.cbcombo .step.on{border-color:var(--cyan);background:rgba(87,216,227,.20);color:var(--cyan);}
.cbcombo .upnext{font-size:11.5px;color:var(--text);}
.cbcombo .upnext b{color:var(--cyan);}
.cbtargets{max-height:150px;overflow:auto;border:1px solid var(--line);
  border-radius:4px;margin-top:6px;}
.cbtarget{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;}
.cbtarget:last-child{border-bottom:0;}
.cbtarget.on{background:rgba(87,216,227,.16);border-left:3px solid var(--cyan);}
.cbacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.cbact{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  background:#182530;border:1px solid #33505e;border-radius:4px;color:var(--text);
  padding:6px 9px;font-family:var(--disp);font-size:11.5px;cursor:pointer;}
.cbact:disabled{opacity:.42;}
.cbact .c{font-size:9.5px;color:var(--cyan);letter-spacing:.6px;}
.cbact .d{font-size:9.5px;color:var(--dim);letter-spacing:.6px;}
#v-about{display:none;}
#v-about.on{display:flex;flex-direction:column;overflow:hidden;}
#abtop{flex:0 0 auto;display:flex;gap:6px;padding:9px 10px;background:var(--panel);
  border-bottom:1px solid var(--line);}
#abtop .abtab{flex:1;text-align:center;}
#abtop .abtab.on{color:var(--cyan);border-color:var(--line-hot);
  background:rgba(87,216,227,.16);}
#abbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 40px;
  font-size:13px;line-height:1.7;color:var(--text);}
#abbody h1,#abbody h2{font-family:var(--disp);color:var(--cyan);
  font-size:15px;letter-spacing:1.1px;text-transform:uppercase;margin:20px 0 8px;}
#abbody h3{font-size:13px;color:var(--text);margin:16px 0 6px;}
#abbody p{margin:0 0 11px;}
#abbody ul{margin:0 0 12px;padding-left:20px;}
#abbody li{margin-bottom:5px;}
#abbody code{background:var(--panel-2);padding:1px 5px;border-radius:3px;font-size:12px;}
#v-gloss{display:none;}
#v-gloss.on{display:flex;flex-direction:column;overflow:hidden;}
#gltop{flex:0 0 auto;display:flex;gap:7px;padding:8px 10px;background:var(--panel);
  border-bottom:1px solid var(--line);}
#gltop{flex-wrap:wrap;}
#gltop select{background:#141f28;border:1px solid #33505e;color:var(--text);
  border-radius:3px;padding:8px;font-family:var(--mono);font-size:16px;flex:1 1 40%;}
.glrow .grp{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:3px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
  font-size:9px;letter-spacing:.9px;text-transform:uppercase;vertical-align:middle;}
.glrow .devbtns{margin-top:8px;display:flex;gap:6px;}
.glrow .devbtns button{font-size:10px;padding:5px 9px;}
#gltop input{flex:1 1 100%;min-width:0;background:#141f28;border:1px solid #33505e;
  color:var(--text);border-radius:3px;padding:8px;font-family:var(--mono);font-size:16px;}
#glcount{flex:0 0 auto;padding:7px 12px;font-size:10.5px;color:var(--dim);
  border-bottom:1px solid var(--line);letter-spacing:.6px;}
#gllist{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));}
.glrow{padding:12px;border-bottom:1px solid var(--line);}
.glrow b{display:block;font-family:var(--disp);font-size:14px;color:var(--cyan);
  margin-bottom:4px;}
.glrow p{margin:0;font-size:12.5px;color:var(--text);line-height:1.6;}
.glrow .where{display:inline-block;margin-top:6px;font-size:10px;color:var(--dim);
  letter-spacing:.8px;text-transform:uppercase;cursor:pointer;
  border-bottom:1px dotted var(--line-hot);}

/* ---------- notes ---------- */
#v-notes{display:none;}
#v-notes.on{display:flex;flex-direction:column;overflow:hidden;}
#ntop{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);}
#ntop select{flex:1;background:#141f28;border:1px solid #33505e;
  color:var(--text);border-radius:3px;padding:8px;font-family:var(--mono);font-size:16px;}
#nsave{font-size:10.5px;color:var(--dim);}
#notes{flex:1;width:100%;border:0;background:var(--bg);color:var(--text);
  font-family:var(--disp);font-size:16px;line-height:1.7;padding:14px;resize:none;
  outline:none;}

/* ---------- guide marks ---------- */
#gbar{flex:0 0 auto;}
.gtools{display:flex;gap:7px;flex-wrap:wrap;padding:9px 10px;background:var(--panel-2);
  border-bottom:1px solid var(--line);}
.gtools .ghost{flex:1 1 auto;text-align:center;font-size:10.5px;}
.gtools .swatch{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);
  cursor:pointer;flex:0 0 auto;}
.gtools .swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35);}
/* user highlights: a soft wash, deliberately unlike the dev change marks */
/* A wash behind small text was hard to read on a dark theme, so a user
   highlight recolours the text instead. The dev change marks stay as left-edge
   rules, which keeps the two systems visually distinct. */
#mbody .uh{font-weight:600;}
/* dev change marks: a rule down the left edge, never a fill */
#mbody .chg-new{border-left:3px solid #3fbf6a;padding-left:9px;}
#mbody .chg-removed{border-left:3px solid var(--danger);padding-left:9px;
  text-decoration:line-through;opacity:.75;}
#mbody .chg-redundant{border-left:3px solid #e0b34d;padding-left:9px;}
#mbody .chg-undefined{border-left:3px solid #a879e6;padding-left:9px;}
.legendrow{display:flex;gap:12px;flex-wrap:wrap;padding:8px 12px;font-size:10px;
  color:var(--dim);background:var(--panel-2);border-bottom:1px solid var(--line);}
.legendrow span{display:flex;align-items:center;gap:5px;}
.legendrow i{width:10px;height:10px;border-radius:2px;display:inline-block;}

#v-stub{padding:26px 18px;}
#stubBody h2{font-family:var(--disp);font-size:20px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--cyan);margin:0 0 4px;}
#stubBody .g{font-size:34px;color:var(--cyan);display:block;margin-bottom:10px;}
#stubBody p{font-size:13px;color:var(--dim);line-height:1.7;margin:0 0 12px;}
#stubBody .soon{border:1px dashed var(--line-hot);border-radius:5px;padding:13px;
  background:var(--panel-2);font-size:12.5px;color:var(--text);line-height:1.65;}
#v-comp{display:none;}
#v-comp.on{display:flex;flex-direction:column;overflow:hidden;}
#ctop{flex:0 0 auto;display:flex;gap:7px;padding:8px 10px;background:var(--panel);
  border-bottom:1px solid var(--line);}
#ctop input{flex:1;min-width:0;background:#141f28;border:1px solid #33505e;
  color:var(--text);border-radius:3px;padding:8px;font-family:var(--mono);font-size:16px;}
#cfilters{display:none;flex-wrap:wrap;gap:8px;padding:10px;background:var(--panel-2);
  border-bottom:1px solid var(--line);}
#cfilters.on{display:flex;}
#cfilters label{display:flex;flex-direction:column;gap:3px;font-size:9.5px;
  color:var(--dim);letter-spacing:1.1px;text-transform:uppercase;flex:1 1 44%;}
#cfilters select{background:#141f28;border:1px solid #33505e;color:var(--text);
  border-radius:3px;padding:7px;font-family:var(--mono);font-size:13px;}
#cfilters .ghost{flex:1 1 100%;text-align:center;}
#ccount{flex:0 0 auto;padding:7px 12px;font-size:10.5px;color:var(--dim);
  border-bottom:1px solid var(--line);letter-spacing:.6px;}
#clist{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));}
#clist.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;padding:10px;}
.crow{display:flex;gap:10px;align-items:center;padding:11px 12px;
  border-bottom:1px solid var(--line);cursor:pointer;}
.crow:active{background:var(--panel);}
.crow .cmain{flex:1;min-width:0;}
.crow b{display:block;font-family:var(--disp);font-size:14px;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crow i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);
  margin-top:3px;letter-spacing:.5px;}
.tagpill{flex:0 0 auto;font-size:9px;letter-spacing:1px;text-transform:uppercase;
  border:1px solid var(--line-hot);border-radius:2px;padding:3px 5px;color:var(--cyan);}
.tagpill.mine{color:#e0b34d;border-color:#6a5324;}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
.gcard img{width:100%;display:block;border-radius:4px;background:var(--panel-2);}
.gcard .ph{width:100%;height:0;padding-bottom:140%;aspect-ratio:auto;border-radius:4px;background:var(--panel-2);
  border:1px dashed var(--line);color:var(--dim);font-size:10px;
  position:relative;overflow:hidden;}
@supports (aspect-ratio:1/1){
  .gcard .ph{height:auto;padding-bottom:0;aspect-ratio:2.5/3.5;
    display:flex;align-items:center;justify-content:center;}
}
.gcard span{font-size:10.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
#cselbar{flex:0 0 auto;}
#cSelect.on{color:var(--cyan);border-color:var(--line-hot);}
.crow.sel,.gcard.sel{background:rgba(87,216,227,.12);border-color:var(--cyan);}
.selbox{flex:0 0 auto;width:20px;height:20px;border-radius:3px;
  border:1px solid var(--line-hot);display:flex;align-items:center;
  justify-content:center;color:var(--cyan);font-size:12px;background:var(--panel-2);}
.crow.sel .selbox:after,.gcard.sel .selbox:after{content:"\2713";}
.selbar{display:flex;gap:7px;flex-wrap:wrap;padding:9px 10px;background:var(--panel);
  border-top:1px solid var(--line-hot);}
.selbar .ghost{flex:1 1 auto;text-align:center;}
.selbar .count{flex:1 1 100%;font-size:10.5px;color:var(--dim);letter-spacing:.5px;}
.rvshot img{border:1px solid var(--line);}
#cdev{flex:0 0 auto;}
.devbar{display:flex;gap:7px;flex-wrap:wrap;padding:9px 10px;background:#161008;
  border-top:1px solid #6a5324;}
.devbar .ghost{flex:1 1 auto;text-align:center;color:#e0b34d;border-color:#6a5324;}
.cardimg{width:100%;max-width:300px;display:block;margin:0 auto 10px;border-radius:6px;}

/* ---------- deck builder ---------- */
#v-deck{display:none;}
#v-deck.on{display:flex;flex-direction:column;overflow:hidden;}
#dktop{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:9px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);}
#dkTitle.renamable{cursor:pointer;border-bottom:1px dotted rgba(87,216,227,.5);}
#dkTitle{font-family:var(--disp);font-size:13px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--cyan);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
#dkbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.dkrow{display:flex;gap:10px;align-items:center;padding:12px;
  border-bottom:1px solid var(--line);cursor:pointer;}
.dkrow:active{background:var(--panel);}
.dkrow .m{flex:1;min-width:0;}
.dkrow b{display:block;font-family:var(--disp);font-size:14px;color:var(--text);}
.dkrow i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:3px;}
.dksec{padding:11px 12px 6px;font-family:var(--disp);font-size:10.5px;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan);
  border-bottom:1px solid var(--line);background:var(--panel-2);}
.dkfield{padding:10px 12px;border-bottom:1px solid var(--line);}
.dkfield label{display:block;font-size:9.5px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px;}
.dkfield input,.dkfield select{width:100%;padding:9px;font-size:16px;
  background:#141f28;border:1px solid #33505e;color:var(--text);
  border-radius:3px;font-family:var(--mono);}
.meter{padding:10px 12px;border-bottom:1px solid var(--line);}
.meter .lab{display:flex;justify-content:space-between;font-size:10.5px;
  color:var(--dim);margin-bottom:6px;letter-spacing:.6px;}
.meter .bar{height:7px;border-radius:4px;background:var(--panel-2);
  border:1px solid var(--line);overflow:hidden;}
.meter .fill{height:100%;background:var(--cyan);}
.meter .fill.over{background:var(--danger);}
.meter .fill.under{background:#e0b34d;}
.ping{display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);
  font-size:11.5px;line-height:1.55;}
.ping .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:4px;}
.ping.bad .dot{background:var(--danger);}
.ping.warn .dot{background:#e0b34d;}
.ping.info .dot{background:var(--cyan);}
.ping .txt{flex:1;color:var(--text);}
.ping .cite{display:block;color:var(--dim);font-size:10px;margin-top:3px;}
.ping.pinned{background:#1a1208;border-left:2px solid #e0b34d;}
.curve{display:flex;align-items:flex-end;gap:4px;height:64px;padding:12px;
  border-bottom:1px solid var(--line);}
.curve div{flex:1;background:var(--panel-2);border:1px solid var(--line);
  border-bottom:0;border-radius:3px 3px 0 0;position:relative;min-height:2px;}
.curve div span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;
  font-size:9px;color:var(--dim);}
.curve div b{position:absolute;top:-14px;left:0;right:0;text-align:center;
  font-size:9px;color:var(--cyan);font-weight:400;}
.dkbtns{display:flex;gap:8px;flex-wrap:wrap;padding:12px;}
.dkbtns .ghost{flex:1 1 auto;text-align:center;}
.qty{flex:0 0 auto;color:var(--cyan);font-size:12px;min-width:26px;text-align:right;}

/* ---------- bottom nav ---------- */
#nav{flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);}
#nav button{flex:1;min-width:0;background:none;border:0;padding:9px 1px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);font-size:8.5px;letter-spacing:.4px;text-transform:uppercase;
  overflow:hidden;
  min-height:var(--nav);border-top:2px solid transparent;}
#nav button .g{font-size:17px;line-height:1;}
#nav button.on{color:var(--cyan);border-top-color:var(--cyan);
  background:linear-gradient(180deg,rgba(87,216,227,.09),transparent);}

#hbdev{flex:0 0 auto;}
#mbody h1.secedited,#mbody h2.secedited,#mbody h3.secedited{
  border-left:2px solid #e0b34d;padding-left:9px;}
.edpen{margin-left:9px;vertical-align:middle;background:var(--panel-2);
  border:1px solid #6a5324;border-radius:3px;color:#e0b34d;font-size:9.5px;
  letter-spacing:1px;text-transform:uppercase;padding:3px 7px;cursor:pointer;
  font-family:var(--mono);}
#edWrap{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:220;background:var(--bg);display:none;
  flex-direction:column;padding-top:env(safe-area-inset-top);}
#edWrap.on{display:flex;}
#edWrap .edbar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:9px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);}
#edTitle{font-family:var(--disp);font-size:12.5px;color:var(--cyan);max-width:45vw;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#edArea{flex:1;width:100%;border:0;background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:16px;line-height:1.6;padding:12px;resize:none;
  outline:none;}
#edWrap .edfoot{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:9px 10px;
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:calc(9px + env(safe-area-inset-bottom));}
#edNote{flex:1;font-size:10.5px;color:var(--dim);line-height:1.5;}
#mbody .edited{display:contents;}
#mbody .kw{color:inherit;text-decoration:none;
  border-bottom:1px dotted rgba(87,216,227,.55);}
#mbody .kw:active{background:rgba(87,216,227,.18);}
#kwbox{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));
  z-index:180;background:var(--panel);border:1px solid var(--cyan);border-radius:6px;
  padding:14px;display:none;max-height:46vh;overflow:auto;
  box-shadow:0 16px 46px rgba(0,0,0,.75);}
#kwbox.on{display:block;}
#kwbox b{display:block;font-family:var(--disp);color:var(--cyan);font-size:14px;
  letter-spacing:1px;margin-bottom:6px;}
#kwbox span{display:block;font-size:13px;color:var(--text);line-height:1.62;
  font-family:var(--disp);}

/* ---------- modal ---------- */
#helpTool{font-size:15px;padding:6px 12px;color:var(--cyan);border-color:var(--line-hot);}
#nudge{position:fixed;top:56px;right:12px;z-index:150;
  background:var(--panel);border:1px solid var(--cyan);border-radius:5px;
  padding:10px 12px;max-width:220px;font-size:11.5px;color:var(--text);
  line-height:1.55;box-shadow:0 12px 34px rgba(0,0,0,.7);display:none;}
#nudge.on{display:block;}
#nudge:after{content:"";position:absolute;top:-6px;right:16px;width:10px;height:10px;
  background:var(--panel);border-left:1px solid var(--cyan);border-top:1px solid var(--cyan);
  transform:rotate(45deg);}
#bar{position:relative;}
.res{display:block;padding:11px 16px;border-bottom:1px solid var(--line);
  color:var(--text);text-decoration:none;}
.res b{display:block;font-size:13px;margin-bottom:3px;}
.res i{display:block;font-size:11px;color:var(--dim);font-style:normal;
  line-height:1.5;}
.resHead{padding:9px 16px;background:var(--panel);color:var(--cyan);
  font-family:var(--disp);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  position:sticky;top:0;}
/* Help mode, the same one the Card Forge and POI Sandbox use. The shell had
     the data-help attributes but nothing that read them, so they did nothing
     at all until now. */
  /* The layer covers the page so a tap outside a box does nothing \u2014 but it
     must not trap you: the nav and its own banner stay reachable, so help mode
     can always be left. */
  #helpLayer{position:fixed;inset:0;z-index:9500;background:transparent;
    display:none;pointer-events:none;}
  #helpLayer.on .help-box,#helpLayer.on #helpBanner,#helpLayer.on #helpPop{
    pointer-events:auto;}
  #helpLayer.on{display:block;}
  #helpBanner{position:fixed;z-index:80;left:10px;bottom:calc(70px + env(safe-area-inset-bottom));top:auto;transform:none;max-width:calc(100% - 124px);display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--cyan);border-radius:6px;font-size:12px;line-height:1.35;color:var(--cyan);box-shadow:0 6px 20px rgba(0,0,0,.6);}
  /* Bottom-left, compact: the top of the screen is where the labelled
     controls are, so a banner there always covered one of them. The
     docks own the bottom-right, and nothing labelled sits down here. */
  #helpBanner button{flex:0 0 auto;min-height:32px;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:3px; padding:4px 10px;cursor:pointer;font-family:var(--disp);font-size:12px;}
  .help-box{position:absolute;z-index:1;border:2px solid #7bf0fa;border-radius:4px;cursor:pointer; background:transparent;box-shadow:0 0 10px rgba(87,216,227,.85),inset 0 0 8px rgba(87,216,227,.35);}
  #helpPop{position:absolute;z-index:50;max-width:300px;background:#000000;border:2px solid #7bf0fa; border-radius:5px;padding:14px 16px;display:none;opacity:1; box-shadow:0 0 0 3px #000000, 0 10px 34px rgba(0,0,0,1);}
  #helpPop h4{margin:0 0 6px;font-family:var(--disp);font-size:13px;color:#ffffff;letter-spacing:.4px;}
  #helpPop p{margin:0;font-size:11.5px;line-height:1.62;color:#ffffff;}
  #modal{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(4,7,10,.86);z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px;}

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};

function unpack(id){
  /* A JSON string, not base64: no 33% size penalty and no byte-by-byte
     decode loop. The old base64 form is still read so a cached bundle from
     before this change keeps working. */
  var raw=$(id).textContent.trim();
  if(raw.charAt(0)==='"') return JSON.parse(raw);
  var bin=atob(raw), n=bin.length, u=new Uint8Array(n);
  for(var i=0;i<n;i++) u[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(u);
}

/* ================= tools ================= */
var loaded={};
function mountTool(view,payloadId){
  if(loaded[view]) return;
  loaded[view]=true;
  var host=$(view);
  var f=document.createElement("iframe");
  host.appendChild(f);
  var src=unpack(payloadId);
  var d=f.contentDocument||f.contentWindow.document;
  d.open(); d.write(src); d.close();
  loaded[view]=f;
  /* Key events inside an iframe never reach the parent, so forward Escape. */
  try{
    f.contentWindow.addEventListener("keydown",function(e){
      if(e.key==="Escape") topLayerClose();
    });
  }catch(e){}
}
function nudge(view){
  var f=loaded[view];
  if(!f||!f.contentWindow) return;
  try{ f.contentWindow.dispatchEvent(new Event("resize")); }catch(e){}
  /* Call the tool's own fit directly rather than trusting a resize event to
     fire when a hidden iframe is revealed. Retry while it is still loading. */
  var tries=0;
  (function again(){
    var w=f.contentWindow;
    if(w&&typeof w.keterFit==="function"){ try{ w.keterFit(); }catch(e){} return; }
    if(++tries<25) setTimeout(again,200);
  })();
}

/* ================= navigation ================= */
var VIEWS={battle:"v-battle",home:"v-home",manual:"v-manual",comp:"v-comp",deck:"v-deck",
           forge:"v-forge",poi:"v-poi",stub:"v-stub",gloss:"v-gloss",notes:"v-notes",
           about:"v-about",combat:"v-combat",dice:"v-dice",studio:"v-studio",hexstudio:"v-studio",chassis:"v-chassis",
           loot:"v-loot", workshop:"v-workshop", codex:"v-codex", world:"v-world", dock:"v-dock"};

/* #26: every page the app knows about. Built pages point at a view; the rest

var PAGES=[

function pageById(id){
  for(var i=0;i<PAGES.length;i++) if(PAGES[i].id===id) return PAGES[i];
  return null;
}
var cur="home";
/* the Pixel Studio opens pages and reads the card list from outside */
try{ window.KETER_GO=function(n){ go(n); }; window.KETER_ALLCARDS=function(){ return allCards(); }; }catch(e){}
function go(name){
  if(!VIEWS[name]) name="home";
  cur=name;
  /* two names can share a page (the Pixel and Hex Studios), so compare pages */
  for(var k in VIEWS) $(VIEWS[k]).classList.toggle("on",VIEWS[k]===VIEWS[name]);
  var btns=document.querySelectorAll("#nav button");
  for(var i=0;i<btns.length;i++)
    btns[i].classList.toggle("on",btns[i].getAttribute("data-go")===name);
  /* #9: the app header is only useful on Home. Everywhere else the tab bar
     already says where you are, and the space belongs to the page. */
  $("bar").style.display = (name==="home") ? "" : "none";

  if(name!=="forge"&&name!=="poi") hideNudge();
  if(name==="stub") renderStub();

  if(name==="dice") renderDicePage();

  if(name==="chassis" && window.KETER_CHASSIS_UI) window.KETER_CHASSIS_UI.render($("v-chassis"));
  if(name==="loot" && window.KETER_LOOT_UI) window.KETER_LOOT_UI.render($("v-loot"));
  if(name==="workshop" && window.KETER_WORKSHOP_UI) window.KETER_WORKSHOP_UI.render($("v-workshop"));

  if(name==="dock" && window.KETER_DOCK_UI) window.KETER_DOCK_UI.render($("v-dock"));
  if(name==="hexstudio" && window.KETER_STUDIO) window.KETER_STUDIO.render($("v-studio"),{mode:"hex"});
  if(name==="gloss") renderGlossary();
  if(name==="notes") renderNotes();
  if(name==="comp"){ compReady=true; renderComp(); }
  if(name==="deck"){ compReady=true; renderDeck(); }
  if(name==="forge"){ mountTool("v-forge","p-forge"); nudge("v-forge"); setTimeout(maybeNudge,1400); }
  if(name==="poi"){ mountTool("v-poi","p-poi"); nudge("v-poi"); setTimeout(maybeNudge,1400); }
  if(name!=="manual") $("toc").classList.remove("on");
  if(location.hash!=="#/"+name){ history.replaceState(null,"","#/"+name); }
}
document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("[data-go]"):null;

});

/* ================= glossary keywords =================
   Handbook 13 is authoritative, so definitions are extracted from it at build
   time. Every occurrence is marked, with a hairline underline rather than a fill
   so 181 terms do not overwhelm the page. */
var GLOSS=unpackJSON("p-gloss");
var GMAP={}, GRX=null;
function buildGlossIndex(){
  GMAP={};
  var all=[];
  for(var i=0;i<GLOSS.length;i++){
    var g=GLOSS[i];
    for(var a=0;a<g.alias.length;a++){
      var key=g.alias[a];
      if(!key) continue;
      GMAP[key.toLowerCase()]=g;
      all.push(key);
    }
  }
  all.sort(function(x,y){ return y.length-x.length; });   /* longest wins */
  var parts=all.map(function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); });
  try{
    GRX=new RegExp("(?<![\\w-])("+parts.join("|")+")(?![\\w-])","g");
  }catch(e){
    GRX=new RegExp("\\b("+parts.join("|")+")\\b","g");
  }
}
buildGlossIndex();

var SKIP_TAGS={H1:1,H2:1,H3:1,H4:1,SCRIPT:1,STYLE:1,A:1,MARK:1,CODE:1};
/* The Glossary is roughly half the Handbook by volume and is nothing but term
   definitions. Marking keywords inside them is circular — every definition
   would link to its neighbours — and it was the single largest slice of the
   work done on every render. */
function glossaryBounds(body){
  var heads=body.querySelectorAll("h1[id],h2[id]");
  for(var i=0;i<heads.length;i++){
    if(/glossary/i.test(heads[i].textContent)){
      var lvl=+heads[i].nodeName.slice(1), stop=null, n=heads[i].nextSibling;
      while(n){
        if(n.nodeType===1&&/^H[1-6]$/.test(n.nodeName)&&+n.nodeName.slice(1)<=lvl){ stop=n; break; }
        n=n.nextSibling;
      }
      return {start:heads[i],stop:stop};
    }
  }
  return null;
}
function markKeywords(){
  var body=$("mbody");
  if(!body||!GRX) return;
  var g=glossaryBounds(body);
  var skipSet=null;
  if(g){
    skipSet=new Set();
    var n=g.start;
    while(n&&n!==g.stop){ skipSet.add(n); n=n.nextSibling; }
  }
  var walk=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,{
    acceptNode:function(n){
      var p=n.parentNode;
      while(p&&p!==body){
        if(SKIP_TAGS[p.nodeName]) return NodeFilter.FILTER_REJECT;
        if(p.className==="kw") return NodeFilter.FILTER_REJECT;
        if(skipSet&&skipSet.has(p)) return NodeFilter.FILTER_REJECT;
        p=p.parentNode;
      }
      return n.nodeValue && n.nodeValue.length>2
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  var nodes=[],n;
  while((n=walk.nextNode())) nodes.push(n);
  for(var i=0;i<nodes.length;i++){
    var node=nodes[i], txt=node.nodeValue;
    GRX.lastIndex=0;
    if(!GRX.test(txt)) continue;
    GRX.lastIndex=0;
    var span=document.createElement("span");
    span.innerHTML=esc(txt).replace(GRX,function(m){
      return '<a href="#" class="kw" data-kw="'+esc(m.toLowerCase())+'">'+m+'</a>';
    });
    node.parentNode.replaceChild(span,node);
  }
}
function showTerm(key){
  var g=GMAP[key];
  if(!g) return;
  var box=$("kwbox");
  box.innerHTML='<b>'+esc(g.term)+'</b><span>'+esc(g.def)+'</span>';
  box.classList.add("on");
}
document.addEventListener("click",function(e){
  var a=e.target.closest?e.target.closest(".kw"):null;
  if(a){
    e.preventDefault(); e.stopPropagation();
    showTerm(a.getAttribute("data-kw"));
    return;
  }
  var box=$("kwbox");
  if(box&&box.classList.contains("on")&&!e.target.closest("#kwbox"))
    box.classList.remove("on");
},true);

/* ================= markdown =================
   Small renderer covering what the guides actually use: headings, paragraphs,
   lists, tables, blockquotes, rules, bold, italic and inline code. */
function mdInline(t){
  return esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");
}
function mdRender(md,idPrefix){
  var lines=String(md||"").replace(/\r/g,"").split("\n");
  var out=[], i=0;
  function flushPara(buf){
    if(buf.length) out.push("<p>"+mdInline(buf.join(" "))+"</p>");
    buf.length=0;
  }
  var para=[];
  while(i<lines.length){
    var ln=lines[i];

    var h=/^(#{1,6})\s+(.*)$/.exec(ln);
    if(h){
      flushPara(para);
      var lvl=h[1].length;
      out.push("<h"+lvl+">"+mdInline(h[2])+"</h"+lvl+">");
      i++; continue;
    }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(ln)){ flushPara(para); out.push("<hr>"); i++; continue; }

    if(/^\s*\|/.test(ln)){
      flushPara(para);
      var rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      var cells=rows.map(function(r){
        return r.trim().replace(/^\||\|$/g,"").split("|").map(function(x){ return x.trim(); });
      });
      var body=cells.filter(function(r,n){
        return !(n===1 && r.every(function(x){ return /^:?-{2,}:?$/.test(x); }));
      });
      var head=body.shift()||[];
      out.push("<table><thead><tr>"+head.map(function(c){ return "<th>"+mdInline(c)+"</th>"; }).join("")+
        "</tr></thead><tbody>"+body.map(function(r){
          return "<tr>"+r.map(function(c){ return "<td>"+mdInline(c)+"</td>"; }).join("")+"</tr>";
        }).join("")+"</tbody></table>");
      continue;
    }

    if(/^\s*([-*+]|\d+\.)\s+/.test(ln)){
      flushPara(para);
      var ordered=/^\s*\d+\./.test(ln), items=[];
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,""));
        i++;
        while(i<lines.length && /^\s{2,}\S/.test(lines[i])){
          items[items.length-1]+=" "+lines[i].trim(); i++;
        }
      }
      out.push("<"+(ordered?"ol":"ul")+">"+items.map(function(x){
        return "<li>"+mdInline(x)+"</li>"; }).join("")+"</"+(ordered?"ol":"ul")+">");
      continue;
    }

    if(/^\s*>\s?/.test(ln)){
      flushPara(para);
      var q=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      out.push("<blockquote>"+mdInline(q.join(" "))+"</blockquote>");
      continue;
    }

    if(!ln.trim()){ flushPara(para); i++; continue; }
    para.push(ln.trim()); i++;
  }
  flushPara(para);
  return out.join("\n");
}

/* ================= handbook overrides =================
   Edits are stored per section id, separate from the base document, so a new
   Handbook import can re-base everything else and flag only real conflicts. */
var HB_KEY="keter-app-handbook";
var HBEDITS={schema:"keter.handbook/1",version:"0",edits:{}};

function loadHandbookEdits(){
  try{
    var raw=localStorage.getItem(HB_KEY);
    if(raw){ var j=JSON.parse(raw); if(j&&j.edits) HBEDITS=j; }
  }catch(e){}
  if(location.protocol==="file:") return Promise.resolve();
  return fetch("handbook.json?_="+Date.now(),{cache:"no-store"})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(!j||!j.edits) return;
      var localVer=String(HBEDITS.version||"0"), pubVer=String(j.version||"0");
      if(!localStorage.getItem(HB_KEY) || (+pubVer||0)>(+localVer||0)){
        HBEDITS=j;
        try{ localStorage.setItem(HB_KEY,JSON.stringify(HBEDITS)); }catch(e){}
      }
    })
    .catch(function(){});
}
function saveHandbookEdits(){
  HBEDITS.dirty=true;
  try{ localStorage.setItem(HB_KEY,JSON.stringify(HBEDITS)); }catch(e){}
}
function editFor(docId,secId){
  var d=HBEDITS.edits[docId];
  return d?d[secId]:null;
}
function editCount(){
  var n=0;
  for(var d in HBEDITS.edits) for(var k in HBEDITS.edits[d]) n++;
  return n;
}

/* Replace an edited section in the rendered document: the heading plus every
   element after it until the next heading of the same level or higher. */
function sectionNodes(h){
  var lvl=+h.nodeName.slice(1), nodes=[h], n=h.nextSibling;
  while(n){
    if(n.nodeType===1 && /^H[1-6]$/.test(n.nodeName) && +n.nodeName.slice(1)<=lvl) break;
    nodes.push(n);
    n=n.nextSibling;
  }
  return nodes;
}
function applyEdits(docId){
  var edits=HBEDITS.edits[docId];
  if(!edits) return;
  var body=$("mbody");
  for(var secId in edits){
    var h=document.getElementById(secId);
    if(!h||!body.contains(h)) continue;
    var nodes=sectionNodes(h);
    var wrap=document.createElement("div");
    wrap.className="edited";
    wrap.innerHTML=mdRender(edits[secId].md);
    var first=wrap.querySelector("h1,h2,h3,h4,h5,h6");
    if(first) first.id=secId;
    h.parentNode.insertBefore(wrap,h);
    nodes.forEach(function(n){ if(n.parentNode) n.parentNode.removeChild(n); });
  }
}

/* If the glossary itself was edited, the keyword popups must follow it. */
function rebuildGlossary(){
  var body=$("mbody");
  if(!body) return;
  var heads=body.querySelectorAll("h1,h2");
  var gloss=null;
  for(var i=0;i<heads.length;i++){
    if(/glossary/i.test(heads[i].textContent)){ gloss=heads[i]; break; }
  }
  if(!gloss) return;
  var nodes=sectionNodes(gloss), rows=[];
  nodes.forEach(function(n){
    if(n.nodeType!==1) return;
    var t=n.querySelectorAll?n.querySelectorAll("tr"):[];
    for(var i=0;i<t.length;i++) rows.push(t[i]);
    if(n.nodeName==="TR") rows.push(n);
  });
  if(!rows.length) return;
  var found=[];
  rows.forEach(function(tr){
    var c=tr.querySelectorAll("td");
    if(c.length<2) return;
    var term=c[0].textContent.trim(), def=c[1].textContent.trim();
    if(!term||!def||/^term$/i.test(term)) return;
    var label=term, alias=[term];
    var m=/^(.*?)\s*\(([^)]+)\)\s*$/.exec(term);
    if(m){ label=m[1].trim(); alias=[label,m[2].trim()]; }
    found.push({term:term,label:label,def:def,alias:alias.filter(function(a){ return a.length>=2; })});
  });
  if(found.length>20){ GLOSS=found; buildGlossIndex(); }
}

/* ================= change marks =================
   Green and red are diffs, not opinions: they come from comparing the current
   text against the last published snapshot, so they age correctly on their own.
   Yellow and violet are judgements and are applied by hand. */
var MARK_KEY="keter-app-marks", PUB_KEY="keter-app-published";
var MARKS={}, PUBLISHED={};
function loadMarks(){
  try{ MARKS=JSON.parse(localStorage.getItem(MARK_KEY)||"{}")||{}; }catch(e){ MARKS={}; }
  try{ PUBLISHED=JSON.parse(localStorage.getItem(PUB_KEY)||"{}")||{}; }catch(e){ PUBLISHED={}; }
}
function saveMarks(){
  try{ localStorage.setItem(MARK_KEY,JSON.stringify(MARKS)); }catch(e){}
}
/* taken when you export the Handbook: that is what "the last update" means */
function snapshotPublished(){
  var snap={};
  (DOCS.find(function(d){ return d.id==="hb"; })||{secs:[]}).secs.forEach(function(sec){
    var e=editFor("hb",sec.id);
    snap[sec.id]=(e?e.md:sec.md)||"";
  });
  PUBLISHED=snap;
  try{ localStorage.setItem(PUB_KEY,JSON.stringify(PUBLISHED)); }catch(e){}
}
function words(t){ return String(t||"").split(/(\s+)/); }
/* a word-level diff, enough to colour added and removed runs */
function diffWords(oldT,newT){
  var a=words(oldT), b=words(newT);
  var m=a.length, n=b.length;
  var start=0;
  while(start<m&&start<n&&a[start]===b[start]) start++;
  var endA=m, endB=n;
  while(endA>start&&endB>start&&a[endA-1]===b[endB-1]){ endA--; endB--; }
  return {
    added:b.slice(start,endB).join("").trim(),
    removed:a.slice(start,endA).join("").trim()
  };
}
function autoMarksFor(secId){
  var sec=(DOCS.find(function(d){ return d.id==="hb"; })||{secs:[]})
    .secs.find(function(x){ return x.id===secId; });
  if(!sec) return null;
  var e=editFor("hb",secId);
  var now=(e?e.md:sec.md)||"";
  var was=PUBLISHED[secId];
  if(was===undefined) return null;          /* never published: nothing to diff */
  if(was===now) return null;
  return diffWords(was,now);
}
function applyChangeMarks(){
  if(!isDev()) return;
  var body=$("mbody");
  if(!body || DOCS[docIdx].id!=="hb") return;
  (DOCS[docIdx].secs||[]).forEach(function(sec){
    var h=document.getElementById(sec.id);
    if(!h) return;
    var d=autoMarksFor(sec.id);
    var manual=(MARKS[sec.id]||null);
    var nodes=sectionNodes(h);
    var cls=null;
    if(manual==="redundant") cls="chg-redundant";
    else if(manual==="undefined") cls="chg-undefined";
    else if(d && d.added) cls="chg-new";
    else if(d && d.removed && !d.added) cls="chg-removed";
    if(!cls) return;
    nodes.forEach(function(n){
      if(n.nodeType===1) n.classList.add(cls);
    });
  });
}

/* ================= handbook editing (Dev Mode) ================= */
function addEditHandles(docId){
  var body=$("mbody");
  if(!body) return;
  body.querySelectorAll(".edpen").forEach(function(e){ e.remove(); });
  body.querySelectorAll(".secedited").forEach(function(e){ e.classList.remove("secedited"); });
  if(!isDev()) return;
  var d=DOCS[docIdx];
  (d.secs||[]).forEach(function(sec){
    var h=document.getElementById(sec.id);
    if(!h) return;
    if(editFor(docId,sec.id)) h.classList.add("secedited");
    var pen=document.createElement("button");
    pen.className="edpen";
    pen.type="button";
    pen.textContent="edit";
    pen.setAttribute("data-sec",sec.id);
    h.appendChild(pen);
  });
}
function sectionSource(docId,secId){
  var e=editFor(docId,secId);
  if(e) return e.md;
  var d=DOCS[docIdx];
  for(var i=0;i<(d.secs||[]).length;i++)
    if(d.secs[i].id===secId) return d.secs[i].md||"";
  return "";
}
function originalSource(secId){
  var d=DOCS[docIdx];
  for(var i=0;i<(d.secs||[]).length;i++)
    if(d.secs[i].id===secId) return d.secs[i].md||"";
  return "";
}
function openEditor(secId){
  var docId=DOCS[docIdx].id;
  var src=sectionSource(docId,secId);
  var edited=!!editFor(docId,secId);
  $("edWrap").classList.add("on");
  $("edTitle").textContent=(document.getElementById(secId)||{}).textContent||"Section";
  $("edArea").value=src;
  $("edRevert").style.display=edited?"":"none";
  $("edWrap").setAttribute("data-sec",secId);
  $("edNote").textContent = edited
    ? "This section has unpublished edits."
    : "Markdown. Tables, lists and ** bold ** all work.";
}
function closeEditor(){ $("edWrap").classList.remove("on"); }
function saveEditor(){
  var secId=$("edWrap").getAttribute("data-sec");
  var docId=DOCS[docIdx].id;
  var md=$("edArea").value;
  if(md.trim()===originalSource(secId).trim()){
    if(HBEDITS.edits[docId]) delete HBEDITS.edits[docId][secId];
  }else{
    HBEDITS.edits[docId]=HBEDITS.edits[docId]||{};
    HBEDITS.edits[docId][secId]={md:md,at:Date.now()};
  }
  saveHandbookEdits();
  WHERE=null; SECTXT={};
  closeEditor();
  var y=$("mbody").scrollTop;
  renderDoc(docIdx);
  $("mbody").scrollTop=y;
}
function revertSection(){
  var secId=$("edWrap").getAttribute("data-sec");
  var docId=DOCS[docIdx].id;
  if(HBEDITS.edits[docId]) delete HBEDITS.edits[docId][secId];
  saveHandbookEdits();
  WHERE=null; SECTXT={};
  closeEditor();
  var y=$("mbody").scrollTop;
  renderDoc(docIdx);
  $("mbody").scrollTop=y;
}
function paintHbState(){
  var bar=$("hbdev");
  if(!bar) return;
  if(!isDev()){ bar.innerHTML=""; return; }
  var n=editCount();
  bar.innerHTML='<div class="devbar">'+

    (n? n+" edited section"+(n===1?"":"s")+(HBEDITS.dirty?" \u00b7 unpublished":"") : "No edits yet")+
    "</span>"+
    '<button class="ghost" id="hbExport">Export handbook.json</button>'+
    '<button class="ghost" id="hbImport">Import</button>'+
