/* ================= highlighter =================
   A user tool, deliberately styled as a soft wash so it never reads as one of
   the Dev Mode change marks. */
var HL_KEY="keter-app-highlights";
var HLS={}, hlColour=null;
var HL_COLOURS=["#e0b34d","#57d8e3","#7bd88f","#e06fa6","#a879e6","#ff8c5a"];
function loadHL(){
  try{ HLS=JSON.parse(localStorage.getItem(HL_KEY)||"{}")||{}; }catch(e){ HLS={}; }
}
function saveHL(){
  try{ localStorage.setItem(HL_KEY,JSON.stringify(HLS)); }catch(e){}
}
function applyHighlights(docId){
  var list=HLS[docId]||[];
  if(!list.length) return;
  var body=$("mbody");
  list.forEach(function(h){
    var walk=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,null), n;
    while((n=walk.nextNode())){
      var idx=n.nodeValue.indexOf(h.t);
      if(idx<0) continue;
      var range=document.createRange();
      range.setStart(n,idx); range.setEnd(n,idx+h.t.length);
      var span=document.createElement("span");
      span.className="uh";
      span.style.color=h.c;
      try{ range.surroundContents(span); }catch(e){}
      break;
    }
  });
}
function renderGuideBar(){

   Handbook question should surface even when the Forge guide is showing. */
/* Escaping quotes too, not just <>&, because this is used inside HTML
   attributes throughout the app — a card name containing a quote, like
   "Binder" Cleaner Bot, was breaking any attribute it was placed into. */
function esc(t){ return String(t).replace(/[<>&"']/g,function(c){
  return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* Section text is the html with its tags removed. Deriving it once and
   keeping it beats shipping a second copy of every guide in the bundle. */
var SECTXT={};
function secText(doc,sec){
  var key=doc.id+"/"+sec.id;
  if(SECTXT[key]!=null) return SECTXT[key];
  if(!doc._split){
    doc._split={};
    var tmp=document.createElement("div");
    tmp.innerHTML=doc.html;
    var heads=tmp.querySelectorAll("h1[id],h2[id],h3[id]");
    for(var i=0;i<heads.length;i++){
      var h=heads[i], buf=[], n=h.nextSibling;
      var lvl=+h.nodeName.slice(1);
      while(n){
        if(n.nodeType===1&&/^H[1-6]$/.test(n.nodeName)&&+n.nodeName.slice(1)<=lvl) break;
        buf.push(n.textContent||"");
        n=n.nextSibling;
      }
      doc._split[h.id]=buf.join(" ").replace(/\s+/g," ").trim().slice(0,4000);
    }
  }
  SECTXT[key]=doc._split[sec.id]||"";
  return SECTXT[key];
}

function searchAll(q){
  var needle=q.toLowerCase(), out=[];
  for(var d=0;d<DOCS.length;d++){
    var secs=DOCS[d].secs||[], hits=[];
    for(var i=0;i<secs.length;i++){
      var sec=secs[i];
      var inHead=sec.head.toLowerCase().indexOf(needle)!==-1;
      var body=secText(DOCS[d],sec);
      var at=body.toLowerCase().indexOf(needle);
      if(!inHead && at===-1) continue;
      var snip="";
      if(at!==-1){
        var from=Math.max(0,at-45);
        snip=(from>0?"\u2026":"")+body.slice(from,at+needle.length+70).trim()+"\u2026";
      }
      hits.push({doc:d,id:sec.id,head:sec.head,snip:snip});
      if(hits.length>=40) break;
    }
    if(hits.length) out.push({doc:d,title:DOCS[d].title,hits:hits});
  }
  return out;
}

function renderResults(q){
  var groups=searchAll(q), total=0, html="";
  for(var g=0;g<groups.length;g++){
    total+=groups[g].hits.length;
    html+='<div class="resHead">'+esc(groups[g].title)+
          ' \u00b7 '+groups[g].hits.length+'</div>';
    for(var i=0;i<groups[g].hits.length;i++){

      html+='<a href="#" class="res" data-doc="'+h.doc+'" data-jump="'+h.id+'">'+
            '<b>'+esc(h.head)+'</b>'+

    }
  }
  $("toc").innerHTML = total ? html :
    '<div class="empty">Nothing found in any of the three guides.</div>';
}

function highlight(v){
  var body=$("mbody");
  var old=body.querySelectorAll("mark");
  for(var i=0;i<old.length;i++){
    var m=old[i], p=m.parentNode;
    p.replaceChild(document.createTextNode(m.textContent),m);

  }

  if(v.length<2) return;
  var rx=new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  var walk=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,null);
  var hits=[],n;
  while((n=walk.nextNode())){ if(rx.test(n.nodeValue)) hits.push(n); rx.lastIndex=0; }
  for(var j=0;j<hits.length && j<400;j++){
    var node=hits[j], span=document.createElement("span");

    node.parentNode.replaceChild(span,node);
  }
}

var KEYS=["keter-hexmap-levels","keter-hexmap-projects","keter-hexmap-stamps",
          "keter-poi","keter-cardforge-heroes","keter-cardforge-scaling",
          "keter-cardforge-sections","keter-app-master","keter-app-loadouts",

/* ================= durability layer =================
   The tools keep using localStorage exactly as they always have. This layer
   mirrors those keys into IndexedDB, which survives cases localStorage does
   not, restores them if localStorage comes up empty, and keeps rolling
   restore points so a corrupt save is never the only copy. */
var DB_NAME="keter-durable", STORE="kv", SNAPS="snaps", MAX_SNAPS=12;
var db=null, lsOK=false, persisted=null;

function openDB(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){ rej("no indexeddb"); return; }
    var rq=indexedDB.open(DB_NAME,1);
    rq.onupgradeneeded=function(){
      var d=rq.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      if(!d.objectStoreNames.contains(SNAPS)) d.createObjectStore(SNAPS,{keyPath:"t"});
    };
    rq.onsuccess=function(){ res(rq.result); };
    rq.onerror=function(){ rej(rq.error); };
  });
}
function tx(store,mode,fn){
  return new Promise(function(res,rej){
    if(!db){ rej("no db"); return; }
    var t=db.transaction(store,mode), st=t.objectStore(store), out=fn(st);
    /* On a miss, request.result is undefined — return that, not the request
       object itself, or callers treat an IDBRequest as real data. */
    t.oncomplete=function(){
      res(out && typeof out==="object" && "result" in out ? out.result : out);
    };
    t.onerror=function(){ rej(t.error); };
  });
}
function dbGet(store,k){ return tx(store,"readonly",function(st){ return st.get(k); }); }
function dbPut(store,v,k){ return tx(store,"readwrite",function(st){ return k===undefined?st.put(v):st.put(v,k); }); }
function dbAll(store){ return tx(store,"readonly",function(st){ return st.getAll(); }); }
function dbDel(store,k){ return tx(store,"readwrite",function(st){ return st.delete(k); }); }

function lsTest(){
  try{
    localStorage.setItem("keter-probe","1");
    var v=localStorage.getItem("keter-probe")==="1";
    localStorage.removeItem("keter-probe");
    return v;
  }catch(e){ return false; }
}
function readLS(){
  var o={};
  for(var i=0;i<KEYS.length;i++){
    try{ var v=localStorage.getItem(KEYS[i]); if(v!==null) o[KEYS[i]]=v; }catch(e){}
  }
  return o;
}
function hasData(o){ for(var k in o){ if(o[k] && o[k]!=="[]" && o[k]!=="{}") return true; } return false; }

var lastMirror="";
function mirror(force){
  if(!db) return Promise.resolve();
  var cur=readLS(), sig=JSON.stringify(cur);
  if(sig===lastMirror && !force) return Promise.resolve();
  lastMirror=sig;
  return dbPut(STORE,cur,"live").then(function(){ return snapMaybe(cur); }).catch(function(){});
}
var lastSnap=0;
function snapMaybe(cur){
  var now=Date.now();
  if(!hasData(cur)) return;
  if(now-lastSnap < 120000) return;
  lastSnap=now;
  return dbPut(SNAPS,{t:now,data:cur}).then(function(){
    return dbAll(SNAPS).then(function(all){
      all.sort(function(a,b){ return b.t-a.t; });
      var kill=all.slice(MAX_SNAPS);
      return Promise.all(kill.map(function(x){ return dbDel(SNAPS,x.t); }));
    });
  });
}
function restoreInto(data){
  var n=0;
  for(var k in data){
    if(KEYS.indexOf(k)===-1) continue;
    try{ localStorage.setItem(k,data[k]); n++; }catch(e){}
  }
  return n;
}

function renderHealth(recovered){
  var el=$("health"); if(!el) return;
  var rows=[];
  if(!lsOK){
    rows.push(['r','<b>Saving is blocked here.</b> This browser will not let this file store data \u2014 usually because it was opened from a Downloads folder. Your work will not survive closing the app. Publish it to a web address, or open it through a file manager that hands it to the browser as a real file.']);
  }else if(persisted===true){
    rows.push(['g','<b>Storage is protected.</b> The system has marked this app\u2019s data as persistent \u2014 it will not be cleared automatically to reclaim space.']);
  }else if(persisted===false){
    rows.push(['y','<b>Storage works but is not protected.</b> Install to your home screen to have the system grant persistence, and keep exporting backups.']);
  }else{
    rows.push(['y','<b>Storage works.</b> This browser does not report a persistence guarantee, so keep exporting backups.']);
  }
  if(db){
    rows.push(['g','Second copy kept in a separate database, refreshed continuously, with rolling restore points.']);
  }else{
    rows.push(['r','Backup database unavailable \u2014 this app is running on one copy of your data only.']);
  }
  if(recovered){
    rows.push(['g','<b>Recovered '+recovered+' data set'+(recovered>1?'s':'')+'</b> from the backup database on this launch.']);
  }
  el.className="note"+(lsOK?" ok":"");
  el.innerHTML=rows.map(function(r){
    return '<div class="row"><span class="dot '+r[0]+'"></span><span>'+r[1]+'</span></div>';
  }).join("");
}

function bootDurable(){
  lsOK=lsTest();
  var recovered=0;
  var p=openDB().then(function(d){ db=d; }).catch(function(){ db=null; });
  p=p.then(function(){
    if(!db||!lsOK) return;
    return dbGet(STORE,"live").then(function(saved){
      var cur=readLS();
      if(saved && hasData(saved) && !hasData(cur)){
        recovered=restoreInto(saved);
      }
      return mirror(true);
    }).catch(function(){});
  });
  p=p.then(function(){
    if(navigator.storage && navigator.storage.persisted){
      return navigator.storage.persisted().then(function(has){
        if(has){ persisted=true; return; }
        if(navigator.storage.persist){
          return navigator.storage.persist().then(function(g){ persisted=!!g; })
                 .catch(function(){ persisted=false; });
        }
        persisted=false;
      }).catch(function(){});
    }
  });
  return p.then(function(){
    renderHealth(recovered);
    setInterval(function(){ mirror(false); }, 4000);
    window.addEventListener("pagehide",function(){ mirror(true); });
    document.addEventListener("visibilitychange",function(){
      if(document.visibilityState==="hidden") mirror(true);
    });
  });
}

document.addEventListener("click",function(e){

  if(!b) return;
  var t=+b.getAttribute("data-snap");

    var n=restoreInto(rec.data);
    lastMirror="";
    say("Restored","<p>Restored <b>"+n+"</b> data sets from "+new Date(t).toLocaleString()+
        ".</p><p>Close and reopen the app so both tools reload with the restored data.</p>");

/* ================= compendium =================
   Master ships bundled, but compendium.json overrides it when published, so
   cards can be updated without rebuilding the app. Dev Mode edits the local
   copy; publishing means exporting the file and uploading it. */
var MASTER=unpackJSON("p-master");
var MASTER_KEY="keter-app-master";
var compView="list", compReady=false, thumbQueue=[], thumbBusy=false;

/* Entries promoted before v5.0 hold only the list summary: no `entries` array,
   so no rules text. They cannot be repaired from the Master alone, so they are
   cleared — with the old Master kept under a backup key rather than destroyed. */
function purgeDamagedMaster(){
  var cards=MASTER.cards||[];
  if(!cards.length) return 0;
  var damaged=cards.filter(function(c){
    return !c.entries && !c.abilities;
  });
  if(!damaged.length) return 0;
  try{ localStorage.setItem("keter-app-master-damaged",
       JSON.stringify({at:Date.now(), cards:damaged})); }catch(e){}
  MASTER.cards=cards.filter(function(c){ return c.entries || c.abilities; });
  saveMaster();
  return damaged.length;
}
function loadMaster(){
  try{
    var local=localStorage.getItem(MASTER_KEY);
    if(local){ var m=JSON.parse(local); if(m&&m.cards) MASTER=m; }
  }catch(e){}
  if(location.protocol==="file:") return Promise.resolve();
  return fetch("compendium.json?_="+Date.now(),{cache:"no-store"})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(j&&Array.isArray(j.cards)){
        /* Compared as numbers. Compared as text, "10" came before "9"; and the
           card list's own version was never raised when cards changed, so a
           device kept its old copy \u2014 the test cards and the 48 restored cards
           never arrived. The build now raises it whenever the cards change. */
        var localVer=parseFloat(MASTER.version||"0")||0, pubVer=parseFloat(j.version||"0")||0;
        if(!localStorage.getItem(MASTER_KEY) || pubVer>localVer){
          MASTER=j;
          try{ localStorage.setItem(MASTER_KEY,JSON.stringify(MASTER)); }catch(e){}
        }
      }
    })
    .catch(function(){});
}
function saveMaster(){
  MASTER.dirty=true;
  try{ localStorage.setItem(MASTER_KEY,JSON.stringify(MASTER)); }catch(e){}
}

/* The Forge stores its own cards in its internal shape; map the fields the
   Compendium actually lists rather than reimplementing its schema. */
function mineCards(){
  var out=[];
  try{
    var all=JSON.parse(localStorage.getItem("keter-cardforge-heroes")||"{}");
    for(var k in all){
      var c=all[k]||{};
      out.push({
        name:c.name||k, cardType:c.type||"hero", level:parseInt(c.level,10)||1,
        /* the number is what a printed card is identified by, so it has to be
           here to be sorted, filtered or searched on */
        id:c.num||null, num:c.num||null,

               (c.archetypes||[]).join(" ")].join(" ").toLowerCase();
      if(hay.indexOf(q)===-1) return false;

  var sort=$("cSort").value;
  var RARITY_RANK={common:1,uncommon:2,rare:3,epic:4,legendary:5,mythic:6};
  /* D3-H2 before D3-H10: pad the digit runs so they compare numerically. */
  var numKey=function(v){

function thumbKey(c){

  return "thumb2:"+thumbDPI()+":"+(c._src||"")+":"+(c.name||"")+":"+

/* #4: render at the size the tile is actually painted at, times the device

function thumbDPI(){
  var tile=document.querySelector(".gcard");
  var w=tile?tile.getBoundingClientRect().width:170;
  var dpr=Math.min(window.devicePixelRatio||1,3);
  var dpi=Math.ceil((w*dpr)/2.5/10)*10;

function runThumbs(){

  if(!slot){ thumbBusy=false; return runThumbs(); }
  var key=thumbKey(job.c);
  dbGet(STORE,key).then(function(hit){
    if(hit){ paintThumb(slot,hit); thumbBusy=false; return runThumbs(); }
    return makeThumb(job.c).then(function(url){
      if(url){ dbPut(STORE,url,key).catch(function(){}); paintThumb(slot,url); }
      else slot.textContent="no preview";
      thumbBusy=false; runThumbs();
    });
  }).catch(function(){
    makeThumb(job.c).then(function(url){

        var cv = w.renderToOffscreen(card,forceDPI||thumbDPI(),false);

/* Uses the Forge's own schema exporter where it can, so a promoted card is
   identical to one the Forge would have written out itself. */
/* Everything that leaves the app goes through here, so a card sent to a friend
   is the same file the Forge would have written for it. */
/* Compares what was stored against what is about to be written. A card with no
   effects is fine; a card that HAD effects and lost them is not, and that is
   the failure that shipped blank rules boxes to everyone for months. */
function exportLosses(cards){
  var lost=[];
  cards.forEach(function(c){
    if(!c || !c._raw) return;
    var had=(c._raw.abilities||[]).filter(function(a){
      return (a.text||"").trim() || (a.name||"").trim();
    }).length;
    if(!had) return;
    var out=exportableCard(c);
    var got=(out.entries||[]).filter(function(e){
      return (e.text||"").trim() || (e.name||"").trim();
    }).length;
    if(got<had) lost.push({name:c.name||"Untitled", had:had, got:got});
  });
  return lost;
}
function guardedExport(cards,filename){
  var lost=exportLosses(cards);
  if(lost.length){
    say("Export stopped",
      "<p>These cards would go out with their rules boxes missing, so nothing "+
      "was written:</p><ul>"+
      lost.map(function(x){
        return "<li><b>"+esc(x.name)+"</b> \u2014 "+x.had+" effect"+
               (x.had===1?"":"s")+" stored, "+x.got+" exported</li>";
      }).join("")+"</ul>"+
      "<p>Open the Forge tab once and try again. If it keeps happening, tell "+
      "Claude \u2014 this is the bug that sent blank cards to people.</p>");
    return false;
  }
  exportJSON({schema:"keter.cards/1",cards:cards.map(exportableCard)},filename);
  return true;
}
/* mineCards() returns a summary for the list: no entries, no subtype, no lore.
   It looks enough like a card to be mistaken for one, and has been three times
   — Master promotion, the missing card number, and blank exports. Anything
   that needs a whole card demands the stored original. */
function fullCard(c,where){
  if(!c) throw new Error("fullCard: nothing given ("+where+")");
  if(c._src==="master" || c._src==="design") return stripMeta(c);   /* already schema form */
  if(!c._raw) throw new Error(
    "fullCard: "+(c.name||"a card")+" is a list summary, not a card ("+where+")");
  return forgeToSchema(c._raw);
}
function exportableCard(c){ return fullCard(c,"export"); }
/* The Forge owns the card format. Duplicating its conversion here is what
   would let the two drift apart, so instead the tool is mounted \u2014 invisibly if
   it has not been opened \u2014 and we wait for its bridge. */
function withForge(cb){
  var ready=function(){
    var f=document.querySelector("#v-forge iframe");
    return f && f.contentWindow && f.contentWindow.KETER_BRIDGE &&
           f.contentWindow.KETER_BRIDGE.toSchema;
  };
  if(ready()) return cb(true);
  try{ mountTool("v-forge","p-forge"); }catch(e){}
  var tries=0;
  (function wait(){
    if(ready()) return cb(true);
    if(++tries>40) return cb(false);
    setTimeout(wait,100);
  })();
}
function forgeToSchema(raw){
  try{
    var w=document.querySelector("#v-forge iframe");
    if(w && w.contentWindow && w.contentWindow.KETER_BRIDGE &&
       w.contentWindow.KETER_BRIDGE.toSchema){
      return w.contentWindow.KETER_BRIDGE.toSchema(raw);
    }
  }catch(e){}
  /* Forge not loaded: keep every field rather than a summary. */
  var o={};
  for(var k in raw){ if(k.charAt(0)!=="_") o[k]=raw[k]; }
  return o;
}
function stripMeta(c){
  var o={};
  for(var k in c){ if(k.charAt(0)!=="_") o[k]=c[k]; }
  return o;
}

/* ================= deck builder =================
   Reads cards from the Compendium. Validation is soft throughout: every check
   pings with a Handbook citation, nothing is ever blocked. */
var LOAD_KEY="keter-app-loadouts";
/* Handbook 14.0: Action Cards are never part of the Deck; they are assigned
   to Heroes before combat instead. */
var DECK_TYPES={troop:1,aether:1,equipment:1,command:1};

var NO_ROLE={aether:1,consumable:1};
var loadouts=[], dkMode="list", dkLo=null, dkTeam=null;

/* Handbook 14.0: a Loadout is one Strike Team — up to 3 Heroes, one shared Deck
   of 10 to 60, the Action Cards assigned to each Hero, and one Aether Pouch. */
var BASIC_CHIPS=[1,2,3,4,5,6].map(function(d){
  return {key:"basic|"+d, name:"Basic Chip \u00b7 District "+d, district:String(d),
          basic:true, aetherValue:1, cardType:"sphere"};
});
var MIGRATE_KEY="keter-app-migrate14";
function loadLoadouts(){
  try{ loadouts=JSON.parse(localStorage.getItem(LOAD_KEY)||"[]")||[]; }
  catch(e){ loadouts=[]; }
  /* (v14.21) a Loadout from before the 4-copy limit is trimmed, and kept so */
  var was=JSON.stringify(loadouts);
  loadouts.forEach(function(lo){ if(lo && Array.isArray(lo.heroes) && window.KETER_DEPLOY && KETER_DEPLOY.trim){ lo.deck=lo.deck||[]; lo.pouch=lo.pouch||{}; KETER_DEPLOY.trim(lo); } });
  if(JSON.stringify(loadouts)!==was){ try{ localStorage.setItem(LOAD_KEY,JSON.stringify(loadouts)); }catch(e){} }
}
/* Migration waits until the Deck Builder is shown. Run at startup it happened
   before the card collection had loaded, so it could not tell an Action Card
   from anything else, or name a Hero \u2014 and having marked the Loadouts as
   converted, it would never have tried again. */
function ensureMigrated(){
  var r=migrateLoadouts();
  if(r.changed||r.moved){
    try{
      localStorage.setItem(LOAD_KEY,JSON.stringify(loadouts));
      var prev=JSON.parse(localStorage.getItem(MIGRATE_KEY)||"null")||{moved:0,split:0};
      localStorage.setItem(MIGRATE_KEY,JSON.stringify({moved:prev.moved+r.moved,
        split:prev.split+r.split}));
    }catch(e){}
  }
}
function normaliseLoadout(lo){
  lo.v=2; lo.heroes=lo.heroes||[]; lo.deck=lo.deck||[];
  lo.actions=lo.actions||{}; lo.pouch=lo.pouch||{};
  /* (v14.21) at most 4 copies of a card: a Loadout from before is trimmed */
  if(window.KETER_DEPLOY && KETER_DEPLOY.trim) KETER_DEPLOY.trim(lo);
  return lo;
}
var MAX_COPIES=4;

/* A Loadout made before 14.0 held several Strike Teams of one Hero each. Each
   becomes its own one-Hero Loadout, so nothing is merged; Action Cards come out
   of the Deck, since they can no longer be in it, and every Hero's slots start
   empty for the Player to fill. The cards are not lost — they stay in the
   collection to assign again. */
function migrateLoadouts(){
  var out=[], moved=0, split=0, changed=false;
  function strikeTeam(lo,t,name){
    var deck=[], acts=0;
    ((t&&t.deck)||[]).forEach(function(k){
      var c=resolveRef(k);
      if(c && c.cardType==="action"){ acts++; return; }
      deck.push(k);
    });
    moved+=acts;
    return {v:2, name:name||"Loadout", level:lo.level||1, created:lo.created||Date.now(),
      createdBy:lo.createdBy||null, lastEditedBy:lo.lastEditedBy||null,
      heroes:(t&&t.hero)?[t.hero]:[], deck:deck, actions:{}, pouch:{}};
  }
  loadouts.forEach(function(lo){
    if(!lo) return;
    if(lo.v===2 || (Array.isArray(lo.heroes) && !lo.teams)){
      normaliseLoadout(lo);
      var kept=lo.deck.filter(function(k){
        var c=resolveRef(k); return !(c && c.cardType==="action"); });
      moved+=lo.deck.length-kept.length;
      lo.deck=kept;
      out.push(lo); return;
    }
    changed=true;
    var teams=lo.teams||[];
    if(teams.length<=1){ out.push(strikeTeam(lo,teams[0],lo.name)); return; }
    split++;
    teams.forEach(function(t,i){
      var h=t&&t.hero?resolveRef(t.hero):null;
      out.push(strikeTeam(lo,t,(lo.name||"Loadout")+" \u2014 "+(h?h.name:"Team "+(i+1))));
    });
  });
  loadouts=out;
  return {changed:changed, moved:moved, split:split};
}
function loHeroes(lo){ return ((lo&&lo.heroes)||[]).map(resolveRef).filter(Boolean); }
function loDeckCards(lo){ return ((lo&&lo.deck)||[]).map(resolveRef).filter(Boolean); }
function actionSlotsOf(h){ return h?Math.max(0,parseInt((h.stats||{}).slots,10)||0):0; }
function aetherCostOf(c){
  var a=(c&&c.aetherCost)||{};
  return (parseInt(a.generic,10)||0)+(parseInt(a.affinity,10)||0)+(parseInt(a.affinity2,10)||0);
}
/* Handbook 14.0: the Pouch must hold at least as many Chips as the full cost of
   the most expensive card in the Deck. */
function pouchMinimum(lo){
  return loDeckCards(lo).reduce(function(m,c){ return Math.max(m,aetherCostLeast(c)); },0);
}
/* v13.4 (Handbook 15.8): X is at least 1, so a slot of X counts 1, XX 2, XXX 3 */
function aetherCostLeast(c){
  var a=(typeof simCostOf==="function" && c) ? Object.assign({}, (c.aetherCost||{}), simCostOf(c)) : ((c&&c.aetherCost)||{});
  var slot=function(v){ var m=/^X{1,3}$/i.exec(String(v==null?"":v).trim()); return m?m[0].length:(parseInt(v,10)||0); };
  return slot(a.generic)+slot(a.affinity)+slot(a.affinity2);
}
function chipByKey(k){
  var b=BASIC_CHIPS.filter(function(x){ return x.key===k; })[0];
  return b||resolveRef(k);
}
function pouchEntries(lo){
  var p=(lo&&lo.pouch)||{}, out=[];
  Object.keys(p).forEach(function(k){

function pouchCount(lo){ return pouchEntries(lo).reduce(function(a,e){ return a+e.qty; },0); }

function assignedActionCards(lo){
  var out=[], a=(lo&&lo.actions)||{};
  Object.keys(a).forEach(function(k){ (a[k]||[]).forEach(function(r){
    var c=resolveRef(r); if(c) out.push(c); }); });

}
function useCostLabel(c){

      /x/i.test(String(ac.generic||"")+String(ac.affinity||"")+String(ac.affinity2||""));
    var hasE=((c&&(c.entries||c.abilities))||[]).some(function(e){
      return String(e.energyCost||e.cost||"").trim(); });

function saveLoadouts(){

function refKey(c){ return (c._src||"master")+"|"+(c.name||""); }
function resolveRef(k){
  var all=allCards();
  for(var i=0;i<all.length;i++) if(refKey(all[i])===k) return all[i];
  return null;
}
function heroOf(t){ return t.hero?resolveRef(t.hero):null; }
function deckCards(t){
  return (t.deck||[]).map(resolveRef).filter(Boolean);
}
function ldrOf(h){ return h?(parseInt((h.stats||{}).ldr,10)||0):0; }
function slotsOf(c){ return parseInt((c.stats||{}).slots2||(c.stats||{}).unitSlots||(c.stats||{}).uslots,10)||1; }

/* ---- validation ---- */
/* kept for anything still asking about a single team; a Strike Team is the
   whole Loadout now, so the answer is the same */
function pingsForTeam(t,lo){ return pingsForLoadout(lo); }
/* Every check cites the Handbook section behind it, and none of them block:
   the Deck Builder says what the rules say and leaves the decision to you. */
function pingsForLoadout(lo){
  normaliseLoadout(lo);
  var out=[], heroes=loHeroes(lo), deck=loDeckCards(lo), n=deck.length;
  if(!heroes.length)
    out.push(["bad","This Strike Team has no Hero. It needs at least one to lead a Combat.",
      "Handbook 14.0 - Section 7, Deployment Rules"]);
  if((lo.heroes||[]).length>3)
    out.push(["bad","A Strike Team holds up to 3 Heroes.","Handbook 14.0 - Section 7"]);
  if(n<10||n>60)
    out.push(["bad","The Deck holds "+n+" card"+(n===1?"":"s")+". A Deck is 10 to 60.",
      "Handbook 14.0 - Section 6, Decks"]);
  var acts=deck.filter(function(c){ return c.cardType==="action"; });
  if(acts.length)
    out.push(["bad",acts.length+" Action Card"+(acts.length===1?" is":"s are")+
      " in the Deck. Action Cards are never part of it \u2014 assign them to a Hero instead.",
      "Handbook 14.0 - Section 3, Action Cards"]);
  heroes.forEach(function(h){
    var got=(lo.actions[refKey(h)]||[]).length, cap=actionSlotsOf(h);
    if(got>cap)
      out.push(["bad",h.name+" carries "+got+" Action Cards but has "+cap+" Action Slot"+
        (cap===1?"":"s")+".","Handbook 14.0 - Section 3, Action Cards"]);
  });
  var need=pouchMinimum(lo), have=pouchCount(lo);
  if(need && have<need)
    out.push(["bad","The Aether Pouch holds "+have+" chip"+(have===1?"":"s")+
      ". The most expensive card in the Deck costs "+need+", so it needs at least "+need+".",
      "Handbook 14.0 - Section 6, The Aether Pouch"]);
  /* cards that need a District's Aether, with no chip of that District to pay */
  var needD={}, haveD={};
  deck.concat(assignedActionCards(lo)).forEach(function(c){
    var ac=c.aetherCost||{}, affs=c.affinities||[];
    if((parseInt(ac.affinity,10)||0)>0 && affs[0] && affs[0].district && affs[0].district!=="any" && affs[0].district!=="neu")
      needD[affs[0].district]=(needD[affs[0].district]||0)+1;
    if((parseInt(ac.affinity2,10)||0)>0 && affs[1] && affs[1].district && affs[1].district!=="any" && affs[1].district!=="neu")
      needD[affs[1].district]=(needD[affs[1].district]||0)+1;
  });
  pouchEntries(lo).forEach(function(e){ var d=chipDistrictOf(e.chip); if(d) haveD[d]=1; });
  Object.keys(needD).sort().forEach(function(d){
    if(!haveD[d])
      out.push(["warn",needD[d]+" card"+(needD[d]===1?" needs":"s need")+" District "+d+
        " Aether, but the Pouch holds no District "+d+" chip, so "+(needD[d]===1?"it":"they")+
        " cannot be paid for.","Handbook 14.0 - Section 6, District matching"]);
  });
  if(heroes.length){
    var ldr=heroes.reduce(function(a,h){ return a+ldrOf(h); },0);
    out.push(["info","Pooled Leadership "+ldr+": up to "+ldr+" Unit Slots of Troops can start a "+
      "Combat, chosen from the Deck before it begins. Only the Heroes who enter add theirs.",
      "Handbook 14.0 - Section 3, Leadership"]);
  }
  if(heroes.length===1)

      "Handbook 14.0 - Section 7, Losing a Combat",true]);

}
function pingHTML(list){

/* ---- rendering ---- */
/* (v14.20) A first Strike Team, one step at a time: with no Loadout yet, the

   needs before Next goes on; the Deck and the Pouch can be suggested, from

var GUIDE=[
  {id:"name", mode:"loadout", title:"Name it", text:"A Strike Team is up to 3 Heroes, one Deck they share, the Action Cards each Hero carries, and an Aether Pouch. First, give it a name in the box below. You can rename it at any time."},
  {id:"heroes", mode:"loadout", title:"Choose its Heroes", text:"Tap Add Hero. One is enough to begin; up to 3 share the Deck. The free Heroes can lead a deployment from the start; others are recruited at the dock."},
  {id:"deck", mode:"deck", title:"Fill its Deck", text:"The Deck is 10 to 60 Troop, Equipment, Command and Aether Cards. Tap Add cards. Common cards are free to take on a deployment. Suggest a Deck fills it with Common cards to start."},
  {id:"actions", mode:"loadout", title:"Give out Action Cards", text:"Tap a Hero to give it Action Cards, up to its Action Slots: they are its own Actions in a fight, never in the Deck. This step can be skipped."},
  {id:"pouch", mode:"pouch", title:"Fill its Pouch", text:"The Pouch holds the Chips that make Aether to play cards. It needs at least as many as the Deck's most expensive card costs. Suggest a Pouch fills it with Basic Chips of the Deck's Districts."},
  {id:"review", mode:"loadout", title:"Look it over", text:"What the rules say about the team, and its Player Level. Tap Finish: the team is ready for practice fights and, with recruited or free Heroes, for a deployment."}];
function guideNeeds(step, lo){
  var id=GUIDE[step].id;
  if(id==="name" && !String(lo.name||"").trim()) return "Give it a name first.";
  if(id==="heroes" && !loHeroes(lo).length) return "Add at least one Hero.";
  if(id==="deck"){ var n=(lo.deck||[]).length; if(n<10) return "The Deck needs at least 10 cards (it has "+n+")."; if(n>60) return "The Deck holds at most 60 cards (it has "+n+")."; }
  if(id==="pouch"){ var have=pouchCount(lo), need=Math.max(1,pouchMinimum(lo)); if(have<need) return "The Pouch needs at least "+need+" Chip"+(need===1?"":"s")+" (it has "+have+")."; }
  return "";
}
function guideCommon(c){ return c && c._src!=="design" && c._src!=="prebuilt" && !isToken(c) && (!window.KETER_DOCK || KETER_DOCK.heroRarity(c)===0); }
/* Fills the Deck to 20 with Common cards: Troops first, two copies each, those of the Heroes' Districts before the rest */
function guideSuggestDeck(lo){
  var homes={}; loHeroes(lo).forEach(function(h){ homes[districtOf(h)]=1; });
  function pick(types){
    var cs=allCards().filter(function(c){ return types.indexOf(c.cardType)>=0 && guideCommon(c); });
    var real=cs.filter(function(c){ return !/^Test /.test(String(c.name||"")); }); if(real.length) cs=real;
    return cs.sort(function(a,b){ var ha=!!homes[districtOf(a)], hb=!!homes[districtOf(b)]; return ha!==hb?(ha?-1:1):(a.name<b.name?-1:a.name>b.name?1:0); });
  }
  var added=0, list=pick(["troop"]).slice(0,4).concat(pick(["equipment","command","aether"]));
  list.forEach(function(c){ var room=20-lo.deck.length, k=refKey(c); if(room<=0 || lo.deck.indexOf(k)>=0) return;
    for(var i=0;i<Math.min(2,room);i++){ lo.deck.push(k); added++; } });
  return added;
}
/* Fills the Pouch with Basic Chips, split by the Districts of the Deck's cards, to what it needs and at least 10 */
function guideSuggestPouch(lo){
  var want=Math.max(10,pouchMinimum(lo))-pouchCount(lo); if(want<=0) return 0;
  var by={}; loDeckCards(lo).forEach(function(c){ var d=districtOf(c); if(/^[1-6]$/.test(d)) by[d]=(by[d]||0)+1; });
  loHeroes(lo).forEach(function(h){ var d=districtOf(h); if(/^[1-6]$/.test(d) && !by[d]) by[d]=1; });
  if(!Object.keys(by).length) by["1"]=1;
  var ds=Object.keys(by).sort(function(a,b){ return by[a]!==by[b]?by[b]-by[a]:(a<b?-1:1); }), total=ds.reduce(function(t,d){ return t+by[d]; },0), given=0;
  ds.forEach(function(d,i){ var n=i===ds.length-1?want-given:Math.round(want*by[d]/total); n=Math.max(0,Math.min(n,want-given));
    if(n>0){ var key="basic|"+d; lo.pouch[key]=(parseInt(lo.pouch[key],10)||0)+n; given+=n; } });
  return given;
}
function guideHTML(lo){
  var dkGuide=curGuide(), st=GUIDE[dkGuide], need=guideNeeds(dkGuide, lo), last=dkGuide===GUIDE.length-1;
  var extra={deck:"Suggest a Deck", pouch:"Suggest a Pouch"}[st.id];
  return '<div class="dkguide" style="margin:10px 12px;padding:11px 12px;border:2px solid var(--gold,#f0bd57);border-radius:6px;font-size:12.5px;line-height:1.6;">'+
    '<b style="color:var(--gold,#f0bd57);font-size:14px;">Step '+(dkGuide+1)+' of '+GUIDE.length+' · '+esc(st.title)+'</b><div>'+esc(st.text)+'</div>'+
    (need?'<div class="dkguideneed" style="color:var(--danger);margin-top:4px;">'+esc(need)+'</div>':'')+
    '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">'+
    '<button class="ghost" data-guide="back"'+(dkGuide===0?' disabled':'')+'>‹ Back</button>'+
    (extra?'<button class="ghost" data-guide="suggest">'+extra+'</button>':'')+
    '<button data-guide="next" style="margin-left:auto;"'+(need?' disabled':'')+'>'+(last?'Finish':'Next ›')+'</button></div></div>';
}
function startGuide(){
  loadouts.push(normaliseLoadout({name:"Strike Team",level:1,created:Date.now(),
    createdBy:userName()||null,lastEditedBy:userName()||null, guide:0}));
  saveLoadouts(); dkLo=loadouts.length-1; dkMode=GUIDE[0].mode;
}
function guideAct(a){
  var lo=loadouts[dkLo], at=curGuide(); if(at<0 || !lo) return;
  normaliseLoadout(lo);
  if(a==="suggest"){ var id=GUIDE[at].id; if(id==="deck") guideSuggestDeck(lo); if(id==="pouch") guideSuggestPouch(lo); saveLoadouts(); renderDeck(); return; }
  if(a==="next" && guideNeeds(at, lo)) return;
  var to=at+(a==="next"?1:-1);
  if(to>=GUIDE.length){ delete lo.guide; saveLoadouts(); dkMode="loadout"; renderDeck(); return; }
  lo.guide=Math.max(0,to); saveLoadouts(); dkMode=GUIDE[lo.guide].mode; renderDeck();
}
function renderDeck(){
  ensureMigrated();
  if(dkMode==="list" && !loadouts.length) startGuide();
  var r=renderDeckPage();
  if(curGuide()>=0) $("dkbody").insertAdjacentHTML("afterbegin", guideHTML(loadouts[dkLo]));
  return r;
}
function renderDeckPage(){
  var body=$("dkbody");
  $("dkBack").style.display = dkMode==="list" ? "none" : "";
  $("dkAdd").style.display = (dkMode==="list"||dkMode==="loadout") ? "" : "none";
  if(dkMode==="list") return renderLoadoutList(body);
  /* v12.8: a Strike Team out on a deployment waits at the dock */
  if(dkLo!==null && loadouts[dkLo] && window.KETER_DEPLOY && KETER_DEPLOY.lockedLoadout(loadouts[dkLo])) return renderLockedLoadout(body, loadouts[dkLo]);
  if(dkMode==="loadout") return renderLoadout(body);
  if(dkMode==="deck") return renderDeckView(body);
  if(dkMode==="actions") return renderHeroActions(body);
  if(dkMode==="pouch") return renderPouch(body);
  dkMode="loadout"; return renderLoadout(body);
}

function meterHTML(label,val,max,cls,note){
  var pct=max?Math.min(100,Math.round(val/max*100)):0;
  return '<div class="meter"><div class="lab"><span>'+esc(label)+"</span><span>"+
    esc(note||"")+'</span></div><div class="bar"><div class="fill '+cls+'" style="width:'+pct+'%"></div></div></div>';
}
function curveHTML(deck){
  var buckets=[0,0,0,0,0,0,0,0];      /* 0-5, 6+, then X */
  deck.forEach(function(c){
    var k=cost(c);
    if(k<0) buckets[7]++;
    else buckets[Math.min(6,k)]++;
  });
  var max=Math.max.apply(null,buckets)||1;
  return '<div class="curve">'+buckets.map(function(v,i){
    return '<div style="height:'+Math.max(4,Math.round(v/max*100))+'%">'+
      (v?"<b>"+v+"</b>":"")+"<span>"+(i===6?"6+":(i===7?"X":i))+"</span></div>";
  }).join("")+"</div>";
}

/* iOS Safari does not honour the download attribute on blob URLs, so every
   export in this app silently failed there. Share sheet first, then a data URL
   in a new tab, then the ordinary download for everyone else. */
function isiOS(){
  return /iP(hone|ad|od)/.test(navigator.platform) ||
         (navigator.userAgent.indexOf("Mac")!==-1 && "ontouchend" in document) ||
         /iP(hone|ad|od)/.test(navigator.userAgent);
}
function saveBlob(text,filename,mime){
  mime=mime||"application/json";
  var blob=new Blob([text],{type:mime});

  if(isiOS() && navigator.canShare && navigator.share){
    try{
      var file=new File([blob],filename,{type:mime});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:filename}).catch(function(){
          fallbackSave(text,filename,mime);
        });
        return;
      }
    }catch(e){}
  }

  var a=document.createElement("a");
  var supportsDownload = "download" in a;
  if(!supportsDownload || isiOS()){ fallbackSave(text,filename,mime); return; }

  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
function fallbackSave(text,filename,mime){
  var url="data:"+(mime||"application/json")+";charset=utf-8,"+encodeURIComponent(text);
  var w=window.open(url,"_blank");
  say("Saving on iPhone",
    "<p>Safari will not download files straight to disk, so <b>"+esc(filename)+
    "</b> has opened in a new tab.</p>"+
    "<p>Tap <b>Share</b> and then <b>Save to Files</b> to keep it. If nothing opened, "+
    "your browser blocked the tab \u2014 allow pop-ups and try again.</p>"+
    (w?"":"<p style=\"color:var(--danger);\">The tab was blocked.</p>"));
}

/* ================= backup ================= */
$("expAll").addEventListener("click",function(){
  var bag={app:"KETER Companion",v:"__VER__",at:new Date().toISOString(),data:{}};
  var found=0;
  for(var i=0;i<KEYS.length;i++){
    var val=null;
    try{ val=localStorage.getItem(KEYS[i]); }catch(e){}
    if(val!==null){ bag.data[KEYS[i]]=val; found++; }
  }
  if(!found){ say("Nothing to back up","<p>No saved KETER data found in this browser yet. Make a card or a room first.</p>"); return; }
  saveBlob(JSON.stringify(bag),
           userSlug()+"KETER_backup_"+new Date().toISOString().slice(0,10)+".json");
});
$("impAll").addEventListener("click",function(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.addEventListener("change",function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var bag=JSON.parse(r.result);
        if(!bag||!bag.data) throw 0;
        var n=0;
        for(var k in bag.data){
          if(KEYS.indexOf(k)===-1) continue;
          localStorage.setItem(k,bag.data[k]); n++;
        }
        say("Backup restored","<p>Restored <b>"+n+"</b> data sets. Close and reopen the app so the tools reload with the restored data.</p>");
      }catch(e){
        say("Could not read that file","<p>It doesn't look like a KETER backup. Pick the .json file produced by Export backup.</p>");
      }
    };
    r.readAsText(f);
  });
  inp.click();
});

/* ================= action log =================
   A ring buffer of what was pressed and what changed, capped by count rather
   than time. Most of this project's bugs did not throw anything — the shape
   tool ran correct-looking code and simply used the wrong value — so an error
   log alone would have caught almost none of them. What diagnoses those is the
   sequence of actions and the values they produced. */
var LOG=[], LOG_MAX=200;
function logEvent(kind, text, extra){
  LOG.push({t:Date.now(), kind:kind, text:String(text).slice(0,160),
            extra:extra===undefined?null:String(extra).slice(0,160)});

         (label?' "'+label+'"':"");
}

/* What was true at the moment of reporting. Deliberately includes the card or
   map being worked on: nearly every bug this project has had was specific to
   one card's shape, and a report without it is a description of a symptom. */
function bugSnapshot(){
  var L=[];
  function line(k,v){ L.push(k+": "+v); }
  line("app", (typeof APP_VER!=="undefined"?APP_VER:"") ||
              (document.querySelector(".ver")||{}).innerText||"?");
  line("page", cur);
  line("when", new Date().toISOString());
  line("screen", innerWidth+"x"+innerHeight+" dpr"+(window.devicePixelRatio||1));
  line("ua", navigator.userAgent.slice(0,110));
  line("dev mode", isDev()?"on":"off");
  try{
    var mine=mineCards();
    line("my cards", mine.length);
    line("master cards", (MASTER.cards||[]).length);
  }catch(e){ line("cards", "unreadable: "+e.message); }
  try{
    var used=JSON.stringify(localStorage).length;
    line("storage", Math.round(used/1024)+" KB");
  }catch(e){ line("storage","unreadable"); }

  /* whatever the tools can tell us about themselves */
  ["forge","poi"].forEach(function(id){
    try{
      var f=document.querySelector("#v-"+id+" iframe");
      if(!f||!f.contentWindow) return;
      var w=f.contentWindow;
      if(id==="forge" && w.KETER_BRIDGE && w.KETER_BRIDGE.currentCard){
        var c=w.KETER_BRIDGE.currentCard();
        line("forge card", (c.name||"untitled")+" ["+c.type+"]"+
             " entries="+((c.abilities||[]).length)+
             " sub="+(c.subtype||"-")+" num="+(c.num||"-"));
      }
      if(id==="poi" && w.KETER_POI && w.KETER_POI.S){
        var S2=w.KETER_POI.S;
        line("sandbox", "tool="+S2.tool+" shape="+S2.shape+
             " mirror="+(S2.mirror&&S2.mirror.on?("on axis "+S2.mirror.axis+
               (S2.mirror.pivot?" pivot "+S2.mirror.pivot.q+","+S2.mirror.pivot.r:" no pivot")):"off")+
             " hexes="+(S2.hexes?S2.hexes.size:"?")+
             " zoom="+Math.round((S2.zoom||1)*100)+"%");
      }
    }catch(e){ line(id, "unreadable: "+e.message); }
  });
  return L.join("\n");
}
try{ window.LOG=LOG; window.logEvent=logEvent; window.bugReportText=bugReportText; }catch(e){}
function bugReportText(){
  var errs=LOG.filter(function(e){ return e.kind==="ERROR"; });
  var out=["KETER bug report","================","",bugSnapshot(),""];
  out.push("errors captured: "+errs.length);
  errs.slice(-12).forEach(function(e){
    out.push("  ! "+e.text+(e.extra?("  ("+e.extra+")"):""));
  });
  out.push("");
  out.push("last "+LOG.length+" actions, oldest first:");
  var t0=LOG.length?LOG[0].t:Date.now();
  LOG.forEach(function(e){
    var secs=((e.t-t0)/1000).toFixed(1);
    out.push("  +"+secs+"s "+e.kind+"  "+e.text+(e.extra!==null?("  = "+e.extra):""));
  });
  return out.join("\n");
}

/* ================= updates =================
   version.json is always fetched with no-store, and the service worker never
   treats a cached index.html as fresh. That combination is what stops GitHub
   Pages' ten-minute cache header from pinning the app on an old build. */
var APP_VER="__VER__".replace(/^v/,"");
try{ window.KETER_APP_VER=APP_VER; }catch(e){}
var latestVer=null, lastCheck=null, checkErr=null;

function fetchVersion(){
  /* A standalone file copy has no origin to fetch from; say so rather than
     failing noisily. */
  if(location.protocol==="file:"){
    checkErr="this is the standalone file copy, not the published app";
    lastCheck=new Date();
    return Promise.resolve(null);
  }
  return fetch("version.json?_="+Date.now(),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){
      latestVer=String(j.version||"").replace(/^v/,"");
      lastCheck=new Date();
      checkErr=null;
      return latestVer;
    })
    .catch(function(e){
      checkErr=e.message||"unreachable";
      lastCheck=new Date();
      return null;
    });
}
function updateAvailable(){ return latestVer && latestVer!==APP_VER; }
function paintUpdateBadge(){
  var b=$("updBtn");
  if(b) b.classList.toggle("has",!!updateAvailable());
}
function applyUpdate(){
  return caches.keys()
    .then(function(keys){ return Promise.all(keys.map(function(k){ return caches.delete(k); })); })
    .catch(function(){})
    .then(function(){
      if(!navigator.serviceWorker||!navigator.serviceWorker.getRegistration) return;
      return navigator.serviceWorker.getRegistration().then(function(r){ return r&&r.update(); });
    })
    .catch(function(){})
    .then(function(){ location.reload(); });
}
function repairApp(){
  return caches.keys()
    .then(function(keys){ return Promise.all(keys.map(function(k){ return caches.delete(k); })); })
    .catch(function(){})
    .then(function(){
      if(!navigator.serviceWorker||!navigator.serviceWorker.getRegistrations) return;
      return navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      });
    })
    .catch(function(){})
    .then(function(){ location.reload(); });
}
function updatePanel(){
  var rows="<p><b>Installed</b> \u00b7 v"+esc(APP_VER)+"</p>";
  if(checkErr){
    rows+="<p><b>Available</b> \u00b7 could not check ("+esc(checkErr)+")</p>"+
      "<p>If you are offline that is expected. If you are online and this persists, the published copy may not include <code>version.json</code>.</p>";
  }else if(latestVer==null){
    rows+="<p><b>Available</b> \u00b7 checking\u2026</p>";
  }else if(updateAvailable()){
    rows+="<p><b>Available</b> \u00b7 v"+esc(latestVer)+"</p>"+
      "<p>Updating clears the offline copy and reloads. Your saved cards and maps are not touched.</p>"+
      '<button class="ghost" id="doUpdate" style="margin-right:8px;">Update now</button>';
  }else{
    rows+="<p><b>Available</b> \u00b7 v"+esc(latestVer)+" \u2014 you are up to date.</p>";
  }
  if(lastCheck) rows+="<p style=\"font-size:11px;\">Last checked "+lastCheck.toLocaleTimeString()+"</p>";
  if(isDev()){
    rows+="<hr style=\"border:0;border-top:1px solid var(--line);margin:14px 0;\">"+
      "<p><b>Repair</b> \u2014 removes the service worker and every cache, then reloads. "+
      "Saved cards, maps and restore points are left alone. Use this instead of reinstalling.</p>"+
      '<button class="ghost" id="doRepair" style="color:#e0b34d;border-color:#6a5324;">Force refresh</button>';
  }
  say("Updates",rows);
}
$("updBtn").addEventListener("click",function(){
  updatePanel();
  fetchVersion().then(function(){ paintUpdateBadge(); updatePanel(); });
});
document.addEventListener("click",function(e){
  if(!e.target||!e.target.id) return;
  if(e.target.id==="doUpdate"){ e.target.textContent="Updating\u2026"; applyUpdate(); }
  if(e.target.id==="doRepair"){ e.target.textContent="Repairing\u2026"; repairApp(); }
});

function sha256(txt){
  if(!window.crypto||!crypto.subtle) return Promise.resolve(null);
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt))
    .then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf),function(b){
        return ("0"+b.toString(16)).slice(-2);
      }).join("");
    });
}

     published sidecars keep their exact names, since the app fetches those. */

/* v14.15: a file exported from the game's Sandbox carries its chassis beside
   its cards. They join the Chassis library (one of the same id is replaced);
   the cards then go through the import review as any others do. */
function sandboxExtras(j){
  var n=0;
  try{
    if(j && Array.isArray(j.chassis) && window.KETER_CHASSIS){
      j.chassis.forEach(function(c){ if(c && c.id && c.name){ var o=JSON.parse(JSON.stringify(c)); Object.keys(o).forEach(function(k){ if(k.charAt(0)==="_") delete o[k]; }); window.KETER_CHASSIS.put(window.KETER_CHASSIS.upgrade(o)); n++; } });
    }
  }catch(e){}
  /* (v14.17) and its pictures, into the Pixel Studio's library by id (the cards that wear them say so) */
  try{
    if(j && j.pictures && typeof j.pictures==="object" && window.KETER_PX){
      var list=Object.keys(j.pictures).filter(function(id){ var q=j.pictures[id]; return q && q.w && q.h && Array.isArray(q.frames); })
        .map(function(id){ var q=JSON.parse(JSON.stringify(j.pictures[id])); return [id, q]; });
      if(list.length && window.KETER_PX.putMany(list)) n+=list.length;
    }
  }catch(e){}
  /* (v14.16) and its floors, into the Sandbox's levels by name (one of the same name is replaced) */
  try{
    if(j && Array.isArray(j.floors) && j.floors.length){
      var all=JSON.parse(localStorage.getItem("keter-hexmap-levels")||"{}")||{}, m=0;
      j.floors.forEach(function(f){ if(f && f.name && Array.isArray(f.hexes)){ var o=JSON.parse(JSON.stringify(f)); Object.keys(o).forEach(function(k){ if(k.charAt(0)==="_") delete o[k]; }); all[o.name]=o; m++; } });
      if(m){ localStorage.setItem("keter-hexmap-levels",JSON.stringify(all)); n+=m; }
    }
  }catch(e){}
  return n;
}

/* Import review: every card is shown with an accept or skip choice before it
   touches the Master. */
var reviewList=null, reviewPick=null;
/* The review used to show a name and a one-line summary, which looks the same
   whether a card carries its rules or not. That is exactly how months of
   hollow cards went unnoticed, so the review now reports contents and shows
   the card itself. */
function cardContents(c){
  var bits=[];
  var entries=(c.entries||c.abilities||[]).filter(function(e){
    return (e.text||"").trim() || (e.name||"").trim();
  });
  bits.push(entries.length ? (entries.length+" effect"+(entries.length===1?"":"s"))
                           : "no effects");
  if(c.subtype) bits.push("subtype "+c.subtype);
  if((c.archetypes||c.arches||[]).length)
    bits.push((c.archetypes||c.arches).join(" / "));
  if(c.lore||c.loreText) bits.push("lore");
  if(c.id||c.num) bits.push(String(c.id||c.num));
  var stats=Object.keys(c.stats||c.baseStats||{}).filter(function(k){
    return String((c.stats||c.baseStats)[k]||"").trim()!==""; });
  if(stats.length) bits.push(stats.length+" stats");
  return bits.join(" \u00b7 ");
}
/* A card type that normally carries rules text but arrives with none is the
   signature of a file written before v5.6, when exports saved a summary. */
function looksStripped(c){
  var expects={hero:1,troop:1,enemy:1,action:1,command:1,boss:1,miniboss:1};
  if(!expects[c.cardType]) return false;
  var entries=(c.entries||c.abilities||[]).filter(function(e){
    return (e.text||"").trim() || (e.name||"").trim();
  });
  return entries.length===0;
}

function reviewImport(cards,label){
  reviewList=cards;
  reviewPick=cards.map(function(){ return true; });
  paintReview(label);
}
function paintReview(label){
  var have={};
  (MASTER.cards||[]).forEach(function(c){ have[(c.name||"").toLowerCase()]=1; });
  var suspect=reviewList.filter(looksStripped).length;
  var rows=reviewList.map(function(c,i){
    var dup=have[(c.name||"").toLowerCase()];
    var bad=looksStripped(c);
    return '<label style="display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);">'+
      '<input type="checkbox" data-rv="'+i+'"'+(reviewPick[i]?" checked":"")+
      ' style="margin-top:3px;width:18px;height:18px;">'+
      '<span style="flex:1;min-width:0;"><b style="color:var(--text);display:block;">'+esc(c.name||"Untitled")+"</b>"+
      '<i style="font-style:normal;font-size:11px;color:var(--dim);display:block;">'+esc(cardLine(c))+
      (dup?' \u00b7 <span style="color:#e0b34d;">already in Master</span>':"")+"</i>"+
      '<i style="font-style:normal;font-size:11px;display:block;color:'+
        (bad?"var(--danger)":"var(--cyan)")+';">'+esc(cardContents(c))+
        (bad?" \u2014 this card has no rules text":"")+"</i>"+
      '<span class="rvshot" data-shot="'+i+'"></span>'+
      "</span></label>";
  }).join("");
  say("Review "+reviewList.length+" cards",
    "<p>From "+esc(label)+". Untick anything you do not want in the Master Schema.</p>"+
    (suspect ? '<p style="color:var(--danger);"><b>'+suspect+" card"+(suspect===1?" has":"s have")+
      " no rules text.</b> That is what a file written before v5.6 looks like \u2014 "+
      "those exports saved a summary instead of the card. Ask for it to be sent "+
      "again from an updated app rather than importing these.</p>" : "")+
    '<div style="max-height:42vh;overflow:auto;margin-bottom:12px;">'+rows+"</div>"+
    '<button class="ghost" id="rvAdd" style="margin-right:8px;">Add selected</button>'+
    '<button class="ghost" id="rvNone">Cancel</button>');
  paintReviewShots();
}
/* Draws each incoming card with the Forge's own renderer: if the rules box is
   empty, you see an empty rules box. */
try{ window.reviewImport=reviewImport; window.cardContents=cardContents;
      window.looksStripped=looksStripped; }catch(e){}
function paintReviewShots(){
  var slots=[].slice.call(document.querySelectorAll(".rvshot"));
  slots.forEach(function(slot){
    var i=+slot.getAttribute("data-shot");
    var c=reviewList[i];
    if(!c) return;
    /* no _raw on an import, so makeThumb routes it through fromSchema — the
       same path the card would take when opened in the Forge */
    makeThumb(c,150).then(function(url){
      if(url) slot.innerHTML='<img src="'+url+'" alt="" style="width:104px;'+
        'border-radius:4px;margin-top:7px;display:block;">';
    }).catch(function(){});
  });
}

function pickCards(kind){
  if(kind===true) kind="hero";
  if(kind!=="hero"&&kind!=="action") kind="deck";
  var lo=normaliseLoadout(loadouts[dkLo]);
  var forHero=kind==="hero";

    if(kind==="hero") return c.cardType==="hero" && lo.heroes.indexOf(refKey(c))<0;
    if(kind==="action") return c.cardType==="action";
    return DECK_TYPES[c.cardType];
  });
  if(!pool.length){
    say(forHero?"No Heroes yet":"No deck cards yet",
      "<p>"+(forHero
        ? "Build a Hero in the Forge, or publish some in the Master Schema, and they will appear here."
        : kind==="action" ? "No Action Cards yet \u2014 build some in the Forge first."
        : "A Deck holds Troop, Aether, Equipment and Command cards. None exist yet \u2014 build some in the Forge first.")+"</p>");
    return;
  }
  var rows=pool.map(function(c,i){
    return '<div class="dkrow" data-pick="'+i+'" style="border-color:var(--line);"><div class="m"><b>'+
      esc(c.name||"Untitled")+"</b><i>"+esc(cardLine(c))+"</i></div>"+
      '<span class="qty">+</span></div>';

  say(forHero?"Add a Hero":kind==="action"?"Assign an Action Card":"Add cards",
    '<input id="pkq" placeholder="Search" style="width:100%;padding:9px;font-size:16px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:3px;margin-bottom:10px;">'+
    '<div id="pkList" style="max-height:52vh;overflow:auto;margin:0 -18px;">'+rows+"</div>"+
    (kind==="deck"?"<p style=\"font-size:11px;margin-top:10px;\">Tap a card to add a copy. Duplicates are allowed.</p>":""));
  window._pool=pool; window._pickHero=forHero; window._pickKind=kind;
  var q=$("pkq");
  if(q) q.addEventListener("input",function(){
    var v=q.value.toLowerCase();
    document.querySelectorAll("#pkList [data-pick]").forEach(function(el){
      var c=pool[+el.getAttribute("data-pick")];

                         (c.cardType||"").indexOf(v)===-1 ? "none" : "";
    });
  });
}

      saveLoadouts(); renderDeck();

/* ================= keyboard =================
   Desktop expects Escape to back out of whatever is on top, and it is the
   fastest way out of the full-screen section editor. */
function topLayerClose(){
  if($("edWrap") && $("edWrap").classList.contains("on")){ closeEditor(); return true; }
  if($("modal").classList.contains("on")){ $("modal").classList.remove("on"); return true; }
  if($("kwbox").classList.contains("on")){ $("kwbox").classList.remove("on"); return true; }
  if($("toc").classList.contains("on")){ $("toc").classList.remove("on"); return true; }
  if($("cfilters") && $("cfilters").classList.contains("on")){
    $("cfilters").classList.remove("on"); return true;
  }
  /* a sheet or panel open inside a tool iframe */
  var f = cur==="forge" ? loaded["v-forge"] : (cur==="poi" ? loaded["v-poi"] : null);
  if(f && f.contentDocument){
    var sheet=f.contentDocument.getElementById("keter-sheet");
    if(sheet && sheet.classList.contains("on")){ sheet.classList.remove("on"); return true; }
  }
  return false;
}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ if(topLayerClose()) e.preventDefault(); return; }
  /* Ctrl+S in the editor saves the section rather than the page */
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){
    if($("edWrap") && $("edWrap").classList.contains("on")){
      e.preventDefault(); saveEditor();
    }
  }
});

/* service worker: only when hosted over http(s); a file:// copy skips it */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){
      var nw=reg.installing;
      if(!nw) return;
      nw.addEventListener("statechange",function(){
        if(nw.state==="installed" && navigator.serviceWorker.controller){
          say("Update ready","<p>A newer version of the app has downloaded.</p>"+
              '<button class="ghost" id="doReload" style="margin-right:8px;">Reload now</button>');
        }
      });
    });
  }).catch(function(){});
}
document.addEventListener("click",function(e){
  if(e.target && e.target.id==="doReload") location.reload();
});

/* The Handbook revision stays on Home: it says which rules a card was built
   against. It is read from the document, so it cannot go stale the way the
   hardcoded tool versions did. */
(function(){
  var el=document.getElementById("hbVer");
  if(!el) return;
  var hb=DOCS.filter(function(d){ return d.id==="hb"; })[0];
  el.innerHTML = hb ? ("Player Handbook "+esc(hb.ver)+"<br>") : "";
})();
(function(){
  var n=purgeDamagedMaster();
  /* A dialog thrown at you before the app has finished opening is the wrong
     way to say this: it lands over whatever you were reaching for. The Home
     screen carries the notice instead, and it waits until you look. */
  if(n) setTimeout(function(){
    var flag=document.getElementById("fixflag");
    if(flag){
      flag.classList.add("on");
      flag.innerHTML='<b>Master Compendium repaired.</b> '+n+" card"+(n===1?"":"s")+
        " had been added by an older version and carried no rules text, so "+
        (n===1?"it was":"they were")+" removed. Your own cards are untouched \u2014 add "+
        "them to the Master again and the whole card comes across. "+
        '<span style="color:var(--dim);">A copy of the old Master is kept on this device.</span>';
      return;
    }
    say("Master Compendium repaired",
      "<p><b>"+n+"</b> card"+(n===1?"":"s")+" had been promoted with the rules "+
      "boxes missing \u2014 promotion was saving the list summary instead of the "+
      "card. That is fixed.</p>"+
      "<p>Those entries have been removed because the missing text cannot be "+
      "recovered from them. Your own cards are untouched, so promote them "+
      "again. A copy of the old Master is kept on this device.</p>");
  }, 900);
})();
renderLauncher();
var h=(location.hash||"").replace("#/","");
if(VIEWS[h]) go(h);
else if(pageById(h)){ stubId=h; go(pageById(h).soon?"stub":h); }
else go("home");
window.addEventListener("hashchange",function(){
  var n=(location.hash||"").replace("#/","");
  if(VIEWS[n]&&n!==cur) go(n);
  else if(pageById(n)&&pageById(n).soon&&stubId!==n){ stubId=n; go("stub"); }
});
})();
</script>
